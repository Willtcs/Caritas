<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>廁所馬桶管理系統App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (xlsx) for Excel files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- 適用於 iOS 主畫面 -->
    <link rel="apple-touch-icon" sizes="180x180" href="toilet_icon.png">

    <!-- 適用於 一般瀏覽器 Favicon (可一併設定) -->
    <link rel="icon" type="image/png" sizes="32x32" href="toilet_icon.png">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        morandi: {
                            bg: '#EBECEB',        // iOS neutral gray canvas
                            card: '#FFFFFF',      // Crisp card bg
                            dark: '#2F3E46',      // Charcoal header & main text
                            slate: '#5C6B73',     // Secondary slate text
                            sky: '#7A8B99',       // Accent blue-gray
                            light: '#D9DEDE',     // Borders / dividers
                            rose: '#B86B6B',      // Destructive red
                            sage: '#7C8C7A',      // Success / Dorm green
                            amber: '#C59A6F',     // Alert amber
                            tag: '#F0F2F2'
                        }
                    },
                    boxShadow: {
                        'ios': '0 4px 18px -2px rgba(47, 62, 70, 0.05)',
                        'ios-sheet': '0 -10px 30px rgba(0, 0, 0, 0.15)',
                        'ios-nav': '0 -2px 12px rgba(0,0,0,0.04)',
                        'pill': '0 10px 25px -5px rgba(47, 62, 70, 0.15), 0 8px 10px -6px rgba(47, 62, 70, 0.1)'
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: #EBECEB;
            color: #2F3E46;
            user-select: none;
            overflow-x: hidden;
        }

        .modal-blur {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .tab-blur {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white !important;
                color: black !important;
            }
            .print-card {
                box-shadow: none !important;
                border: 1px solid #ccc !important;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body class="min-h-screen text-morandi-dark antialiased">

    <!-- 頂部 Toast Notification（僅用於手動同步提示） -->
    <div id="toastNotification" class="fixed top-4 inset-x-4 z-50 flex justify-center pointer-events-none transition-all duration-300 opacity-0 -translate-y-4">
        <div class="bg-morandi-dark/95 backdrop-blur-md text-white px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 text-xs font-medium max-w-sm">
            <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toastMessage">通知訊息</span>
        </div>
    </div>

    <!-- App Container -->
    <div class="max-w-md mx-auto min-h-screen flex flex-col bg-morandi-bg relative shadow-2xl border-x border-morandi-light/30">

        <!-- 第一行：iOS Top Header -->
        <header class="sticky top-0 z-30 bg-morandi-bg/90 modal-blur border-b border-morandi-light/70 px-4 pt-3 pb-3 no-print">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                    <div class="w-9 h-9 rounded-2xl bg-morandi-dark text-white flex items-center justify-center shadow-sm">
                        <i class="fa-solid fa-toilet text-sm"></i>
                    </div>
                    <div>
                        <h1 class="text-base font-bold tracking-tight text-morandi-dark leading-tight">廁所馬桶管理系統</h1>
                        <p class="text-[11px] text-morandi-slate font-semibold tracking-wider mt-0.5">Toilet Management System</p>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <!-- 雲加向上箭頭圖示：手動同步上傳至雲端 -->
                    <button onclick="smartSync(false)" title="手動同步更新至雲端" class="w-9 h-9 rounded-full bg-morandi-card border border-morandi-light text-morandi-dark hover:opacity-80 active:scale-95 transition-transform flex items-center justify-center shadow-sm">
                        <i class="fa-solid fa-cloud-arrow-up text-sm" id="headerSyncIcon"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 pt-2 pb-28 space-y-2">

            <!-- 總覽區域視圖容器 (Tab 2: 總覽) -->
            <div id="tabOverviewSection" class="space-y-4 transition-all duration-200 hidden">
                
                <!-- 區域獨立單行區塊 (總數量) -->
                <div class="space-y-1.5 no-print">
                    <span class="text-base font-medium text-morandi-slate block pl-0.5">總數量</span>
                    <div class="bg-morandi-card border border-morandi-light/80 rounded-xl p-3 shadow-ios space-y-2">
                        <!-- 第一行：日校 -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <div class="w-7 h-7 rounded-lg bg-morandi-sky/15 text-morandi-sky flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-school"></i>
                                </div>
                                <span class="text-base font-medium text-morandi-slate">日校</span>
                            </div>
                            <h2 id="daySchoolCount" class="text-base font-bold text-morandi-dark">0</h2>
                        </div>
                        <div class="border-t border-morandi-light/40"></div>
                        <!-- 第二行：宿舍 -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <div class="w-7 h-7 rounded-lg bg-morandi-sage/15 text-morandi-sage flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-bed"></i>
                                </div>
                                <span class="text-base font-medium text-morandi-slate">宿舍</span>
                            </div>
                            <h2 id="dormCount" class="text-base font-bold text-morandi-dark">0</h2>
                        </div>
                    </div>
                </div>

                <!-- 第二區塊：扲掣位置 (顯示3行) -->
                <div class="space-y-1.5 no-print">
                    <span class="text-base font-medium text-morandi-slate block pl-0.5">扲掣位置</span>
                    <div class="bg-morandi-card border border-morandi-light/80 rounded-xl p-3 shadow-ios space-y-2">
                        <!-- 第一行：左側 -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <div class="w-7 h-7 rounded-lg bg-[#A4E9FF]/40 text-morandi-dark flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-hand-pointer"></i>
                                </div>
                                <span class="text-base font-medium text-morandi-slate">左側</span>
                            </div>
                            <span id="countFlushLeft" class="text-base font-bold text-morandi-dark">0</span>
                        </div>
                        <div class="border-t border-morandi-light/40"></div>
                        <!-- 第二行：頂按壓 -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <div class="w-7 h-7 rounded-lg bg-[#C387C2]/30 text-morandi-dark flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-circle-down"></i>
                                </div>
                                <span class="text-base font-medium text-morandi-slate">頂按壓</span>
                            </div>
                            <span id="countFlushTop" class="text-base font-bold text-morandi-dark">0</span>
                        </div>
                        <div class="border-t border-morandi-light/40"></div>
                        <!-- 第三行：前右側 -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <div class="w-7 h-7 rounded-lg bg-[#D4F1D8]/70 text-morandi-dark flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-hand"></i>
                                </div>
                                <span class="text-base font-medium text-morandi-slate">前右側</span>
                            </div>
                            <span id="countFlushFrontRight" class="text-base font-bold text-morandi-dark">0</span>
                        </div>
                    </div>
                </div>

                <!-- 第三區塊：水源 (顯示2行/依原本數據顯示鹹水與淡水) -->
                <div class="space-y-1.5 no-print">
                    <span class="text-base font-medium text-morandi-slate block pl-0.5">水源</span>
                    <div class="bg-morandi-card border border-morandi-light/80 rounded-xl p-3 shadow-ios space-y-2">
                        <!-- 第一行：左側/鹹水 -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <div class="w-7 h-7 rounded-lg bg-[#5CC2C6]/20 text-morandi-sky flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-water"></i>
                                </div>
                                <span class="text-base font-medium text-morandi-slate">鹹水</span>
                            </div>
                            <span id="countWaterSalt" class="text-base font-bold text-morandi-sky">0</span>
                        </div>
                        <div class="border-t border-morandi-light/40"></div>
                        <!-- 第二行：頂按壓/淡水 -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <div class="w-7 h-7 rounded-lg bg-[#FA85B9]/20 text-morandi-sky flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-droplet"></i>
                                </div>
                                <span class="text-base font-medium text-morandi-slate">淡水</span>
                            </div>
                            <span id="countWaterFresh" class="text-base font-bold text-morandi-sky">0</span>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 馬桶資料清單區域 (Tab 1: 資料) -->
            <div id="tabDataSection" class="space-y-2.5">
                
                <!-- 展開/收疊式篩選區塊（左邊搜尋輸入，右側向下箭頭展開，最右側為圓圈箭頭重設按鈕） -->
                <section class="bg-morandi-card border border-morandi-light/80 rounded-2xl shadow-ios no-print overflow-hidden transition-all duration-200">
                    
                    <div class="p-2.5 flex items-center gap-1.5">
                        <!-- 左邊搜尋輸入框 -->
                        <div class="relative flex-1 flex items-center">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 text-morandi-slate/60 text-xs"></i>
                            <input type="text" id="searchInput" onfocus="expandFilterAccordion()" oninput="applyFilters()" placeholder="搜尋關鍵字..." class="w-full bg-morandi-bg border border-morandi-light/70 text-morandi-dark text-xs rounded-xl pl-8 pr-7 py-2 focus:outline-none focus:border-morandi-sky transition-colors">
                            <button type="button" id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2 text-morandi-slate/50 hover:text-morandi-dark p-0.5">
                                <i class="fa-solid fa-circle-xmark text-xs"></i>
                            </button>
                        </div>

                        <!-- 右側向下箭頭展開按鈕（含右上角啟用提示圓點） -->
                        <button type="button" onclick="toggleFilterAccordion()" aria-label="展開或收疊篩選" class="w-9 h-9 rounded-xl bg-morandi-bg border border-morandi-light/70 text-morandi-slate hover:text-morandi-dark active:scale-95 transition-transform flex items-center justify-center relative shrink-0">
                            <span id="activeFilterDot" class="hidden absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-morandi-dark"></span>
                            <i id="filterAccordionArrow" class="fa-solid fa-chevron-down text-xs transition-transform duration-200"></i>
                        </button>

                        <!-- 最右側重設按鈕（純圖示：圓圈箭頭） -->
                        <button type="button" onclick="resetAllFilters()" aria-label="重設篩選" class="w-9 h-9 rounded-xl bg-morandi-bg border border-morandi-light/70 text-morandi-dark hover:opacity-80 active:scale-95 transition-transform flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-rotate-left text-xs"></i>
                        </button>
                    </div>

                    <!-- 可收疊的膠囊複選篩選內容區域（無「全部」選項，均分伸展至整個區塊寬度） -->
                    <div id="filterAccordionContent" class="hidden border-t border-morandi-light/50 p-2.5 space-y-2 bg-morandi-bg/30">
                        <!-- 1. 區域膠囊容器 -->
                        <div class="bg-morandi-light/60 p-1 rounded-xl flex gap-1 text-xs font-medium text-morandi-slate">
                            <button type="button" id="btnAreaDay" data-val="日校" onclick="toggleFilterOption('Area', '日校')" class="filter-btn-Area flex-1 py-1.5 rounded-lg transition-all text-center">日校</button>
                            <button type="button" id="btnAreaDorm" data-val="宿舍" onclick="toggleFilterOption('Area', '宿舍')" class="filter-btn-Area flex-1 py-1.5 rounded-lg transition-all text-center">宿舍</button>
                        </div>

                        <!-- 2. 樓層膠囊容器 -->
                        <div class="bg-morandi-light/60 p-1 rounded-xl flex gap-1 text-xs font-medium text-morandi-slate">
                            <button type="button" id="btnFloorGF" data-val="G/F" onclick="toggleFilterOption('Floor', 'G/F')" class="filter-btn-Floor flex-1 py-1.5 rounded-lg transition-all text-center">G/F</button>
                            <button type="button" id="btnFloor1F" data-val="1/F" onclick="toggleFilterOption('Floor', '1/F')" class="filter-btn-Floor flex-1 py-1.5 rounded-lg transition-all text-center">1/F</button>
                        </div>

                        <!-- 3. 扲掣位置膠囊容器 -->
                        <div class="bg-morandi-light/60 p-1 rounded-xl flex gap-1 text-xs font-medium text-morandi-slate">
                            <button type="button" id="btnFlushFR" data-val="前右側" onclick="toggleFilterOption('Flush', '前右側')" class="filter-btn-Flush flex-1 py-1.5 rounded-lg transition-all text-center">前右側</button>
                            <button type="button" id="btnFlushLeft" data-val="左側" onclick="toggleFilterOption('Flush', '左側')" class="filter-btn-Flush flex-1 py-1.5 rounded-lg transition-all text-center">左側</button>
                            <button type="button" id="btnFlushTop" data-val="頂按壓" onclick="toggleFilterOption('Flush', '頂按壓')" class="filter-btn-Flush flex-1 py-1.5 rounded-lg transition-all text-center">頂按壓</button>
                        </div>

                        <!-- 4. 水源膠囊容器 -->
                        <div class="bg-morandi-light/60 p-1 rounded-xl flex gap-1 text-xs font-medium text-morandi-slate">
                            <button type="button" id="btnWaterFresh" data-val="淡水" onclick="toggleFilterOption('Water', '淡水')" class="filter-btn-Water flex-1 py-1.5 rounded-lg transition-all text-center">淡水</button>
                            <button type="button" id="btnWaterSalt" data-val="鹹水" onclick="toggleFilterOption('Water', '鹹水')" class="filter-btn-Water flex-1 py-1.5 rounded-lg transition-all text-center">鹹水</button>
                        </div>
                    </div>
                </section>

                <!-- 資料列表區塊 -->
                <section class="space-y-2 pt-0.5">
                    <div class="flex items-center justify-between px-1">
                        <div class="flex items-center space-x-1.5">
                            <span class="text-xs font-bold text-morandi-dark">馬桶資料清單</span>
                            <span id="recordBadge" class="bg-morandi-light/80 text-morandi-dark text-xs font-semibold px-2 py-0.5 rounded-full">0 筆</span>
                        </div>
                    </div>

                    <!-- 雲端下載載入中圖示（載入時版面空白並顯示此載入圖示） -->
                    <div id="loadingState" class="hidden py-14 text-center bg-morandi-card rounded-2xl border border-morandi-light/80 shadow-ios">
                        <i class="fa-solid fa-spinner fa-spin text-2xl text-morandi-dark mb-2"></i>
                        <p class="text-xs font-medium text-morandi-slate">資料載入中...</p>
                    </div>

                    <div id="dataList" class="space-y-2.5"></div>

                    <div id="emptyState" class="hidden text-center py-12 px-4 bg-morandi-card rounded-2xl border border-dashed border-morandi-light">
                        <div class="w-12 h-12 bg-morandi-bg rounded-2xl text-morandi-slate mx-auto flex items-center justify-center text-xl mb-2">
                            <i class="fa-solid fa-folder-open"></i>
                        </div>
                        <p class="text-xs font-semibold text-morandi-dark">尚未有任何馬桶資料</p>
                        <p class="text-[11px] text-morandi-slate mt-1">請點擊上方同步按鈕，以同步雲端資料</p>
                    </div>
                </section>
            </div>
        </main>

        <!-- 底部浮動藥丸式 Tab Bar (預設高亮左側資料 TAB) -->
        <nav class="fixed bottom-5 left-1/2 -translate-x-1/2 z-40 no-print">
            <div class="bg-morandi-dark/90 tab-blur border border-white/20 rounded-full p-1.5 shadow-pill flex items-center space-x-1">
                <!-- Tab 1: 資料 (左側 Icon) -->
                <button id="navTabData" onclick="switchMainTab('data')" title="資料" class="w-12 h-12 rounded-full flex items-center justify-center text-white bg-white/20 transition-all duration-200 active:scale-90">
                    <i class="fa-solid fa-list-check text-base"></i>
                </button>

                <!-- Tab 2: 總覽 (右側 Icon) -->
                <button id="navTabOverview" onclick="switchMainTab('overview')" title="總覽" class="w-12 h-12 rounded-full flex items-center justify-center text-white/60 hover:text-white hover:bg-white/10 transition-all duration-200 active:scale-90">
                    <i class="fa-solid fa-gauge-high text-base"></i>
                </button>
            </div>
        </nav>

    </div>

    <!-- 修改資料 Modal -->
    <div id="editModal" class="fixed inset-0 z-50 flex items-center sm:items-center justify-center bg-morandi-dark/40 modal-blur hidden opacity-0 transition-opacity duration-200 no-print">
        <div class="bg-morandi-card w-full max-w-md rounded-2xl p-5 shadow-ios transform transition-transform duration-200 border border-morandi-light max-h-[85vh] overflow-y-auto">
            <div class="w-12 h-1 bg-morandi-light rounded-full mx-auto mb-3 sm:hidden"></div>
            
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-morandi-light"> 
                <h3 class="text-base font-bold text-morandi-dark flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-morandi-sky"></i>
                    <span>修改馬桶資料</span>
                </h3>
                <button onclick="closeModal('editModal')" class="text-morandi-slate hover:text-morandi-dark p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <form id="editForm" onsubmit="saveEdit(event)" class="space-y-3">
                <input type="hidden" id="editRowIndex">
                <div id="editFormFields" class="grid grid-cols-2 gap-2.5"></div>

                <!-- 底部按鈕區：左確認、右刪除 -->
                <div class="pt-3 flex gap-2">
                    <button type="submit" class="flex-1 py-2.5 bg-morandi-dark text-white rounded-xl text-base font-semibold hover:bg-morandi-dark/90 transition-colors shadow-sm">
                        確認
                    </button>
                    <button type="button" onclick="deleteFromModal()" class="flex-1 py-2.5 bg-morandi-rose text-white rounded-xl text-base font-semibold hover:bg-morandi-rose/90 transition-colors shadow-sm">
                        刪除
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 自訂提示視窗 -->
    <div id="alertModal" class="fixed inset-0 z-50 flex items-center justify-center bg-morandi-dark/40 modal-blur hidden opacity-0 transition-opacity duration-200 no-print px-6">
        <div class="bg-morandi-card w-full max-w-xs rounded-2xl p-4 shadow-ios text-center space-y-3 border border-morandi-light">
            <div id="alertIcon" class="w-10 h-10 rounded-full bg-morandi-rose/15 text-morandi-rose mx-auto flex items-center justify-center text-lg">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h4 id="alertTitle" class="text-base font-bold text-morandi-dark">提示</h4>
            <p id="alertMessage" class="text-base text-morandi-slate leading-relaxed">訊息內容</p>
            <button onclick="closeModal('alertModal')" class="w-full py-2 bg-morandi-dark text-white rounded-xl text-base font-semibold">
                確定 (Esc)
            </button>
        </div>
    </div>

    <!-- JavaScript 邏輯程式碼 -->
    <script>
        function getGoogleSheetUrl() {
            return "https://script.google.com/macros/s/AKfycbykaagxVH6IBJR8pzlmJ4WifHHgElX4imHDQVDnmT71sVN-fjFMU6AEvF4ZJKmKQMvv/exec";
        }

        // 預設為空白，無預載資料
        let rawData = [];
        let headers = ["區域", "樓層", "扲掣位置1", "扲掣位置2", "水源1", "水源2"];
        let currentTab = 'data';
        let lastUpdated = 0;
        let hasUnsavedLocalChanges = false;
        let isLoadingCloud = false;
        let isFilterExpanded = false;
        let toastTimer = null;

        // 當前膠囊複選狀態（陣列為空代表顯示全部）
        let selectedAreas = [];
        let selectedFloors = [];
        let selectedFlushes = [];
        let selectedWaters = [];

        // Toast Notification 顯示函式
        function showToast(message, type = 'success', duration = 2600) {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = message;

            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
            } else if (type === 'loading') {
                toastIcon.className = 'fa-solid fa-spinner fa-spin text-amber-300';
            } else if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-exclamation text-red-400';
            }

            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            if (toastTimer) clearTimeout(toastTimer);
            if (duration > 0) {
                toastTimer = setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                    toast.classList.add('opacity-0', '-translate-y-4');
                }, duration);
            }
        }

        // 控制資料版面載入中狀態
        function setLoadingState(loading) {
            isLoadingCloud = loading;
            const loadingState = document.getElementById('loadingState');
            const dataList = document.getElementById('dataList');
            const emptyState = document.getElementById('emptyState');

            if (loading) {
                loadingState.classList.remove('hidden');
                dataList.classList.add('hidden');
                emptyState.classList.add('hidden');
            } else {
                loadingState.classList.add('hidden');
                dataList.classList.remove('hidden');
            }
        }

        // 切換篩選展開/收疊
        function toggleFilterAccordion() {
            const content = document.getElementById('filterAccordionContent');
            const arrow = document.getElementById('filterAccordionArrow');
            isFilterExpanded = !isFilterExpanded;

            if (isFilterExpanded) {
                content.classList.remove('hidden');
                arrow.style.transform = 'rotate(180deg)';
            } else {
                content.classList.add('hidden');
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        function expandFilterAccordion() {
            if (!isFilterExpanded) {
                toggleFilterAccordion();
            }
        }

        // 更新篩選按鈕右上角提示圓點狀態
        function checkActiveFilterDot() {
            const dot = document.getElementById('activeFilterDot');
            const hasFilter = selectedAreas.length > 0 || selectedFloors.length > 0 || selectedFlushes.length > 0 || selectedWaters.length > 0;
            if (hasFilter) {
                dot.classList.remove('hidden');
            } else {
                dot.classList.add('hidden');
            }
        }

        // 底部 Tab 切換
        function switchMainTab(tab) {
            currentTab = tab;
            const overviewSec = document.getElementById('tabOverviewSection');
            const dataSec = document.getElementById('tabDataSection');
            const navOverview = document.getElementById('navTabOverview');
            const navData = document.getElementById('navTabData');

            if (tab === 'data') {
                overviewSec.classList.add('hidden'); 
                dataSec.classList.remove('hidden');
                navData.className = "w-12 h-12 rounded-full flex items-center justify-center text-white bg-white/20 transition-all duration-200 active:scale-90";
                navOverview.className = "w-12 h-12 rounded-full flex items-center justify-center text-white/60 hover:text-white hover:bg-white/10 transition-all duration-200 active:scale-90";
            } else {
                overviewSec.classList.remove('hidden');
                dataSec.classList.add('hidden');
                navOverview.className = "w-12 h-12 rounded-full flex items-center justify-center text-white bg-white/20 transition-all duration-200 active:scale-90";
                navData.className = "w-12 h-12 rounded-full flex items-center justify-center text-white/60 hover:text-white hover:bg-white/10 transition-all duration-200 active:scale-90";
            }
        }

        // 開啟 App 時：不載入預載資料（版面保持空白並顯示載入中圖示），直接向雲端下載最新資料，且不彈出 Toast
        window.onload = function() {
            rawData = [];
            updateCounts();
            switchMainTab('data');
            smartSync(true);
        };

        function filterOutExcludedHeaders() {
            headers = headers.filter(h => h !== "馬桶類型" && h !== "狀態" && h !== "扲掣位置" && h !== "水源");
        }

        // 標記本地資料被修改
        function markDataModified() {
            lastUpdated = new Date().getTime();
            hasUnsavedLocalChanges = true;
            
            localStorage.setItem('toilet_system_data', JSON.stringify(rawData));
            localStorage.setItem('toilet_system_headers', JSON.stringify(headers));
            localStorage.setItem('toilet_system_last_updated', lastUpdated.toString());
            localStorage.setItem('toilet_system_has_changes', "true");
        }

        function updateCounts() {
            let dayCount = 0;
            let dormCount = 0;

            let leftCount = 0;
            let topCount = 0;
            let frontRightCount = 0;
            let saltCount = 0;
            let freshCount = 0;

            const keyQty = headers.find(h => h.includes("數量") || h.includes("數")) || "數量";

            rawData.forEach(item => {
                // 1. 計算區域總數（日校 / 宿舍）
                const areaVal = String(item["區域"] || item["區域類別"] || Object.values(item).join(' '));
                const qty = parseInt(item[keyQty] || item["數量"], 10) || 1;

                if (areaVal.includes("日校")) {
                    dayCount += qty;
                } else if (areaVal.includes("宿舍")) {
                    dormCount += qty;
                }

                // 2. 獨立統計 扲掣位置 1、2、3
                ['扲掣位置1', '扲掣位置2', '扲掣位置3', '扲掣位置 1', '扲掣位置 2', '扲掣位置 3'].forEach(fKey => {
                    if (item[fKey] !== undefined) {
                        const val = String(item[fKey]).trim();
                        if (val === '左側') leftCount++;
                        if (val === '頂按壓') topCount++;
                        if (val === '前右側') frontRightCount++;
                    }
                });

                // 3. 獨立統計 水源 1、2、3
                ['水源1', '水源2', '水源3', '水源 1', '水源 2', '水源 3'].forEach(wKey => {
                    if (item[wKey] !== undefined) {
                        const val = String(item[wKey]).trim();
                        if (val === '鹹水') saltCount++;
                        if (val === '淡水') freshCount++;
                    }
                });
            });
            
            document.getElementById('daySchoolCount').innerText = dayCount;
            document.getElementById('dormCount').innerText = dormCount;

            document.getElementById('countFlushLeft').innerText = leftCount;
            document.getElementById('countFlushTop').innerText = topCount;
            document.getElementById('countFlushFrontRight').innerText = frontRightCount;
            document.getElementById('countWaterSalt').innerText = saltCount;
            document.getElementById('countWaterFresh').innerText = freshCount;
        }

        // 膠囊複選切換邏輯（無「全部」選項；陣列為空時代表顯示全部）
        function toggleFilterOption(type, val) {
            let targetArr;
            if (type === 'Area') targetArr = selectedAreas;
            else if (type === 'Floor') targetArr = selectedFloors;
            else if (type === 'Flush') targetArr = selectedFlushes;
            else if (type === 'Water') targetArr = selectedWaters;

            const idx = targetArr.indexOf(val);
            if (idx > -1) targetArr.splice(idx, 1);
            else targetArr.push(val);

            updateFilterStyles();
            renderList();
        }

        function updateFilterStyles() {
            const activeClassSuffix = "flex-1 py-1.5 rounded-lg transition-all text-center bg-morandi-card text-morandi-dark shadow-sm font-bold";
            const inactiveClassSuffix = "flex-1 py-1.5 rounded-lg transition-all text-center text-morandi-slate font-medium";

            document.querySelectorAll('.filter-btn-Area').forEach(btn => {
                const v = btn.getAttribute('data-val');
                btn.className = `filter-btn-Area ${selectedAreas.includes(v) ? activeClassSuffix : inactiveClassSuffix}`;
            });
            document.querySelectorAll('.filter-btn-Floor').forEach(btn => {
                const v = btn.getAttribute('data-val');
                btn.className = `filter-btn-Floor ${selectedFloors.includes(v) ? activeClassSuffix : inactiveClassSuffix}`;
            });
            document.querySelectorAll('.filter-btn-Flush').forEach(btn => {
                const v = btn.getAttribute('data-val');
                btn.className = `filter-btn-Flush ${selectedFlushes.includes(v) ? activeClassSuffix : inactiveClassSuffix}`;
            });
            document.querySelectorAll('.filter-btn-Water').forEach(btn => {
                const v = btn.getAttribute('data-val');
                btn.className = `filter-btn-Water ${selectedWaters.includes(v) ? activeClassSuffix : inactiveClassSuffix}`;
            });

            checkActiveFilterDot();
        }

        function resetAllFilters() {
            selectedAreas = [];
            selectedFloors = [];
            selectedFlushes = [];
            selectedWaters = [];
            document.getElementById('searchInput').value = "";
            document.getElementById('clearSearchBtn').classList.add('hidden');
            updateFilterStyles();
            renderList();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = "";
            document.getElementById('clearSearchBtn').classList.add('hidden');
            applyFilters();
        }

        function applyFilters() {
            const searchVal = document.getElementById('searchInput').value.trim();
            document.getElementById('clearSearchBtn').classList.toggle('hidden', searchVal === '');
            renderList();
        }

        function renderList() {
            if (isLoadingCloud) return;

            const container = document.getElementById('dataList');
            const emptyState = document.getElementById('emptyState');
            container.innerHTML = '';

            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();

            const keyArea = headers.find(h => h.includes("區域")) || "區域";
            const keyFloor = headers.find(h => h.includes("樓層") || h.includes("層樓")) || "層樓";

            const getTagBgColor = (text) => {
                switch (text) {
                    case '前右側': return 'bg-[#D4F1D8]/70 text-morandi-dark';
                    case '左側': return 'bg-[#A4E9FF]/70 text-morandi-dark';
                    case '頂按壓': return 'bg-[#C387C2]/40 text-morandi-dark';
                    case '淡水': return 'bg-[#FA85B9]/20 text-morandi-dark';
                    case '鹹水': return 'bg-[#5CC2C6]/20 text-morandi-dark';
                    default: return 'bg-morandi-tag text-morandi-slate';
                }
            };

            let filtered = rawData.filter((row, originalIndex) => {
                row._origIndex = originalIndex;

                if (selectedAreas.length > 0 && !selectedAreas.includes(String(row[keyArea] || '').trim())) return false;
                if (selectedFloors.length > 0 && !selectedFloors.includes(String(row[keyFloor] || '').trim())) return false;

                if (selectedFlushes.length > 0) {
                    const f1 = String(row["扲掣位置1"] || row["扲掣位置 1"] || "").trim();
                    const f2 = String(row["扲掣位置2"] || row["扲掣位置 2"] || "").trim();
                    const f3 = String(row["扲掣位置3"] || row["扲掣位置 3"] || "").trim();
                    const rowFlushes = [f1, f2, f3].filter(Boolean);
                    if (!selectedFlushes.some(sel => rowFlushes.includes(sel))) return false;
                }

                if (selectedWaters.length > 0) {
                    const w1 = String(row["水源1"] || row["水源 1"] || "").trim();
                    const w2 = String(row["水源2"] || row["水源 2"] || "").trim();
                    const w3 = String(row["水源3"] || row["水源 3"] || "").trim();
                    const rowWaters = [w1, w2, w3].filter(Boolean);
                    if (!selectedWaters.some(sel => rowWaters.includes(sel))) return false;
                }

                if (searchVal) {
                    const match = Object.values(row).some(v => String(v).toLowerCase().includes(searchVal));
                    if (!match) return false;
                }

                return true;
            });

            document.getElementById('recordBadge').innerText = `${filtered.length} 筆`;

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach((row) => {
                const card = document.createElement('div');
                card.onclick = () => openEditModal(row._origIndex);
                card.className = "bg-morandi-card border border-morandi-light/80 rounded-2xl p-3.5 shadow-ios flex items-center justify-between cursor-pointer hover:border-morandi-sky/50 active:scale-[0.99] transition-all print-card";

                const keyRoomNo = headers.find(h => h.includes("房號")) || "房號";
                const keyRoomName = headers.find(h => h.includes("房名")) || "房名";
                const keyQty = headers.find(h => h.includes("數量") || h.includes("數")) || "數量";

                let displayFloor = row[keyFloor] || "";
                let roomNoVal = row[keyRoomNo] || "";
                let roomNameVal = row[keyRoomName] || "";
                let displayRoomCombined = [roomNoVal, roomNameVal].filter(Boolean).join(" ");
                let displayArea = row[keyArea] || "";

                let flush1 = row["扲掣位置1"] || row["扲掣位置 1"] || "";
                let flush2 = row["扲掣位置2"] || row["扲掣位置 2"] || "";
                let flush3 = row["扲掣位置3"] || row["扲掣位置 3"] || "";
                let water1 = row["水源1"] || row["水源 1"] || "";
                let water2 = row["水源2"] || row["水源 2"] || "";
                let water3 = row["水源3"] || row["水源 3"] || "";

                let displayQty = row[keyQty] || "1";

                card.innerHTML = `
                    <div class="space-y-1.5 pr-2 flex-1">
                        <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                            ${displayRoomCombined ? `<span class="text-base font-semibold text-morandi-dark/90">${displayRoomCombined}</span>` : ''}
                            ${displayFloor ? `<span class="text-xs px-2 py-0.5 rounded-full font-semibold ${displayFloor.includes('G/F') ? 'bg-[#FFDBBA]' : 'bg-[#FF8894]/70'}">${displayFloor}</span>` : ''}
                            ${displayArea ? `<span class="text-xs px-2 py-0.5 rounded-full font-semibold ${displayArea.includes('日校') ? 'bg-[#A1E0DD]' : 'bg-[#5EA8E6]/50'}">${displayArea}</span>` : ''}
                        </div>

                        <!-- 扲掣位置與水源標籤區塊 -->
                        <div class="flex flex-wrap items-center gap-1">
                            ${flush1 ? `<span class="inline-block ${getTagBgColor(flush1)} text-[10px] px-2 py-0.5 rounded-md font-medium">${flush1}</span>` : ''}
                            ${water1 ? `<span class="inline-block ${getTagBgColor(water1)} text-[10px] px-2 py-0.5 rounded-md font-medium">${water1}</span>` : ''}
                            ${flush2 ? `<span class="inline-block ${getTagBgColor(flush2)} text-[10px] px-2 py-0.5 rounded-md font-medium">${flush2}</span>` : ''}
                            ${water2 ? `<span class="inline-block ${getTagBgColor(water2)} text-[10px] px-2 py-0.5 rounded-md font-medium">${water2}</span>` : ''}
                            ${flush3 ? `<span class="inline-block ${getTagBgColor(flush3)} text-[10px] px-2 py-0.5 rounded-md font-medium">${flush3}</span>` : ''}
                            ${water3 ? `<span class="inline-block ${getTagBgColor(water3)} text-[10px] px-2 py-0.5 rounded-md font-medium">${water3}</span>` : ''}
                        </div>
                    </div>

                    <!-- 右側數量數字 -->
                    <div class="flex items-center pr-6 pl-1.5 no-print">
                        <span class="text-base font-bold text-morandi-dark tracking-tight">${displayQty}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openEditModal(index) {
            const row = rawData[index];
            if (!row) return;

            document.getElementById('editRowIndex').value = index;
            const fieldsContainer = document.getElementById('editFormFields');
            fieldsContainer.innerHTML = '';
            fieldsContainer.className = "grid grid-cols-2 gap-2.5";

            const optionPresets = {
                "樓層": ["G/F", "1/F"],
                "層樓": ["G/F", "1/F"],
                "區域": ["日校", "宿舍"],
                "數量": ["1", "2", "3", "4", "5"],
                "扲掣位置1": ["", "左側", "頂按壓", "前右側"],
                "扲掣位置2": ["", "左側", "頂按壓", "前右側"],
                "扲掣位置3": ["", "左側", "頂按壓", "前右側"],
                "水源1": ["", "淡水", "鹹水"],
                "水源2": ["", "淡水", "鹹水"],
                "水源3": ["", "淡水", "鹹水"]
            };

            headers.forEach(h => {
                if (h === "馬桶類型" || h === "狀態" || h === "扲掣位置" || h === "水源") return;

                const wrapper = document.createElement('div');
                wrapper.className = h.includes("備註") ? "col-span-2" : "col-span-1";

                const currentValue = row[h] !== undefined ? row[h] : '';

                if (optionPresets[h]) {
                    const optionsList = [...optionPresets[h]];
                    if (currentValue && !optionsList.includes(currentValue)) {
                        optionsList.push(currentValue);
                    }

                    let optionsHtml = optionsList.map(opt => 
                        `<option value="${opt}" ${opt === currentValue ? 'selected' : ''}>${opt === "" ? "(無/空白)" : opt}</option>`
                    ).join('');

                    wrapper.innerHTML = `
                        <label class="block text-[11px] font-semibold text-morandi-slate mb-1">${h}</label>
                        <select name="${h}" class="w-full bg-morandi-bg border border-morandi-light text-morandi-dark text-xs rounded-xl p-2.5 focus:outline-none focus:border-morandi-sky">
                            ${optionsHtml}
                        </select>
                    `;
                } else {
                    wrapper.innerHTML = `
                        <label class="block text-[11px] font-semibold text-morandi-slate mb-1">${h}</label>
                        <input type="text" name="${h}" value="${currentValue}" class="w-full bg-morandi-bg border border-morandi-light text-morandi-dark text-xs rounded-xl p-2.5 focus:outline-none focus:border-morandi-sky">
                    `;
                }
                fieldsContainer.appendChild(wrapper);
            });

            openModal('editModal');
        }

        function saveEdit(e) {
            e.preventDefault();
            const index = parseInt(document.getElementById('editRowIndex').value);
            if (isNaN(index) || !rawData[index]) return;

            const formData = new FormData(e.target);
            headers.forEach(h => {
                if (h !== "馬桶類型" && h !== "狀態" && h !== "扲掣位置" && h !== "水源") {
                    rawData[index][h] = formData.get(h) || '';
                }
            });

            markDataModified();
            renderList();
            updateCounts();
            closeModal('editModal');
        }

        function deleteFromModal() {
            const index = parseInt(document.getElementById('editRowIndex').value);
            if (isNaN(index) || !rawData[index]) return;

            deleteRow(index);
            closeModal('editModal');
        }

        function deleteRow(index) {
            if (confirm("確定要刪除此筆馬桶資料嗎？")) {
                rawData.splice(index, 1);
                markDataModified();
                renderList();
                updateCounts();
            }
        }

        // 同步邏輯
        function smartSync(isAuto = false) {
            const url = getGoogleSheetUrl();

            if (!url || url.includes("PLACEHOLDER")) {
                if (!isAuto) showToast("請先確認程式碼中的 Web App 網址設定正確！", "error");
                return;
            }

            const headerIcon = document.getElementById('headerSyncIcon');

            if (!isAuto) {
                // 手動按同步至雲端
                if (headerIcon) headerIcon.className = 'fa-solid fa-spinner fa-spin text-sm';
                showToast("正在同步至雲端...", "loading", 0);
                pushToGoogleSheets(url, headerIcon);
            } else {
                // 開啟 App 從雲端下載：顯示版面載入圖示、無預載資料、不彈出 Toast
                setLoadingState(true);
                fetch(url + "?t=" + new Date().getTime())
                    .then(res => res.json())
                    .then(cloudRes => {
                        if (cloudRes.data && cloudRes.headers) {
                            headers = cloudRes.headers;
                            rawData = cloudRes.data;
                            filterOutExcludedHeaders();
                            
                            lastUpdated = cloudRes.lastUpdated || new Date().getTime();
                            hasUnsavedLocalChanges = false;
                            
                            localStorage.setItem('toilet_system_data', JSON.stringify(rawData));
                            localStorage.setItem('toilet_system_headers', JSON.stringify(headers));
                            localStorage.setItem('toilet_system_last_updated', lastUpdated.toString());
                            localStorage.setItem('toilet_system_has_changes', "false");
                        } else {
                            rawData = [];
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        rawData = [];
                    })
                    .finally(() => {
                        setLoadingState(false);
                        renderList();
                        updateCounts();
                    });
            }
        }

        function pushToGoogleSheets(url, headerIcon) {
            const payload = JSON.stringify({
                headers: headers,
                data: rawData,
                lastUpdated: lastUpdated
            });

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: payload
            })
            .then(res => res.json())
            .then(res => {
                if (headerIcon) headerIcon.className = 'fa-solid fa-cloud-arrow-up text-sm';

                if (res.status === "success") {
                    lastUpdated = res.lastUpdated || lastUpdated;
                    hasUnsavedLocalChanges = false;
                    
                    localStorage.setItem('toilet_system_last_updated', lastUpdated.toString());
                    localStorage.setItem('toilet_system_has_changes', "false");
                    
                    showToast("已成功同步至雲端", "success", 2500);
                } else {
                    showToast("雲端已有更新的資料，請重新整理", "error", 3000);
                }
            })
            .catch(err => {
                if (headerIcon) headerIcon.className = 'fa-solid fa-cloud-arrow-up text-sm';
                showToast("同步失敗，請檢查網路連線", "error", 3000);
            });
        }

        function openModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
            }, 10);
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' || e.keyCode === 27) {
                closeModal('editModal');
                closeModal('alertModal');
            }
        });

        function showAlert(title, message, iconClass = "fa-triangle-exclamation", iconColor = "text-morandi-rose") {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            const iconContainer = document.getElementById('alertIcon');
            iconContainer.className = `w-10 h-10 rounded-full bg-morandi-bg ${iconColor} mx-auto flex items-center justify-center text-lg`;
            iconContainer.innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
            openModal('alertModal');
        }
    </script>
</body>
