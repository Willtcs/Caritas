<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>廁所馬桶管理系統App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (xlsx) for Excel files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- 適用於 iOS 主畫面 -->
    <link rel="apple-touch-icon" sizes="180x180" href="toilet_icon.png">

    <!-- 適用於 一般瀏覽器 Favicon (可一併設定) -->
    <link rel="icon" type="image/png" sizes="32x32" href="toilet_icon.png">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        morandi: {
                            bg: '#EBECEB',        // iOS neutral gray canvas
                            card: '#FFFFFF',      // Crisp card bg
                            dark: '#2F3E46',      // Charcoal header & main text
                            slate: '#5C6B73',     // Secondary slate text
                            sky: '#7A8B99',       // Accent blue-gray
                            light: '#D9DEDE',     // Borders / dividers
                            rose: '#B86B6B',      // Destructive red
                            sage: '#7C8C7A',      // Success / Dorm green
                            amber: '#C59A6F',     // Alert amber
                            tag: '#F0F2F2'
                        }
                    },
                    boxShadow: {
                        'ios': '0 4px 18px -2px rgba(47, 62, 70, 0.05)',
                        'ios-sheet': '0 -10px 30px rgba(0, 0, 0, 0.15)',
                        'ios-nav': '0 -2px 12px rgba(0,0,0,0.04)',
                        'pill': '0 10px 25px -5px rgba(47, 62, 70, 0.15), 0 8px 10px -6px rgba(47, 62, 70, 0.1)'
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: #EBECEB;
            color: #2F3E46;
            user-select: none;
            overflow-x: hidden;
        }

        .modal-blur {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .tab-blur {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white !important;
                color: black !important;
            }
            .print-card {
                box-shadow: none !important;
                border: 1px solid #ccc !important;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body class="min-h-screen text-morandi-dark antialiased">

    <!-- App Container -->
    <div class="max-w-md mx-auto min-h-screen flex flex-col bg-morandi-bg relative shadow-2xl border-x border-morandi-light/30">

        <!-- 第一行：iOS Top Header -->
        <header class="sticky top-0 z-30 bg-morandi-bg/90 modal-blur border-b border-morandi-light/70 px-4 pt-3 pb-3 no-print">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                    <div class="w-9 h-9 rounded-2xl bg-morandi-dark text-white flex items-center justify-center shadow-sm">
                        <i class="fa-solid fa-toilet text-sm"></i>
                    </div>
                    <div>
                        <h1 class="text-base font-bold tracking-tight text-morandi-dark leading-tight">廁所馬桶管理系統</h1>
                        <p id="syncStatus" class="text-[10px] text-morandi-slate flex items-center gap-1 font-medium mt-0.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-morandi-sage inline-block"></span>
                            <span id="syncText">本地已同步</span>
                        </p>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <!-- 手動點擊同步 (將本地修改同步上傳至雲端) -->
                    <button onclick="smartSync(false)" title="手動同步更新至雲端" class="w-8 h-8 rounded-full bg-morandi-card border border-morandi-light text-morandi-slate hover:text-morandi-dark active:scale-95 transition-transform flex items-center justify-center shadow-sm">
                        <i class="fa-solid fa-rotate text-xs" id="headerSyncSpinner"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <!--區塊與頂部邊距 -->
        <main class="flex-1 p-4 pt-1.5 pb-28 space-y-1.5">

            <!-- 總覽區域視圖容器 (Tab 1: 總覽) -->
            <div id="tabOverviewSection" class="space-y-3 transition-all duration-200">
                <!-- 日校宿舍馬桶數量（單行顯示） -->
                <section class="grid grid-cols-2 gap-2.5 no-print">
                    <div class="bg-morandi-card border border-morandi-light/80 rounded-2xl p-5 px-3 shadow-ios flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <div class="w-7 h-7 rounded-lg bg-morandi-sky/15 text-morandi-sky flex items-center justify-center text-12">
                                <i class="fa-solid fa-school"></i>
                            </div>
                            <span class="text-xs font-semibold text-morandi-slate">日校</span>
                        </div>
                        <h2 id="daySchoolCount" class="text-lg font-bold text-morandi-dark">0</h2>
                    </div>

                    <div class="bg-morandi-card border border-morandi-light/80 rounded-2xl p-5 px-3 shadow-ios flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <div class="w-7 h-7 rounded-lg bg-morandi-sage/15 text-morandi-sage flex items-center justify-center text-12">
                                <i class="fa-solid fa-bed"></i>
                            </div>
                            <span class="text-xs font-semibold text-morandi-slate">宿舍</span>
                        </div>
                        <h2 id="dormCount" class="text-lg font-bold text-morandi-dark">0</h2>
                    </div>
                </section>

                <!-- 宿舍區塊下方 5 個統計區塊 (扲掣位置與水源相加總數) -->
                <section class="grid gap-2.5 no-print">
                    <!-- 1. 左側 -->
                    <div class="bg-[#A4E9FF]/70 border border-morandi-light/80 rounded-2xl p-2.5 px-3 shadow-ios flex items-center justify-between">
                        <div class="flex items-center space-x-1.5">
                            <i class="fa-solid fa-hand-pointer text-morandi-slate/70 text-xs"></i>
                            <span class="text-xs font-medium text-morandi-slate">左側</span>
                        </div>
                        <span id="countFlushLeft" class="text-sm font-bold text-morandi-dark">0</span>
                    </div>

                    <!-- 2. 頂按壓 -->
                    <div class="bg-[#C387C2]/40 border border-morandi-light/80 rounded-2xl p-2.5 px-3 shadow-ios flex items-center justify-between">
                        <div class="flex items-center space-x-1.5">
                            <i class="fa-solid fa-circle-down text-morandi-slate/70 text-xs"></i>
                            <span class="text-xs font-medium text-morandi-slate">頂按壓</span>
                        </div>
                        <span id="countFlushTop" class="text-sm font-bold text-morandi-dark">0</span>
                    </div>

                    <!-- 3. 前右側 -->
                    <div class="bg-[#D4F1D8]/70 border border-morandi-light/80 rounded-2xl p-2.5 px-3 shadow-ios flex items-center justify-between">
                        <div class="flex items-center space-x-1.5">
                            <i class="fa-solid fa-hand text-morandi-slate/70 text-xs"></i>
                            <span class="text-xs font-medium text-morandi-slate">前右側</span>
                        </div>
                        <span id="countFlushFrontRight" class="text-sm font-bold text-morandi-dark">0</span>
                    </div>

                    <!-- 4. 鹹水 -->
                    <div class="bg-[#5CC2C6]/20 border border-morandi-light/80 rounded-2xl p-2.5 px-3 shadow-ios flex items-center justify-between">
                        <div class="flex items-center space-x-1.5">
                            <i class="fa-solid fa-water text-morandi-sky text-xs"></i>
                            <span class="text-xs font-medium text-morandi-slate">鹹水</span>
                        </div>
                        <span id="countWaterSalt" class="text-sm font-bold text-morandi-sky">0</span>
                    </div>

                    <!-- 5. 淡水 -->
                    <div class="bg-[#FA85B9]/20 border border-morandi-light/80 rounded-2xl p-2.5 px-3 shadow-ios flex items-center justify-between">
                        <div class="flex items-center space-x-1.5">
                            <i class="fa-solid fa-droplet text-morandi-sky text-xs"></i>
                            <span class="text-xs font-medium text-morandi-slate">淡水</span>
                        </div>
                        <span id="countWaterFresh" class="text-sm font-bold text-morandi-sky">0</span>
                    </div>
                </section>
            </div>

            <!-- 馬桶資料清單區域 (僅在 Tab 2: 資料 顯示) -->
            <div id="tabDataSection" class="space-y-2 hidden -mt-2.5">
                
                <!-- 全按鈕式分段篩選區塊 -->
                <section class="bg-morandi-card border border-morandi-light/80 rounded-2xl p-3 shadow-ios space-y-2.5 no-print !mt-0">
                    
                    <!-- 1. 區域切換按鈕 -->
                    <div class="space-y-1">
                        <div class="bg-morandi-light/50 p-0.5 rounded-xl flex text-xs font-medium text-morandi-slate">
                            <button id="btnAreaAll" onclick="setFilterBtn('Area', '')" class="flex-1 py-1 rounded-lg transition-all text-center bg-morandi-card text-morandi-dark shadow-sm font-bold">全部</button>
                            <button id="btnAreaDay" onclick="setFilterBtn('Area', '日校')" class="flex-1 py-1 rounded-lg transition-all text-center">日校</button>
                            <button id="btnAreaDorm" onclick="setFilterBtn('Area', '宿舍')" class="flex-1 py-1 rounded-lg transition-all text-center">宿舍</button>
                        </div>
                    </div>

                    <!-- 2. 樓層切換按鈕 -->
                    <div class="space-y-1">
                        <div class="bg-morandi-light/50 p-0.5 rounded-xl flex text-xs font-medium text-morandi-slate">
                            <button id="btnFloorAll" onclick="setFilterBtn('Floor', '')" class="flex-1 py-1 rounded-lg transition-all text-center bg-morandi-card text-morandi-dark shadow-sm font-bold">全部</button>
                            <button id="btnFloorGF" onclick="setFilterBtn('Floor', 'G/F')" class="flex-1 py-1 rounded-lg transition-all text-center">G/F</button>
                            <button id="btnFloor1F" onclick="setFilterBtn('Floor', '1/F')" class="flex-1 py-1 rounded-lg transition-all text-center">1/F</button>
                        </div>
                    </div>

                    <!-- 3. 扲掣位置切換按鈕 -->
                    <div class="space-y-1">
                        <div class="bg-morandi-light/50 p-0.5 rounded-xl flex text-xs font-medium text-morandi-slate">
                            <button id="btnFlushAll" onclick="setFilterBtn('Flush', '')" class="flex-1 py-1 rounded-lg transition-all text-center bg-morandi-card text-morandi-dark shadow-sm font-bold">全部</button>
                            <button id="btnFlushFR" onclick="setFilterBtn('Flush', '前右側')" class="flex-1 py-1 rounded-lg transition-all text-center">前右側</button>
                            <button id="btnFlushLeft" onclick="setFilterBtn('Flush', '左側')" class="flex-1 py-1 rounded-lg transition-all text-center">左側</button>
                            <button id="btnFlushTop" onclick="setFilterBtn('Flush', '頂按壓')" class="flex-1 py-1 rounded-lg transition-all text-center">頂按壓</button>
                        </div>
                    </div>

                    <!-- 4. 水源切換按鈕 -->
                    <div class="space-y-1">
                        <div class="bg-morandi-light/50 p-0.5 rounded-xl flex text-xs font-medium text-morandi-slate">
                            <button id="btnWaterAll" onclick="setFilterBtn('Water', '')" class="flex-1 py-1 rounded-lg transition-all text-center bg-morandi-card text-morandi-dark shadow-sm font-bold">全部</button>
                            <button id="btnWaterFresh" onclick="setFilterBtn('Water', '淡水')" class="flex-1 py-1 rounded-lg transition-all text-center">淡水</button>
                            <button id="btnWaterSalt" onclick="setFilterBtn('Water', '鹹水')" class="flex-1 py-1 rounded-lg transition-all text-center">鹹水</button>
                        </div>
                    </div>

                    <!-- 下方：左側搜尋功能，右側僅圖示重置按鈕 -->
                    <div class="flex items-center space-x-2 pt-1 border-t border-morandi-light/50">
                        <div class="relative flex-1 flex items-center">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 text-morandi-slate/60 text-xs"></i>
                            <input type="text" id="searchInput" oninput="applyFilters()" placeholder="搜尋關鍵字..." class="w-full bg-morandi-bg border border-morandi-light/70 text-morandi-dark text-xs rounded-xl pl-8 pr-8 py-1.5 focus:outline-none focus:border-morandi-sky transition-colors">
                            <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 text-morandi-slate/50 hover:text-morandi-dark p-1">
                                <i class="fa-solid fa-circle-xmark text-xs"></i>
                            </button>
                        </div>

                        <!-- 右側重置按鈕 (僅顯示 Icon) -->
                        <button onclick="resetAllFilters()" title="重置篩選" class="w-8 h-8 rounded-xl bg-morandi-bg border border-morandi-light text-morandi-rose hover:bg-morandi-rose/10 active:scale-95 transition-all flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-rotate-left text-xs"></i>
                        </button>
                    </div>
                </section>

                <!-- 資料列表區塊 -->
                <section class="space-y-2 pt-1">
                    <div class="flex items-center justify-between px-1">
                        <div class="flex items-center space-x-1.5">
                            <span class="text-xs font-bold text-morandi-dark">馬桶資料清單</span>
                            <span id="recordBadge" class="bg-morandi-light/80 text-morandi-dark text-[10px] font-semibold px-2 py-0.5 rounded-full">0 筆</span>
                        </div>
                    </div>

                    <div id="dataList" class="space-y-2.5"></div>

                    <div id="emptyState" class="hidden text-center py-12 px-4 bg-morandi-card rounded-2xl border border-dashed border-morandi-light">
                        <div class="w-12 h-12 bg-morandi-bg rounded-2xl text-morandi-slate mx-auto flex items-center justify-center text-xl mb-2">
                            <i class="fa-solid fa-folder-open"></i>
                        </div>
                        <p class="text-xs font-semibold text-morandi-dark">尚未有任何馬桶資料</p>
                        <p class="text-[11px] text-morandi-slate mt-1">請點擊上方同步按鈕，以同步雲端資料</p>
                    </div>
                </section>
            </div>
        </main>

        <!-- 底部浮動藥丸式 Tab Bar -->
        <nav class="fixed bottom-5 left-1/2 -translate-x-1/2 z-40 no-print">
            <div class="bg-morandi-dark/90 tab-blur border border-white/20 rounded-full p-1.5 shadow-pill flex items-center space-x-1">
                <!-- Tab 1: 總覽 (左側 Icon) -->
                <button id="navTabOverview" onclick="switchMainTab('overview')" title="總覽" class="w-12 h-12 rounded-full flex items-center justify-center text-white bg-white/20 transition-all duration-200 active:scale-90">
                    <i class="fa-solid fa-gauge-high text-base"></i>
                </button>
                
                <!-- Tab 2: 資料 (右側 Icon) -->
                <button id="navTabData" onclick="switchMainTab('data')" title="資料" class="w-12 h-12 rounded-full flex items-center justify-center text-white/60 hover:text-white hover:bg-white/10 transition-all duration-200 active:scale-90">
                    <i class="fa-solid fa-list-check text-base"></i>
                </button>
            </div>
        </nav>

    </div>

    <!-- 修改資料 Modal -->
    <div id="editModal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-morandi-dark/40 modal-blur hidden opacity-0 transition-opacity duration-200 no-print">
        <div class="bg-morandi-card w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 shadow-ios-sheet transform transition-transform duration-200 border-t sm:border border-morandi-light max-h-[85vh] overflow-y-auto">
            <div class="w-12 h-1 bg-morandi-light rounded-full mx-auto mb-3 sm:hidden"></div>
            
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-morandi-light">
                <h3 class="text-base font-bold text-morandi-dark flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-morandi-sky"></i>
                    <span>修改馬桶資料</span>
                </h3>
                <button onclick="closeModal('editModal')" class="text-morandi-slate hover:text-morandi-dark p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <form id="editForm" onsubmit="saveEdit(event)" class="space-y-3">
                <input type="hidden" id="editRowIndex">
                <div id="editFormFields" class="space-y-2.5"></div>

                <!-- 底部按鈕區：左確認、右刪除 -->
                <div class="pt-3 flex gap-2">
                    <button type="submit" class="flex-1 py-2.5 bg-morandi-dark text-white rounded-xl text-xs font-semibold hover:bg-morandi-dark/90 transition-colors shadow-sm">
                        確認
                    </button>
                    <button type="button" onclick="deleteFromModal()" class="flex-1 py-2.5 bg-morandi-rose text-white rounded-xl text-xs font-semibold hover:bg-morandi-rose/90 transition-colors shadow-sm">
                        刪除
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 自訂提示視窗 -->
    <div id="alertModal" class="fixed inset-0 z-50 flex items-center justify-center bg-morandi-dark/40 modal-blur hidden opacity-0 transition-opacity duration-200 no-print px-6">
        <div class="bg-morandi-card w-full max-w-xs rounded-2xl p-4 shadow-ios text-center space-y-3 border border-morandi-light">
            <div id="alertIcon" class="w-10 h-10 rounded-full bg-morandi-rose/15 text-morandi-rose mx-auto flex items-center justify-center text-lg">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h4 id="alertTitle" class="text-sm font-bold text-morandi-dark">提示</h4>
            <p id="alertMessage" class="text-xs text-morandi-slate leading-relaxed">訊息內容</p>
            <button onclick="closeModal('alertModal')" class="w-full py-2 bg-morandi-dark text-white rounded-xl text-xs font-semibold">
                確定 (Esc)
            </button>
        </div>
    </div>

    <!-- JavaScript 邏輯程式碼 -->
    <script>
        function getGoogleSheetUrl() {
            return "https://script.google.com/macros/s/AKfycbykaagxVH6IBJR8pzlmJ4WifHHgElX4imHDQVDnmT71sVN-fjFMU6AEvF4ZJKmKQMvv/exec";
        }

        let rawData = [];
        let headers = [];
        let currentTab = 'overview';
        let lastUpdated = 0;
        let hasUnsavedLocalChanges = false;

        // 當前按鈕式篩選狀態
        let selectedArea = '';
        let selectedFloor = '';
        let selectedFlush = '';
        let selectedWater = '';

        const sampleData = [
            { "區域": "日校", "樓層": "1/F", "扲掣位置1": "左側", "扲掣位置2": "", "水源1": "淡水", "水源2": "" },
            { "區域": "日校", "樓層": "1/F", "扲掣位置1": "頂按壓", "扲掣位置2": "左側", "水源1": "鹹水", "水源2": "淡水" },
            { "區域": "宿舍", "樓層": "G/F", "扲掣位置1": "左側", "扲掣位置2": "", "水源1": "鹹水", "水源2": "" }
        ];

        // 底部 Tab 切換
        function switchMainTab(tab) {
            currentTab = tab;
            const overviewSec = document.getElementById('tabOverviewSection');
            const dataSec = document.getElementById('tabDataSection');
            const navOverview = document.getElementById('navTabOverview');
            const navData = document.getElementById('navTabData');

            if (tab === 'overview') {
                overviewSec.classList.remove('hidden');
                dataSec.classList.add('hidden');
                navOverview.className = "w-12 h-12 rounded-full flex items-center justify-center text-white bg-white/20 transition-all duration-200 active:scale-90";
                navData.className = "w-12 h-12 rounded-full flex items-center justify-center text-white/60 hover:text-white hover:bg-white/10 transition-all duration-200 active:scale-90";
            } else {
                overviewSec.classList.add('hidden');
                dataSec.classList.remove('hidden');
                navOverview.className = "w-12 h-12 rounded-full flex items-center justify-center text-white/60 hover:text-white hover:bg-white/10 transition-all duration-200 active:scale-90";
                navData.className = "w-12 h-12 rounded-full flex items-center justify-center text-white bg-white/20 transition-all duration-200 active:scale-90";
            }
        }

        // 開啟 App 時：載入快取，並自動向雲端下載最新資料
        window.onload = function() {
            const savedData = localStorage.getItem('toilet_system_data');
            const savedHeaders = localStorage.getItem('toilet_system_headers');
            const savedTime = localStorage.getItem('toilet_system_last_updated');
            const savedChanges = localStorage.getItem('toilet_system_has_changes');

            if (savedData && savedHeaders) {
                try {
                    rawData = JSON.parse(savedData);
                    headers = JSON.parse(savedHeaders);
                    lastUpdated = parseInt(savedTime || "0");
                    hasUnsavedLocalChanges = (savedChanges === "true");
                } catch(e) {
                    loadDefaultSample();
                }
            } else {
                loadDefaultSample();
            }

            filterOutExcludedHeaders();
            renderList();
            updateCounts();

            // 強制下載雲端資料 (isAuto = true)
            smartSync(true);
        };

        function filterOutExcludedHeaders() {
            headers = headers.filter(h => h !== "馬桶類型" && h !== "狀態" && h !== "扲掣位置" && h !== "水源");
        }

        function loadDefaultSample() {
            rawData = JSON.parse(JSON.stringify(sampleData));
            headers = ["區域", "樓層", "扲掣位置1", "扲掣位置2", "水源1", "水源2"];
            markDataModified();
        }

        // 標記本地資料被修改
        function markDataModified() {
            lastUpdated = new Date().getTime();
            hasUnsavedLocalChanges = true;
            
            localStorage.setItem('toilet_system_data', JSON.stringify(rawData));
            localStorage.setItem('toilet_system_headers', JSON.stringify(headers));
            localStorage.setItem('toilet_system_last_updated', lastUpdated.toString());
            localStorage.setItem('toilet_system_has_changes', "true");
            
            document.getElementById('syncText').innerText = "本地已修改 (未同步)";
        }

        function updateCounts() {
    let dayCount = 0;
    let dormCount = 0;

    let leftCount = 0;
    let topCount = 0;
    let frontRightCount = 0;
    let saltCount = 0;
    let freshCount = 0;

    const keyQty = headers.find(h => h.includes("數量") || h.includes("數")) || "數量";

    rawData.forEach(item => {
        // 1. 計算區域總數（日校 / 宿舍）
        const areaVal = String(item["區域"] || item["區域類別"] || Object.values(item).join(' '));
        const qty = parseInt(item[keyQty] || item["數量"], 10) || 1;

        if (areaVal.includes("日校")) {
            dayCount += qty;
        } else if (areaVal.includes("宿舍")) {
            dormCount += qty;
        }

        // 2. 獨立統計 扲掣位置 1、2、3 每個儲存格出現的次數 (自動去除空白)
        ['扲掣位置1', '扲掣位置2', '扲掣位置3', '扲掣位置 1', '扲掣位置 2', '扲掣位置 3'].forEach(fKey => {
            if (item[fKey] !== undefined) {
                const val = String(item[fKey]).trim();
                if (val === '左側') leftCount++;
                if (val === '頂按壓') topCount++;
                if (val === '前右側') frontRightCount++;
            }
        });

        // 3. 獨立統計 水源 1、2、3 每個儲存格出現的次數 (自動去除空白)
        ['水源1', '水源2', '水源3', '水源 1', '水源 2', '水源 3'].forEach(wKey => {
            if (item[wKey] !== undefined) {
                const val = String(item[wKey]).trim();
                if (val === '鹹水') saltCount++;
                if (val === '淡水') freshCount++;
            }
        });
    });
    
    // 更新 DOM 顯示
    document.getElementById('daySchoolCount').innerText = dayCount;
    document.getElementById('dormCount').innerText = dormCount;

    document.getElementById('countFlushLeft').innerText = leftCount;
    document.getElementById('countFlushTop').innerText = topCount;
    document.getElementById('countFlushFrontRight').innerText = frontRightCount;
    document.getElementById('countWaterSalt').innerText = saltCount;
    document.getElementById('countWaterFresh').innerText = freshCount;
}

        // 按鈕式篩選切換邏輯
        function setFilterBtn(type, val) {
            const inactiveClass = "flex-1 py-1 rounded-lg transition-all text-center";
            const activeClass = "flex-1 py-1 rounded-lg transition-all text-center bg-morandi-card text-morandi-dark shadow-sm font-bold";

            if (type === 'Area') {
                selectedArea = val;
                document.getElementById('btnAreaAll').className = val === '' ? activeClass : inactiveClass;
                document.getElementById('btnAreaDay').className = val === '日校' ? activeClass : inactiveClass;
                document.getElementById('btnAreaDorm').className = val === '宿舍' ? activeClass : inactiveClass;
            } else if (type === 'Floor') {
                selectedFloor = val;
                document.getElementById('btnFloorAll').className = val === '' ? activeClass : inactiveClass;
                document.getElementById('btnFloorGF').className = val === 'G/F' ? activeClass : inactiveClass;
                document.getElementById('btnFloor1F').className = val === '1/F' ? activeClass : inactiveClass;
            } else if (type === 'Flush') {
                selectedFlush = val;
                document.getElementById('btnFlushAll').className = val === '' ? activeClass : inactiveClass;
                document.getElementById('btnFlushFR').className = val === '前右側' ? activeClass : inactiveClass;
                document.getElementById('btnFlushLeft').className = val === '左側' ? activeClass : inactiveClass;
                document.getElementById('btnFlushTop').className = val === '頂按壓' ? activeClass : inactiveClass;
            } else if (type === 'Water') {
                selectedWater = val;
                document.getElementById('btnWaterAll').className = val === '' ? activeClass : inactiveClass;
                document.getElementById('btnWaterFresh').className = val === '淡水' ? activeClass : inactiveClass;
                document.getElementById('btnWaterSalt').className = val === '鹹水' ? activeClass : inactiveClass;
            }

            renderList();
        }

        function resetAllFilters() {
            setFilterBtn('Area', '');
            setFilterBtn('Floor', '');
            setFilterBtn('Flush', '');
            setFilterBtn('Water', '');
            document.getElementById('searchInput').value = "";
            document.getElementById('clearSearchBtn').classList.add('hidden');
            renderList();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = "";
            document.getElementById('clearSearchBtn').classList.add('hidden');
            applyFilters();
        }

        function applyFilters() {
            const searchVal = document.getElementById('searchInput').value.trim();
            document.getElementById('clearSearchBtn').classList.toggle('hidden', searchVal === '');
            renderList();
        }

        function renderList() {
            const container = document.getElementById('dataList');
            const emptyState = document.getElementById('emptyState');
            container.innerHTML = '';

            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();

            const keyArea = headers.find(h => h.includes("區域")) || "區域";
            // 修正：同時支援「樓層」與「層樓」
            const keyFloor = headers.find(h => h.includes("樓層") || h.includes("層樓")) || "層樓";

            // 根據篩選條件設定標籤背景顏色
            const getTagBgColor = (text) => {
                switch (text) {
                    case '前右側': return 'bg-[#D4F1D8]/70 text-morandi-dark';
                    case '左側': return 'bg-[#A4E9FF]/70 text-morandi-dark';
                    case '頂按壓': return 'bg-[#C387C2]/40 text-morandi-dark';
                    case '淡水': return 'bg-[#FA85B9]/20 text-morandi-dark';
                    case '鹹水': return 'bg-[#5CC2C6]/20 text-morandi-dark';
                    default: return 'bg-morandi-tag text-morandi-slate';
                }
            };

            let filtered = rawData.filter((row, originalIndex) => {
                row._origIndex = originalIndex;

                // 精確比對區域與層樓（自動 trim 去除空格）
                if (selectedArea && String(row[keyArea] || '').trim() !== selectedArea) return false;
                if (selectedFloor && String(row[keyFloor] || '').trim() !== selectedFloor) return false;

                if (selectedFlush) {
                    const f1 = row["扲掣位置1"] || "";
                    const f2 = row["扲掣位置2"] || "";
                    const f3 = row["扲掣位置3"] || "";
                    if (f1 !== selectedFlush && f2 !== selectedFlush && f3 !== selectedFlush) return false;
                }

                if (selectedWater) {
                    const w1 = row["水源1"] || "";
                    const w2 = row["水源2"] || "";
                    const w3 = row["水源3"] || "";
                    if (w1 !== selectedWater && w2 !== selectedWater && w3 !== selectedWater) return false;
                }

                if (searchVal) {
                    const match = Object.values(row).some(v => String(v).toLowerCase().includes(searchVal));
                    if (!match) return false;
                }

                return true;
            });

            document.getElementById('recordBadge').innerText = `${filtered.length} 筆`;

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach((row) => {
                const card = document.createElement('div');
                card.onclick = () => openEditModal(row._origIndex);
                card.className = "bg-morandi-card border border-morandi-light/80 rounded-2xl p-3.5 shadow-ios flex items-center justify-between cursor-pointer hover:border-morandi-sky/50 active:scale-[0.99] transition-all print-card";

                const keyArea = headers.find(h => h.includes("區域")) || "區域";
                const keyFloor = headers.find(h => h.includes("樓層") || h.includes("層樓")) || "層樓";
                const keyRoomNo = headers.find(h => h.includes("房號")) || "房號";
                const keyRoomName = headers.find(h => h.includes("房名")) || "房名";
                const keyQty = headers.find(h => h.includes("數量") || h.includes("數")) || "數量";

                let displayFloor = row[keyFloor] || "";
                let roomNoVal = row[keyRoomNo] || "";
                let roomNameVal = row[keyRoomName] || "";
                let displayRoomCombined = [roomNoVal, roomNameVal].filter(Boolean).join(" ");
                let displayArea = row[keyArea] || "";

                let flush1 = row["扲掣位置1"] || "";
                let flush2 = row["扲掣位置2"] || "";
                let flush3 = row["扲掣位置3"] || "";
                let water1 = row["水源1"] || "";
                let water2 = row["水源2"] || "";
                let water3 = row["水源3"] || "";

                let displayQty = row[keyQty] || "1";

                card.innerHTML = `
                    <div class="space-y-1.5 pr-2 flex-1">
                        <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                            ${displayRoomCombined ? `<span class="text-[12px] font-bold text-morandi-dark/90">${displayRoomCombined}</span>` : ''}
                            ${displayFloor ? `<span class="text-xs px-2 py-0.5 rounded-full font-semibold ${displayFloor.includes('G/F') ? 'bg-[#FFDBBA]' : 'bg-[#FF8894]/70'}">${displayFloor}</span>` : ''}
                            ${displayArea ? `<span class="text-xs px-2 py-0.5 rounded-full font-semibold ${displayArea.includes('日校') ? 'bg-[#A1E0DD]' : 'bg-[#5EA8E6]/50'}">${displayArea}</span>` : ''}
                        </div>

                        <!-- 扲掣位置與水源標籤區塊 -->
                        <div class="flex flex-wrap items-center gap-1">
                            ${flush1 ? `<span class="inline-block ${getTagBgColor(flush1)} text-[10px] px-2 py-0.5 rounded-md font-medium">${flush1}</span>` : ''}
                            ${water1 ? `<span class="inline-block ${getTagBgColor(water1)} text-[10px] px-2 py-0.5 rounded-md font-medium">${water1}</span>` : ''}
                            ${flush2 ? `<span class="inline-block ${getTagBgColor(flush2)} text-[10px] px-2 py-0.5 rounded-md font-medium">${flush2}</span>` : ''}
                            ${water2 ? `<span class="inline-block ${getTagBgColor(water2)} text-[10px] px-2 py-0.5 rounded-md font-medium">${water2}</span>` : ''}
                            ${flush3 ? `<span class="inline-block ${getTagBgColor(flush3)} text-[10px] px-2 py-0.5 rounded-md font-medium">${flush3}</span>` : ''}
                            ${water3 ? `<span class="inline-block ${getTagBgColor(water3)} text-[10px] px-2 py-0.5 rounded-md font-medium">${water3}</span>` : ''}
                        </div>
                    </div>

                    <div class="flex items-center space-x-2 pl-3 border-l border-morandi-light/60 no-print">
                        <div class="flex flex-col items-end">
                            <span class="text-[9px] text-morandi-slate font-medium">數量</span>
                            <span class="text-xs font-bold text-morandi-dark px-1.5 py-0.5 rounded-lg">${displayQty}</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-[10px] text-morandi-slate/40 ml-1"></i>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openEditModal(index) {
            const row = rawData[index];
            if (!row) return;

            document.getElementById('editRowIndex').value = index;
            const fieldsContainer = document.getElementById('editFormFields');
            fieldsContainer.innerHTML = '';

            const optionPresets = {
                "樓層": ["G/F", "1/F"],
                "區域": ["日校", "宿舍"],
                "數量": ["1", "2", "3", "4", "5"],
                "扲掣位置1": ["", "左側", "頂按壓", "前右側"],
                "扲掣位置2": ["", "左側", "頂按壓", "前右側"],
                "扲掣位置3": ["", "左側", "頂按壓", "前右側"],
                "水源1": ["", "淡水", "鹹水"],
                "水源2": ["", "淡水", "鹹水"],
                "水源3": ["", "淡水", "鹹水"]
            };

            headers.forEach(h => {
                if (h === "馬桶類型" || h === "狀態" || h === "扲掣位置" || h === "水源") return;

                const wrapper = document.createElement('div');
                const currentValue = row[h] !== undefined ? row[h] : '';

                if (optionPresets[h]) {
                    const optionsList = [...optionPresets[h]];
                    if (currentValue && !optionsList.includes(currentValue)) {
                        optionsList.push(currentValue);
                    }

                    let optionsHtml = optionsList.map(opt => 
                        `<option value="${opt}" ${opt === currentValue ? 'selected' : ''}>${opt === "" ? "(無/空白)" : opt}</option>`
                    ).join('');

                    wrapper.innerHTML = `
                        <label class="block text-[11px] font-semibold text-morandi-slate mb-1">${h}</label>
                        <select name="${h}" class="w-full bg-morandi-bg border border-morandi-light text-morandi-dark text-xs rounded-xl p-2.5 focus:outline-none focus:border-morandi-sky">
                            ${optionsHtml}
                        </select>
                    `;
                } else {
                    wrapper.innerHTML = `
                        <label class="block text-[11px] font-semibold text-morandi-slate mb-1">${h}</label>
                        <input type="text" name="${h}" value="${currentValue}" class="w-full bg-morandi-bg border border-morandi-light text-morandi-dark text-xs rounded-xl p-2.5 focus:outline-none focus:border-morandi-sky">
                    `;
                }
                fieldsContainer.appendChild(wrapper);
            });

            openModal('editModal');
        }

        function saveEdit(e) {
            e.preventDefault();
            const index = parseInt(document.getElementById('editRowIndex').value);
            if (isNaN(index) || !rawData[index]) return;

            const formData = new FormData(e.target);
            headers.forEach(h => {
                if (h !== "馬桶類型" && h !== "狀態" && h !== "扲掣位置" && h !== "水源") {
                    rawData[index][h] = formData.get(h) || '';
                }
            });

            markDataModified();
            renderList();
            updateCounts();
            closeModal('editModal');
        }

        function deleteFromModal() {
            const index = parseInt(document.getElementById('editRowIndex').value);
            if (isNaN(index) || !rawData[index]) return;

            deleteRow(index);
            closeModal('editModal');
        }

        function deleteRow(index) {
            if (confirm("確定要刪除此筆馬桶資料嗎？")) {
                rawData.splice(index, 1);
                markDataModified();
                renderList();
                updateCounts();
            }
        }

        // 同步邏輯
        function smartSync(isAuto = false) {
            const url = getGoogleSheetUrl();

            if (!url || url.includes("PLACEHOLDER")) {
                if (!isAuto) showAlert("提示", "請先確認程式碼中的 Web App 網址設定正確！");
                return;
            }

            const headerSpinner = document.getElementById('headerSyncSpinner');
            if (headerSpinner) headerSpinner.classList.add('fa-spin');

            if (!isAuto) {
                pushToGoogleSheets(url, isAuto, headerSpinner);
            } else {
                fetch(url + "?t=" + new Date().getTime())
                    .then(res => res.json())
                    .then(cloudRes => {
                        if (cloudRes.data && cloudRes.headers) {
                            headers = cloudRes.headers;
                            rawData = cloudRes.data;
                            filterOutExcludedHeaders();
                            
                            lastUpdated = cloudRes.lastUpdated || new Date().getTime();
                            hasUnsavedLocalChanges = false;
                            
                            localStorage.setItem('toilet_system_data', JSON.stringify(rawData));
                            localStorage.setItem('toilet_system_headers', JSON.stringify(headers));
                            localStorage.setItem('toilet_system_last_updated', lastUpdated.toString());
                            localStorage.setItem('toilet_system_has_changes', "false");

                            renderList();
                            updateCounts();
                        }

                        if (headerSpinner) headerSpinner.classList.remove('fa-spin');
                        document.getElementById('syncText').innerText = "已從雲端下載最新數據 (" + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ")";
                    })
                    .catch(err => {
                        if (headerSpinner) headerSpinner.classList.remove('fa-spin');
                        document.getElementById('syncText').innerText = "離線狀態 (使用本地資料)";
                    });
            }
        }

        function pushToGoogleSheets(url, isAuto, headerSpinner) {
            const payload = JSON.stringify({
                headers: headers,
                data: rawData,
                lastUpdated: lastUpdated
            });

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: payload
            })
            .then(res => res.json())
            .then(res => {
                if (headerSpinner) headerSpinner.classList.remove('fa-spin');

                if (res.status === "success") {
                    lastUpdated = res.lastUpdated || lastUpdated;
                    hasUnsavedLocalChanges = false;
                    
                    localStorage.setItem('toilet_system_last_updated', lastUpdated.toString());
                    localStorage.setItem('toilet_system_has_changes', "false");
                    
                    document.getElementById('syncText').innerText = "已成功上傳更新至雲端 (" + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ")";
                    if (!isAuto) showAlert("同步成功", "已將本地最新修改成功上傳至 Google Sheets！", "fa-circle-check", "text-morandi-sage");
                } else {
                    if (!isAuto) showAlert("同步提示", "雲端已有更新的資料，請重新整理。");
                }
            })
            .catch(err => {
                if (headerSpinner) headerSpinner.classList.remove('fa-spin');
                if (!isAuto) showAlert("同步失敗", "推送資料至雲端時發生錯誤，請檢查網路狀態。");
            });
        }

        function openModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
            }, 10);
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' || e.keyCode === 27) {
                closeModal('editModal');
                closeModal('alertModal');
            }
        });

        function showAlert(title, message, iconClass = "fa-triangle-exclamation", iconColor = "text-morandi-rose") {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            const iconContainer = document.getElementById('alertIcon');
            iconContainer.className = `w-10 h-10 rounded-full bg-morandi-bg ${iconColor} mx-auto flex items-center justify-center text-lg`;
            iconContainer.innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
            openModal('alertModal');
        }
    </script>
