<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>消防設備管理 App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (xlsx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 適用於 iOS 主畫面 -->
    <link rel="apple-touch-icon" sizes="180x180" href="fire_icon.png">

    <!-- 適用於 一般瀏覽器 Favicon (可一併設定) -->
    <link rel="icon" type="image/png" sizes="32x32" href="fire_icon.png">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ios: { 
                            bg: '#F2F2F7', 
                            card: '#FFFFFF', 
                            text: '#1C1C1E', 
                            subtext: '#8E8E93', 
                            morandi: '#5E4B56', 
                            accent: '#D1B3C4', 
                            border: '#E5E5EA' 
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; 
            background-color: #F2F2F7; 
            -webkit-tap-highlight-color: transparent;
        }
        .pb-safe { padding-bottom: calc(4.5rem + env(safe-area-inset-bottom)); }
        .pt-safe { padding-top: max(1rem, env(safe-area-inset-top)); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-ios-bg text-ios-text antialiased min-h-screen">

    <!-- 頂部 Navigation Bar -->
    <header class="bg-ios-card/80 backdrop-blur-md sticky top-0 z-30 border-b border-ios-border pt-safe px-4 pb-3">
        <div class="flex items-center justify-between">
            <div>
                <span class="text-xs font-semibold text-ios-subtext uppercase">Fire Safety Management</span>
                <h1 class="text-xl font-bold text-ios-text flex items-center gap-2">
                    消防設備管理
                    <span id="syncStatus" class="text-[10px] px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 font-medium">連線中...</span>
                </h1>
            </div>
            <div class="flex items-center space-x-2">
                <!-- 手動同步按鈕 -->
                <button onclick="fetchFromGoogleSheets()" class="w-9 h-9 rounded-full bg-ios-bg flex items-center justify-center text-ios-morandi active:scale-95 transition-transform" title="從 Google Sheets 重新讀取">
                    <i class="fa-solid fa-arrows-rotate text-base"></i>
                </button>
                <label class="hidden w-9 h-9 rounded-full bg-ios-bg flex items-center justify-center text-ios-morandi cursor-pointer active:scale-95 transition-transform" title="匯入 Excel">
                    <i class="fa-solid fa-file-excel text-base"></i>
                    <input type="file" id="excelFileInput" accept=".xls,.xlsx" class="hidden" onchange="handleExcelImport(event)">
                </label>
                <button onclick="confirmResetAllData()" class="w-9 h-9 rounded-full bg-ios-bg flex items-center justify-center text-red-500 active:scale-95 transition-transform" title="重設列表">
                    <i class="fa-solid fa-rotate-left text-base"></i>
                </button>
            </div>
        </div>

        <!-- 搜尋列 -->
        <div class="mt-3 relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-ios-subtext text-xs"></i>
            <input type="text" id="searchInput" oninput="handleSearchInput()" placeholder="搜尋層樓、位置或設備..." class="w-full bg-ios-bg pl-8 pr-4 py-1.5 text-xs rounded-xl focus:outline-none border border-ios-border/60">
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="px-3 py-4 space-y-4 pb-safe max-w-md mx-auto">

        <!-- 區塊 1: 數量統計（微調為 5 欄網格適應 iPhone 6.1" 螢幕） -->
        <section>
            <div class="flex items-center justify-between mb-2 px-1">
                <h2 class="text-xs font-bold text-ios-subtext uppercase tracking-wider">設備總數量統計</h2>
            </div>
            <!-- 5 欄單行佈局 -->
            <div class="grid grid-cols-5 gap-1.5">
                <!-- 乾粉滅火器 -->
                <div class="bg-ios-card px-1 py-2 rounded-xl border border-ios-border/60 shadow-sm flex flex-col items-center text-center">
                    <div class="w-6 h-6 rounded-full bg-ios-accent/30 text-ios-morandi flex items-center justify-center mb-1 text-xs">
                        <i class="fa-solid fa-bottle-droplet"></i>
                    </div>
                    <p class="text-[10px] text-ios-subtext font-medium truncate w-full">乾粉</p>
                    <p id="count-dry-powder" class="text-base font-bold text-ios-morandi">0</p>
                </div>
                <!-- CO2 滅火器 -->
                <div class="bg-ios-card px-1 py-2 rounded-xl border border-ios-border/60 shadow-sm flex flex-col items-center text-center">
                    <div class="w-6 h-6 rounded-full bg-ios-accent/30 text-ios-morandi flex items-center justify-center mb-1 text-xs">
                        <i class="fa-solid fa-cloud"></i>
                    </div>
                    <p class="text-[10px] text-ios-subtext font-medium truncate w-full">二氧化碳</p>
                    <p id="count-co2" class="text-base font-bold text-ios-morandi">0</p>
                </div>
                <!-- 泡沫滅火器 -->
                <div class="bg-ios-card px-1 py-2 rounded-xl border border-ios-border/60 shadow-sm flex flex-col items-center text-center">
                    <div class="w-6 h-6 rounded-full bg-ios-accent/30 text-ios-morandi flex items-center justify-center mb-1 text-xs">
                        <i class="fa-solid fa-soap"></i>
                    </div>
                    <p class="text-[10px] text-ios-subtext font-medium truncate w-full">泡沫</p>
                    <p id="count-foam" class="text-base font-bold text-ios-morandi">0</p>
                </div>
                <!-- 防火沙 -->
                <div class="bg-ios-card px-1 py-2 rounded-xl border border-ios-border/60 shadow-sm flex flex-col items-center text-center">
                    <div class="w-6 h-6 rounded-full bg-ios-accent/30 text-ios-morandi flex items-center justify-center mb-1 text-xs">
                        <i class="fa-solid fa-mound"></i>
                    </div>
                    <p class="text-[10px] text-ios-subtext font-medium truncate w-full">防火沙</p>
                    <p id="count-sand" class="text-base font-bold text-ios-morandi">0</p>
                </div>
                <!-- 防火毯 -->
                <div class="bg-ios-card px-1 py-2 rounded-xl border border-ios-border/60 shadow-sm flex flex-col items-center text-center">
                    <div class="w-6 h-6 rounded-full bg-ios-accent/30 text-ios-morandi flex items-center justify-center mb-1 text-xs">
                        <i class="fa-solid fa-rug"></i>
                    </div>
                    <p class="text-[10px] text-ios-subtext font-medium truncate w-full">防火毯</p>
                    <p id="count-blanket" class="text-base font-bold text-ios-morandi">0</p>
                </div>
            </div>
        </section>

        <!-- 區塊 2: 樓層 & 種類 快速篩選 -->
        <section class="space-y-2">
            <!-- 樓層篩選 -->
            <div class="bg-ios-border/50 p-1 rounded-xl flex gap-1">
                <button onclick="toggleFloorFilter('G/F')" data-floor="G/F" class="floor-btn flex-1 py-1.5 text-xs font-semibold rounded-lg text-ios-subtext transition-all">G/F 位置</button>
                <button onclick="toggleFloorFilter('1/F')" data-floor="1/F" class="floor-btn flex-1 py-1.5 text-xs font-semibold rounded-lg text-ios-subtext transition-all">1/F 位置</button>
            </div>

            <!-- 設備種類標籤 -->
            <div class="flex gap-1.5 overflow-x-auto no-scrollbar py-0.5" id="categoryFilterContainer">
                <button onclick="toggleCategoryFilter('乾粉滅火器')" data-category="乾粉滅火器" class="filter-btn px-3 py-1 rounded-full text-xs font-medium bg-ios-card border border-ios-border text-ios-subtext whitespace-nowrap">乾粉</button>
                <button onclick="toggleCategoryFilter('二氧化碳滅火器')" data-category="二氧化碳滅火器" class="filter-btn px-3 py-1 rounded-full text-xs font-medium bg-ios-card border border-ios-border text-ios-subtext whitespace-nowrap">CO₂</button>
                <button onclick="toggleCategoryFilter('泡沫滅火器')" data-category="泡沫滅火器" class="filter-btn px-3 py-1 rounded-full text-xs font-medium bg-ios-card border border-ios-border text-ios-subtext whitespace-nowrap">泡沫</button>
                <button onclick="toggleCategoryFilter('防火沙')" data-category="防火沙" class="filter-btn px-3 py-1 rounded-full text-xs font-medium bg-ios-card border border-ios-border text-ios-subtext whitespace-nowrap">防火沙</button>
                <button onclick="toggleCategoryFilter('防火毯')" data-category="防火毯" class="filter-btn px-3 py-1 rounded-full text-xs font-medium bg-ios-card border border-ios-border text-ios-subtext whitespace-nowrap">防火毯</button>
                <button onclick="resetFilters()" class="px-2.5 py-1 text-xs text-ios-morandi font-semibold whitespace-nowrap">重設</button>
            </div>
        </section>

        <!-- 區塊 3: 設備清單 -->
        <section class="space-y-2">
            <div id="equipmentListContainer" class="space-y-2"></div>
            <div id="emptyState" class="hidden py-10 text-center"><p class="text-xs text-ios-subtext">無符合條件的設備資料</p></div>
        </section>

    </main>

    <!-- 修改資料 Modal -->
    <div id="equipmentModal" class="fixed inset-0 z-50 hidden bg-black/40 backdrop-blur-sm flex items-end sm:items-center justify-center">
        <div class="bg-ios-card rounded-t-3xl sm:rounded-2xl w-full max-w-md p-5 space-y-4">
            <div class="flex justify-between items-center border-b border-ios-border pb-3">
                <h3 class="text-base font-bold text-ios-text">修改設備資料</h3>
                <button onclick="closeModal()" class="text-ios-subtext text-xl"><i class="fa-solid fa-circle-xmark"></i></button>
            </div>
            <form id="equipmentForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <input type="hidden" id="editIndex" value="-1">
                <div>
                    <label class="block text-xs text-ios-subtext mb-1">層樓</label>
                    <input type="text" id="formFloor" required class="w-full bg-ios-bg px-3 py-2 rounded-xl text-xs focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-ios-subtext mb-1">位置</label>
                    <input type="text" id="formLocation" required class="w-full bg-ios-bg px-3 py-2 rounded-xl text-xs focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-ios-subtext mb-1">種類</label>
                    <select id="formType" class="w-full bg-ios-bg px-3 py-2 rounded-xl text-xs focus:outline-none">
                        <option value="乾粉滅火器">乾粉滅火器</option>
                        <option value="二氧化碳滅火器">二氧化碳滅火器</option>
                        <option value="泡沫滅火器">泡沫滅火器</option>
                        <option value="防火沙">防火沙</option>
                        <option value="防火毯">防火毯</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-ios-subtext mb-1">容量</label>
                        <input type="text" id="formCapacity" class="w-full bg-ios-bg px-3 py-2 rounded-xl text-xs focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-ios-subtext mb-1">掛牆</label>
                        <input type="text" id="formWallMount" class="w-full bg-ios-bg px-3 py-2 rounded-xl text-xs focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-ios-subtext mb-1">數量 (0-10)</label>
                    <select id="formQuantity" class="w-full bg-ios-bg px-3 py-2 rounded-xl text-xs focus:outline-none">
                        <script>for(let i=0; i<=10; i++) document.write(`<option value="${i}">${i}</option>`);</script>
                    </select>
                </div>
                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="closeModal()" class="flex-1 py-2.5 bg-ios-bg text-ios-subtext rounded-xl text-xs font-semibold">取消</button>
                    <button type="submit" class="flex-1 py-2.5 bg-ios-morandi text-white rounded-xl text-xs font-semibold">儲存並同步</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 【請替換】填入你成功的 Google Apps Script Web App 網址
        const GOOGLE_SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbxIvAx4RrU0bGGYNHlmGSzucwcAr4B2DDDTiLWCig9fZrW-czTMtlz5ET8IOXcY78FlUw/exec';

        let equipmentList = [];
        let activeCategories = [];
        let activeFloors = [];
        let searchQuery = '';

        window.addEventListener('DOMContentLoaded', () => {
            fetchFromGoogleSheets();
        });

        // 1. 從 Google Sheets 讀取資料
        async function fetchFromGoogleSheets() {
            updateSyncStatus("同步中...", "bg-amber-100 text-amber-700");
            try {
                const res = await fetch(GOOGLE_SHEET_API_URL);
                const result = await res.json();
                if (result.status === "success") {
                    equipmentList = result.data;
                    renderApp();
                    updateSyncStatus("已同步 Sheets", "bg-emerald-100 text-emerald-700");
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                console.error(err);
                updateSyncStatus("同步失敗", "bg-red-100 text-red-700");
            }
        }

        // 2. 將本地資料同步回 Google Sheets
        async function syncToGoogleSheets() {
            updateSyncStatus("儲存中...", "bg-amber-100 text-amber-700");
            try {
                const res = await fetch(GOOGLE_SHEET_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ data: equipmentList })
                });
                const result = await res.json();
                if (result.status === "success") {
                    updateSyncStatus("已同步 Sheets", "bg-emerald-100 text-emerald-700");
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                console.error(err);
                updateSyncStatus("同步失敗", "bg-red-100 text-red-700");
            }
        }

        function updateSyncStatus(text, bgClass) {
            const statusEl = document.getElementById('syncStatus');
            statusEl.innerText = text;
            statusEl.className = `text-[10px] px-2 py-0.5 rounded-full font-medium ${bgClass}`;
        }

        function renderApp() {
            updateCounters();
            renderList();
        }

        /* 根據清單動態計算數量總數 */
        function updateCounters() {
            const counts = { '乾粉滅火器': 0, '二氧化碳滅火器': 0, '泡沫滅火器': 0, '防火沙': 0, '防火毯': 0 };
            equipmentList.forEach(item => {
                const t = (item.type || '').trim();
                if (counts.hasOwnProperty(t)) counts[t] += Number(item.quantity || 0);
            });
            document.getElementById('count-dry-powder').innerText = counts['乾粉滅火器'];
            document.getElementById('count-co2').innerText = counts['二氧化碳滅火器'];
            document.getElementById('count-foam').innerText = counts['泡沫滅火器'];
            document.getElementById('count-sand').innerText = counts['防火沙'];
            document.getElementById('count-blanket').innerText = counts['防火毯'];
        }

        function renderList() {
            const container = document.getElementById('equipmentListContainer');
            const emptyState = document.getElementById('emptyState');
            container.innerHTML = '';

            let filtered = equipmentList.filter(item => {
                if (activeFloors.length > 0 && !activeFloors.includes(item.floor)) return false;
                if (activeCategories.length > 0 && !activeCategories.includes(item.type)) return false;
                if (searchQuery.trim() !== '') {
                    const q = searchQuery.toLowerCase();
                    return (item.floor + item.location + item.type + item.capacity).toLowerCase().includes(q);
                }
                return true;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filtered.forEach(item => {
                    const idx = equipmentList.indexOf(item);
                    const card = document.createElement('div');
                    card.className = 'bg-ios-card p-3.5 rounded-2xl border border-ios-border/60 shadow-sm flex items-center justify-between';
                    card.innerHTML = `
                        <div class="space-y-1">
                            <div class="flex items-center space-x-1.5">
                                <span class="text-xs font-bold bg-ios-morandi text-white px-2 py-0.5 rounded-md">${escapeHtml(item.floor)}</span>
                                <span class="text-xs font-semibold text-ios-text">${escapeHtml(item.location)}</span>
                            </div>
                            <div class="text-[11px] text-ios-subtext flex items-center gap-2">
                                <span>${escapeHtml(item.type)}</span>
                                ${item.capacity ? `<span>• ${escapeHtml(item.capacity)}</span>` : ''}
                                ${item.wallMount ? `<span>• 掛牆: ${escapeHtml(item.wallMount)}</span>` : ''}
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-base font-bold text-ios-morandi bg-ios-bg px-2.5 py-1 rounded-xl">x${item.quantity}</span>
                            <button onclick="openEditModal(${idx})" class="text-ios-subtext active:text-ios-morandi"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteItem(${idx})" class="text-ios-subtext active:text-red-500"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function toggleFloorFilter(floor) {
            const idx = activeFloors.indexOf(floor);
            if (idx > -1) activeFloors.splice(idx, 1);
            else activeFloors.push(floor);
            updateStyles(); renderList();
        }

        function toggleCategoryFilter(type) {
            const idx = activeCategories.indexOf(type);
            if (idx > -1) activeCategories.splice(idx, 1);
            else activeCategories.push(type);
            updateStyles(); renderList();
        }

        function updateStyles() {
            document.querySelectorAll('.floor-btn').forEach(btn => {
                const f = btn.getAttribute('data-floor');
                btn.className = activeFloors.includes(f) ? 
                    'floor-btn flex-1 py-1.5 text-xs font-semibold rounded-lg bg-ios-card text-ios-morandi shadow-sm' : 
                    'floor-btn flex-1 py-1.5 text-xs font-semibold rounded-lg text-ios-subtext';
            });
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const c = btn.getAttribute('data-category');
                btn.className = activeCategories.includes(c) ? 
                    'filter-btn px-3 py-1 rounded-full text-xs font-medium bg-ios-morandi text-white whitespace-nowrap' : 
                    'filter-btn px-3 py-1 rounded-full text-xs font-medium bg-ios-card border border-ios-border text-ios-subtext whitespace-nowrap';
            });
        }

        function resetFilters() {
            activeCategories = []; activeFloors = []; searchQuery = '';
            document.getElementById('searchInput').value = '';
            updateStyles(); renderList();
        }

        function handleSearchInput() {
            searchQuery = document.getElementById('searchInput').value; renderList();
        }

        function openEditModal(idx) {
            const item = equipmentList[idx];
            document.getElementById('editIndex').value = idx;
            document.getElementById('formFloor').value = item.floor || '';
            document.getElementById('formLocation').value = item.location || '';
            document.getElementById('formType').value = item.type || '乾粉滅火器';
            document.getElementById('formCapacity').value = item.capacity || '';
            document.getElementById('formWallMount').value = item.wallMount || '';
            document.getElementById('formQuantity').value = item.quantity || 1;
            document.getElementById('equipmentModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('equipmentModal').classList.add('hidden');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const idx = parseInt(document.getElementById('editIndex').value);
            const newItem = {
                floor: document.getElementById('formFloor').value.trim(),
                location: document.getElementById('formLocation').value.trim(),
                type: document.getElementById('formType').value,
                capacity: document.getElementById('formCapacity').value.trim(),
                wallMount: document.getElementById('formWallMount').value.trim(),
                quantity: parseInt(document.getElementById('formQuantity').value)
            };
            if (idx >= 0) equipmentList[idx] = newItem;
            renderApp(); 
            closeModal();
            syncToGoogleSheets();
        }

        function deleteItem(idx) {
            if (confirm("確定要刪除此筆項目嗎？")) {
                equipmentList.splice(idx, 1);
                renderApp();
                syncToGoogleSheets();
            }
        }

        function confirmResetAllData() {
            if (confirm("確定要重設並清除全部資料嗎？")) {
                equipmentList = [];
                renderApp();
                syncToGoogleSheets();
            }
        }

        function handleExcelImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const jsonRows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: '' });
                    equipmentList = jsonRows.map(row => ({
                        floor: String(row['層樓'] || row['樓層'] || 'G/F').trim(),
                        location: String(row['位置'] || '未知位置').trim(),
                        type: String(row['種類'] || '乾粉滅火器').trim(),
                        capacity: String(row['容量'] || '').trim(),
                        wallMount: String(row['掛牆'] || '').trim(),
                        quantity: Math.min(Math.max(0, parseInt(row['數量']) || 1), 10)
                    }));
                    renderApp();
                    syncToGoogleSheets();
                } catch (err) { alert("匯入失敗，請確認檔案格式。"); }
            };
            reader.readAsArrayBuffer(file);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
