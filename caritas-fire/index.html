<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>消防設備管理 App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (xlsx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 適用於 iOS 主畫面 -->
    <link rel="apple-touch-icon" sizes="180x180" href="fire_icon.png">

    <!-- 適用於 一般瀏覽器 Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="fire_icon.png">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ios: { 
                            bg: '#F2F2F7', 
                            card: '#FFFFFF', 
                            text: '#1C1C1E', 
                            subtext: '#8E8E93', 
                            morandi: '#5E4B56', 
                            accent: '#D1B3C4', 
                            border: '#E5E5EA' 
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; 
            background-color: #F2F2F7; 
            -webkit-tap-highlight-color: transparent;
        }
        .pb-safe { padding-bottom: calc(6rem + env(safe-area-inset-bottom)); }
        .pt-safe { padding-top: max(1rem, env(safe-area-inset-top)); }
        .pill-bottom-safe { bottom: max(1.25rem, env(safe-area-inset-bottom)); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-ios-bg text-ios-text antialiased min-h-screen">

    <!-- 頂部 Toast Notification（僅用於手動上傳同步提示，雲端載入不會觸發） -->
    <div id="toastNotification" class="fixed top-4 inset-x-4 z-50 flex justify-center pointer-events-none transition-all duration-300 opacity-0 -translate-y-4">
        <div id="toastBox" class="bg-ios-text/90 backdrop-blur-md text-white px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 text-xs font-medium max-w-sm">
            <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toastMessage">通知訊息</span>
        </div>
    </div>

    <!-- 頂部 Navigation Bar (中文在上、英文在下) -->
    <header class="bg-ios-card/85 backdrop-blur-md sticky top-0 z-30 border-b border-ios-border pt-safe px-4 pb-3">
        <div class="flex items-center justify-between max-w-md mx-auto">
            <div>
                <h1 class="text-xl font-bold text-ios-text leading-tight">消防設備管理</h1>
                <span class="text-[11px] font-semibold text-ios-subtext tracking-wider block mt-0.5">Fire Safety Management System</span>
            </div>
            <div class="flex items-center space-x-2">
                <!-- 雲加向上箭頭圖示：同步至雲端 -->
                <button onclick="syncToGoogleSheets()" class="w-9 h-9 rounded-full bg-ios-bg flex items-center justify-center text-ios-morandi active:scale-95 transition-transform" title="同步資料至雲端">
                    <i id="syncIcon" class="fa-solid fa-cloud-arrow-up text-base"></i>
                </button>
                <label class="hidden w-9 h-9 rounded-full bg-ios-bg flex items-center justify-center text-ios-morandi cursor-pointer active:scale-95 transition-transform" title="匯入 Excel">
                    <i class="fa-solid fa-file-excel text-base"></i>
                    <input type="file" id="excelFileInput" accept=".xls,.xlsx" class="hidden" onchange="handleExcelImport(event)">
                </label>
            </div>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="px-3 py-4 pb-safe max-w-md mx-auto">

        <!-- ==================== 第一頁：搜尋篩選卡片與設備清單 ==================== -->
        <div id="page-list" class="space-y-3">
            
            <!-- 搜尋與篩選卡片（頂部直接為搜尋列，可展開／收疊層樓與種類） -->
            <section class="bg-ios-card rounded-2xl border border-ios-border/60 shadow-sm overflow-hidden">
                <div class="p-2.5 flex items-center gap-1.5">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-ios-subtext text-xs"></i>
                        <input type="text" id="searchInput" onfocus="expandFilterCard()" oninput="handleSearchInput()" placeholder="搜尋層樓、位置或設備..." class="w-full bg-ios-bg pl-8 pr-4 py-2 text-xs rounded-xl focus:outline-none border border-ios-border/60">
                    </div>

                    <!-- 展開／收疊篩選按鈕 -->
                    <button type="button" onclick="toggleFilterCard()" aria-label="展開或收疊篩選" class="w-9 h-9 rounded-xl bg-ios-bg flex items-center justify-center text-ios-subtext relative shrink-0 active:scale-95 transition-transform">
                        <span id="activeFilterDot" class="hidden absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-ios-morandi"></span>
                        <i id="filterChevron" class="fa-solid fa-chevron-down text-xs transition-transform duration-200"></i>
                    </button>

                    <!-- 重設按鈕：放於最右側（無文字、圓圈箭頭圖示） -->
                    <button type="button" onclick="resetFilters()" aria-label="重設篩選" class="w-9 h-9 rounded-xl bg-ios-bg flex items-center justify-center text-ios-morandi shrink-0 active:scale-95 transition-transform">
                        <i class="fa-solid fa-rotate-left text-xs"></i>
                    </button>
                </div>

                <!-- 展開內容：層樓 + 種類 -->
                <div id="filterCardBody" class="hidden px-3 pb-3 pt-1 space-y-2 border-t border-ios-border/50">
                    <!-- 樓層複選篩選 -->
                    <div class="bg-ios-border/50 p-1 rounded-xl flex gap-1 mt-1">
                        <button type="button" onclick="toggleFloorFilter('G/F')" data-floor="G/F" class="floor-btn flex-1 py-1.5 text-xs font-semibold rounded-lg text-ios-subtext transition-all">G/F 位置</button>
                        <button type="button" onclick="toggleFloorFilter('1/F')" data-floor="1/F" class="floor-btn flex-1 py-1.5 text-xs font-semibold rounded-lg text-ios-subtext transition-all">1/F 位置</button>
                    </div>

                    <!-- 設備種類複選篩選（伸展至整個區塊寬度，採用與層樓相同的複選樣式） -->
                    <div class="bg-ios-border/50 p-1 rounded-xl flex gap-1" id="categoryFilterContainer">
                        <button type="button" onclick="toggleCategoryFilter('乾粉滅火器')" data-category="乾粉滅火器" class="filter-btn flex-1 py-1.5 text-xs font-semibold rounded-lg text-ios-subtext transition-all truncate">乾粉</button>
                        <button type="button" onclick="toggleCategoryFilter('二氧化碳滅火器')" data-category="二氧化碳滅火器" class="filter-btn flex-1 py-1.5 text-xs font-semibold rounded-lg text-ios-subtext transition-all truncate">CO₂</button>
                        <button type="button" onclick="toggleCategoryFilter('泡沫滅火器')" data-category="泡沫滅火器" class="filter-btn flex-1 py-1.5 text-xs font-semibold rounded-lg text-ios-subtext transition-all truncate">泡沫</button>
                        <button type="button" onclick="toggleCategoryFilter('防火沙')" data-category="防火沙" class="filter-btn flex-1 py-1.5 text-xs font-semibold rounded-lg text-ios-subtext transition-all truncate">防火沙</button>
                        <button type="button" onclick="toggleCategoryFilter('防火毯')" data-category="防火毯" class="filter-btn flex-1 py-1.5 text-xs font-semibold rounded-lg text-ios-subtext transition-all truncate">防火毯</button>
                    </div>
                </div>
            </section>

            <!-- 設備清單 -->
            <section class="space-y-2">
                <!-- 資料清單小標題與右側筆數 -->
                <div class="flex items-center justify-between px-1">
                    <h2 class="text-xs font-bold text-ios-text tracking-wide">位置資料</h2>
                    <span id="recordCountBadge" class="text-xs font-semibold text-ios-morandi bg-ios-card px-2 py-0.5 rounded-full border border-ios-border/80">0 筆</span>
                </div>

                <!-- 雲端載入中圖示（載入時版面空白並顯示此載入圖示） -->
                <div id="loadingState" class="hidden py-14 text-center bg-ios-card rounded-2xl border border-ios-border/60 shadow-sm">
                    <i class="fa-solid fa-spinner fa-spin text-2xl text-ios-morandi mb-2"></i>
                    <p class="text-xs text-ios-subtext">資料載入中...</p>
                </div>

                <div id="equipmentListContainer" class="space-y-2"></div>
                <div id="emptyState" class="hidden py-10 text-center"><p class="text-xs text-ios-subtext">無符合條件的設備資料</p></div>
            </section>
        </div>

        <!-- ==================== 第二頁：設備總數量統計 ==================== -->
        <div id="page-stats" class="hidden space-y-4">
            <section class="bg-ios-card px-4 py-3.5 rounded-2xl border border-ios-border/60 shadow-sm">
                <div class="flex items-center justify-between pb-2.5 border-b border-ios-border/80">
                    <h2 class="text-xs font-bold text-ios-text tracking-wider">設備總數量統計</h2>
                </div>
                
                <!-- 獨立單行顯示，間線分隔 (divide-y) -->
                <div class="divide-y divide-ios-border">
                    <!-- 乾粉滅火器 -->
                    <div class="py-3 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-ios-accent/30 text-ios-morandi flex items-center justify-center text-sm">
                                <i class="fa-solid fa-bottle-droplet"></i>
                            </div>
                            <span class="text-sm font-medium text-ios-text">乾粉</span>
                        </div>
                        <span id="count-dry-powder" class="text-lg font-bold text-ios-morandi">0</span>
                    </div>

                    <!-- CO2 滅火器 -->
                    <div class="py-3 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-ios-accent/30 text-ios-morandi flex items-center justify-center text-sm">
                                <i class="fa-solid fa-cloud"></i>
                            </div>
                            <span class="text-sm font-medium text-ios-text">二氧化碳</span>
                        </div>
                        <span id="count-co2" class="text-lg font-bold text-ios-morandi">0</span>
                    </div>

                    <!-- 泡沫滅火器 -->
                    <div class="py-3 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-ios-accent/30 text-ios-morandi flex items-center justify-center text-sm">
                                <i class="fa-solid fa-soap"></i>
                            </div>
                            <span class="text-sm font-medium text-ios-text">泡沫</span>
                        </div>
                        <span id="count-foam" class="text-lg font-bold text-ios-morandi">0</span>
                    </div>

                    <!-- 防火沙 -->
                    <div class="py-3 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-ios-accent/30 text-ios-morandi flex items-center justify-center text-sm">
                                <i class="fa-solid fa-mound"></i>
                            </div>
                            <span class="text-sm font-medium text-ios-text">防火沙</span>
                        </div>
                        <span id="count-sand" class="text-lg font-bold text-ios-morandi">0</span>
                    </div>

                    <!-- 防火毯 -->
                    <div class="pt-3 pb-1 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-ios-accent/30 text-ios-morandi flex items-center justify-center text-sm">
                                <i class="fa-solid fa-rug"></i>
                            </div>
                            <span class="text-sm font-medium text-ios-text">防火毯</span>
                        </div>
                        <span id="count-blanket" class="text-lg font-bold text-ios-morandi">0</span>
                    </div>
                </div>
            </section>
        </div>

    </main>

    <!-- 藥丸式 Tab Bar (純圖示，懸浮膠囊造型) -->
    <nav class="fixed inset-x-0 pill-bottom-safe z-40 flex justify-center pointer-events-none px-4">
        <div class="pointer-events-auto bg-ios-card/90 backdrop-blur-xl border border-ios-border/80 shadow-lg rounded-full p-1.5 flex items-center gap-1.5">
            <button onclick="switchTab('list')" id="tab-btn-list" aria-label="設備清單" class="w-16 h-10 rounded-full flex items-center justify-center bg-ios-morandi text-white shadow-sm transition-all active:scale-95">
                <i class="fa-solid fa-list-check text-base"></i>
            </button>
            <button onclick="switchTab('stats')" id="tab-btn-stats" aria-label="數量統計" class="w-16 h-10 rounded-full flex items-center justify-center text-ios-subtext hover:text-ios-text transition-all active:scale-95">
                <i class="fa-solid fa-chart-pie text-base"></i>
            </button>
        </div>
    </nav>

    <!-- 修改資料 Modal (置中顯示於螢幕中間，底部僅保留「確定」與「刪除」2個按鈕) -->
    <div id="equipmentModal" class="fixed inset-0 z-50 hidden bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-ios-card rounded-3xl w-full max-w-sm p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b border-ios-border pb-3">
                <h3 class="text-base font-bold text-ios-text">修改設備資料</h3>
                <button onclick="closeModal()" class="text-ios-subtext text-xl"><i class="fa-solid fa-circle-xmark"></i></button>
            </div>
            <form id="equipmentForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <input type="hidden" id="editIndex" value="-1">
                <div>
                    <label class="block text-xs text-ios-subtext mb-1">層樓</label>
                    <select id="formFloor" required class="w-full bg-ios-bg px-3 py-2 rounded-xl text-xs focus:outline-none">
                        <option value="G/F">G/F</option>
                        <option value="1/F">1/F</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-ios-subtext mb-1">位置</label>
                    <input type="text" id="formLocation" required class="w-full bg-ios-bg px-3 py-2 rounded-xl text-xs focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-ios-subtext mb-1">種類</label>
                    <select id="formType" class="w-full bg-ios-bg px-3 py-2 rounded-xl text-xs focus:outline-none">
                        <option value="乾粉滅火器">乾粉滅火器</option>
                        <option value="二氧化碳滅火器">二氧化碳滅火器</option>
                        <option value="泡沫滅火器">泡沫滅火器</option>
                        <option value="防火沙">防火沙</option>
                        <option value="防火毯">防火毯</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-ios-subtext mb-1">容量</label>
                        <input type="text" id="formCapacity" class="w-full bg-ios-bg px-3 py-2 rounded-xl text-xs focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-ios-subtext mb-1">掛牆</label>
                        <input type="text" id="formWallMount" class="w-full bg-ios-bg px-3 py-2 rounded-xl text-xs focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-ios-subtext mb-1">數量 (0-10)</label>
                    <select id="formQuantity" class="w-full bg-ios-bg px-3 py-2 rounded-xl text-xs focus:outline-none">
                        <script>for(let i=0; i<=10; i++) document.write(`<option value="${i}">${i}</option>`);</script>
                    </select>
                </div>
                <div class="pt-2 flex gap-2">
                    <button type="submit" class="flex-1 py-2.5 bg-ios-morandi text-white rounded-xl text-xs font-semibold active:scale-95 transition-transform">確定</button>
                    <button type="button" onclick="deleteCurrentItem()" class="flex-1 py-2.5 bg-red-50 text-red-600 rounded-xl text-xs font-semibold active:scale-95 transition-transform">刪除</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 【請替換】填入你成功的 Google Apps Script Web App 網址
        const GOOGLE_SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbxIvAx4RrU0bGGYNHlmGSzucwcAr4B2DDDTiLWCig9fZrW-czTMtlz5ET8IOXcY78FlUw/exec';

        // 預設為空白，無預載資料
        let equipmentList = [];
        let activeCategories = [];
        let activeFloors = [];
        let searchQuery = '';
        let toastTimer = null;
        let isFilterExpanded = false;
        let isLoadingCloud = false;

        window.addEventListener('DOMContentLoaded', () => {
            fetchFromGoogleSheets();
        });

        // Toast Notification 顯示函式
        function showToast(message, type = 'success', duration = 2600) {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = message;

            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
            } else if (type === 'loading') {
                toastIcon.className = 'fa-solid fa-spinner fa-spin text-amber-300';
            } else if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-exclamation text-red-400';
            }

            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            if (toastTimer) clearTimeout(toastTimer);
            if (duration > 0) {
                toastTimer = setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                    toast.classList.add('opacity-0', '-translate-y-4');
                }, duration);
            }
        }

        // 控制資料版面載入中狀態
        function setLoadingState(loading) {
            isLoadingCloud = loading;
            const loadingState = document.getElementById('loadingState');
            const listContainer = document.getElementById('equipmentListContainer');
            const emptyState = document.getElementById('emptyState');

            if (loading) {
                loadingState.classList.remove('hidden');
                listContainer.classList.add('hidden');
                emptyState.classList.add('hidden');
            } else {
                loadingState.classList.add('hidden');
                listContainer.classList.remove('hidden');
            }
        }

        // 展開／收疊篩選區塊
        function toggleFilterCard() {
            const body = document.getElementById('filterCardBody');
            const chevron = document.getElementById('filterChevron');
            isFilterExpanded = !isFilterExpanded;

            if (isFilterExpanded) {
                body.classList.remove('hidden');
                chevron.classList.add('rotate-180');
            } else {
                body.classList.add('hidden');
                chevron.classList.remove('rotate-180');
            }
        }

        function expandFilterCard() {
            if (!isFilterExpanded) {
                toggleFilterCard();
            }
        }

        // 切換底部藥丸式 Tab Bar 分頁
        function switchTab(tabName) {
            const pageList = document.getElementById('page-list');
            const pageStats = document.getElementById('page-stats');
            const btnList = document.getElementById('tab-btn-list');
            const btnStats = document.getElementById('tab-btn-stats');

            const activeClasses = ['bg-ios-morandi', 'text-white', 'shadow-sm'];
            const inactiveClasses = ['text-ios-subtext', 'hover:text-ios-text'];

            if (tabName === 'list') {
                pageList.classList.remove('hidden');
                pageStats.classList.add('hidden');
                
                btnList.classList.add(...activeClasses);
                btnList.classList.remove(...inactiveClasses);
                btnStats.classList.remove(...activeClasses);
                btnStats.classList.add(...inactiveClasses);
            } else if (tabName === 'stats') {
                pageList.classList.add('hidden');
                pageStats.classList.remove('hidden');
                
                btnStats.classList.add(...activeClasses);
                btnStats.classList.remove(...inactiveClasses);
                btnList.classList.remove(...activeClasses);
                btnList.classList.add(...inactiveClasses);
            }
        }

        // 1. 從 Google Sheets 讀取資料（不顯示預載資料、不彈出載入/成功 Toast，版面顯示載入圖示）
        async function fetchFromGoogleSheets() {
            equipmentList = [];
            updateCounters();
            setLoadingState(true);

            try {
                const res = await fetch(GOOGLE_SHEET_API_URL);
                const result = await res.json();
                if (result.status === "success" && Array.isArray(result.data)) {
                    equipmentList = result.data;
                } else {
                    equipmentList = [];
                }
            } catch (err) {
                console.error(err);
                equipmentList = [];
            } finally {
                setLoadingState(false);
                renderApp();
            }
        }

        // 2. 將本地資料同步回 Google Sheets
        async function syncToGoogleSheets() {
            const syncIcon = document.getElementById('syncIcon');
            syncIcon.className = 'fa-solid fa-spinner fa-spin text-base';
            showToast("正在同步至雲端...", "loading", 0);
            try {
                const res = await fetch(GOOGLE_SHEET_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ data: equipmentList })
                });
                const result = await res.json();
                if (result.status === "success") {
                    showToast("已成功同步至雲端", "success", 2400);
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                console.error(err);
                showToast("同步失敗，請檢查網路連線", "error", 3000);
            } finally {
                syncIcon.className = 'fa-solid fa-cloud-arrow-up text-base';
            }
        }

        function renderApp() {
            updateCounters();
            if (!isLoadingCloud) {
                renderList();
            }
        }

        /* 根據清單動態計算數量總數 */
        function updateCounters() {
            const counts = { '乾粉滅火器': 0, '二氧化碳滅火器': 0, '泡沫滅火器': 0, '防火沙': 0, '防火毯': 0 };
            equipmentList.forEach(item => {
                const t = (item.type || '').trim();
                if (counts.hasOwnProperty(t)) counts[t] += Number(item.quantity || 0);
            });
            document.getElementById('count-dry-powder').innerText = counts['乾粉滅火器'];
            document.getElementById('count-co2').innerText = counts['二氧化碳滅火器'];
            document.getElementById('count-foam').innerText = counts['泡沫滅火器'];
            document.getElementById('count-sand').innerText = counts['防火沙'];
            document.getElementById('count-blanket').innerText = counts['防火毯'];
        }

        function renderList() {
            if (isLoadingCloud) return;

            const container = document.getElementById('equipmentListContainer');
            const emptyState = document.getElementById('emptyState');
            const recordCountBadge = document.getElementById('recordCountBadge');
            container.innerHTML = '';

            let filtered = equipmentList.filter(item => {
                if (activeFloors.length > 0 && !activeFloors.includes(item.floor)) return false;
                if (activeCategories.length > 0 && !activeCategories.includes(item.type)) return false;
                if (searchQuery.trim() !== '') {
                    const q = searchQuery.toLowerCase();
                    return (item.floor + item.location + item.type + item.capacity).toLowerCase().includes(q);
                }
                return true;
            });

            if (recordCountBadge) {
                recordCountBadge.innerText = `${filtered.length} 筆`;
            }

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filtered.forEach(item => {
                    const idx = equipmentList.indexOf(item);
                    const card = document.createElement('div');
                    card.onclick = () => openEditModal(idx);
                    card.className = 'bg-ios-card p-3.5 rounded-2xl border border-ios-border/60 shadow-sm flex items-center justify-between cursor-pointer active:scale-[0.98] transition-transform';
                    card.innerHTML = `
                        <div class="space-y-1">
                            <div class="flex items-center space-x-1.5">
                                <span class="text-xs font-bold bg-ios-morandi text-white px-2 py-0.5 rounded-md">${escapeHtml(item.floor)}</span>
                                <span class="text-xs font-semibold text-ios-text">${escapeHtml(item.location)}</span>
                            </div>
                            <div class="text-[11px] text-ios-subtext flex items-center gap-2">
                                <span>${escapeHtml(item.type)}</span>
                                ${item.capacity ? `<span>• ${escapeHtml(item.capacity)}</span>` : ''}
                                ${item.wallMount ? `<span>• 掛牆: ${escapeHtml(item.wallMount)}</span>` : ''}
                            </div>
                        </div>
                        <div class="flex items-center">
                            <span class="text-base font-bold text-ios-morandi bg-ios-bg min-w-[2.25rem] text-center px-2.5 py-1 rounded-xl">${item.quantity}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function toggleFloorFilter(floor) {
            const idx = activeFloors.indexOf(floor);
            if (idx > -1) activeFloors.splice(idx, 1);
            else activeFloors.push(floor);
            updateStyles(); renderList();
        }

        function toggleCategoryFilter(type) {
            const idx = activeCategories.indexOf(type);
            if (idx > -1) activeCategories.splice(idx, 1);
            else activeCategories.push(type);
            updateStyles(); renderList();
        }

        function updateStyles() {
            document.querySelectorAll('.floor-btn').forEach(btn => {
                const f = btn.getAttribute('data-floor');
                btn.className = activeFloors.includes(f) ? 
                    'floor-btn flex-1 py-1.5 text-xs font-semibold rounded-lg bg-ios-card text-ios-morandi shadow-sm transition-all' : 
                    'floor-btn flex-1 py-1.5 text-xs font-semibold rounded-lg text-ios-subtext transition-all';
            });
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const c = btn.getAttribute('data-category');
                btn.className = activeCategories.includes(c) ? 
                    'filter-btn flex-1 py-1.5 text-xs font-semibold rounded-lg bg-ios-card text-ios-morandi shadow-sm transition-all truncate' : 
                    'filter-btn flex-1 py-1.5 text-xs font-semibold rounded-lg text-ios-subtext transition-all truncate';
            });

            // 若有啟用篩選條件，顯示小圓點提示
            const dot = document.getElementById('activeFilterDot');
            const hasFilter = activeFloors.length > 0 || activeCategories.length > 0;
            if (hasFilter) {
                dot.classList.remove('hidden');
            } else {
                dot.classList.add('hidden');
            }
        }

        function resetFilters() {
            activeCategories = []; activeFloors = []; searchQuery = '';
            document.getElementById('searchInput').value = '';
            updateStyles(); renderList();
        }

        function handleSearchInput() {
            searchQuery = document.getElementById('searchInput').value;
            updateStyles();
            renderList();
        }

        function openEditModal(idx) {
            const item = equipmentList[idx];
            document.getElementById('editIndex').value = idx;
            
            // 設定層樓下拉選單（若資料為自訂樓層亦自動支援）
            const floorSelect = document.getElementById('formFloor');
            const floorVal = (item.floor || 'G/F').trim();
            const exists = Array.from(floorSelect.options).some(opt => opt.value === floorVal);
            if (!exists && floorVal) {
                const opt = document.createElement('option');
                opt.value = floorVal;
                opt.text = floorVal;
                floorSelect.add(opt);
            }
            floorSelect.value = floorVal;

            document.getElementById('formLocation').value = item.location || '';
            document.getElementById('formType').value = item.type || '乾粉滅火器';
            document.getElementById('formCapacity').value = item.capacity || '';
            document.getElementById('formWallMount').value = item.wallMount || '';
            document.getElementById('formQuantity').value = item.quantity ?? 1;
            document.getElementById('equipmentModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('equipmentModal').classList.add('hidden');
        }

        // 按下「確定」後儲存並返回清單（不自動同步至雲端）
        function handleFormSubmit(e) {
            e.preventDefault();
            const idx = parseInt(document.getElementById('editIndex').value);
            const newItem = {
                floor: document.getElementById('formFloor').value.trim(),
                location: document.getElementById('formLocation').value.trim(),
                type: document.getElementById('formType').value,
                capacity: document.getElementById('formCapacity').value.trim(),
                wallMount: document.getElementById('formWallMount').value.trim(),
                quantity: parseInt(document.getElementById('formQuantity').value)
            };
            if (idx >= 0) equipmentList[idx] = newItem;
            renderApp(); 
            closeModal();
        }

        // 按下「刪除」後刪除該筆資料並返回清單
        function deleteCurrentItem() {
            const idx = parseInt(document.getElementById('editIndex').value);
            if (idx >= 0 && confirm("確定要刪除此筆項目嗎？")) {
                equipmentList.splice(idx, 1);
                renderApp();
                closeModal();
            }
        }

        function confirmResetAllData() {
            if (confirm("確定要重設並清除全部資料嗎？")) {
                equipmentList = [];
                renderApp();
            }
        }

        function handleExcelImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const jsonRows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: '' });
                    equipmentList = jsonRows.map(row => ({
                        floor: String(row['層樓'] || row['樓層'] || 'G/F').trim(),
                        location: String(row['位置'] || '未知位置').trim(),
                        type: String(row['種類'] || '乾粉滅火器').trim(),
                        capacity: String(row['容量'] || '').trim(),
                        wallMount: String(row['掛牆'] || '').trim(),
                        quantity: Math.min(Math.max(0, parseInt(row['數量']) || 1), 10)
                    }));
                    renderApp();
                } catch (err) { alert("匯入失敗，請確認檔案格式。"); }
            };
            reader.readAsArrayBuffer(file);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
