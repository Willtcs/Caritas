<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>明愛樂義學校維修管理平台 - 執行人專頁 (Mobile)</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1SjJS7Y3Gq0paTjQMf9qVQoQiJLiLvn3E=s256" />
  <link rel="apple-touch-icon" sizes="180x180" href="https://lh3.googleusercontent.com/d/1SjJS7Y3Gq0paTjQMf9qVQoQiJLiLvn3E=s512" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans TC"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fbfc',   // #BDF2F6 淺化背景
              100: '#BDF2F6',  // 冰川藍
              200: '#9BD2E4',  // 晴空藍
              300: '#779EC8',  // 霧霾藍
              500: '#5B81B2',  // 鋼青藍
              600: '#415E91',  // 深海藍
              700: '#415E91',  // 深海藍
            }
          },
          boxShadow: {
            card: '0 2px 6px -1px rgba(65, 94, 145, 0.08), 0 1px 3px -1px rgba(65, 94, 145, 0.04)',
            modal: '0 20px 25px -5px rgba(15, 23, 42, 0.16), 0 8px 10px -6px rgba(15, 23, 42, 0.1)',
          }
        }
      }
    };
  </script>

  <style>
    body {
      background-color: #f0fbfc;
      color: #415E91;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    /* 防 iOS 畫面自動放大：所有輸入框與下拉選單字體強制設定為 16px */
    .saas-input,
    select,
    input[type="text"],
    input[type="password"],
    input[type="date"],
    textarea {
      font-size: 16px !important;
    }

    .saas-input:focus {
      outline: none;
      border-color: #5B81B2;
      box-shadow: 0 0 0 3px rgba(155, 210, 228, 0.45);
    }

    svg {
      flex-shrink: 0;
    }

    /* 隱藏橫向捲軸但保留滑動流暢度 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 展開收疊平滑過渡 */
    .accordion-chevron {
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .accordion-chevron.is-open {
      transform: rotate(180deg);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#f0fbfc] text-[#415E91] pb-24">

  <!-- 頂部 Mobile 專屬導覽列 -->
  <header class="sticky top-0 z-30 bg-[#415E91] text-white border-b border-[#5B81B2] px-3.5 py-2.5 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-9 h-9 rounded-xl bg-[#5B81B2] border border-[#9BD2E4]/50 text-[#BDF2F6] flex items-center justify-center shadow-sm shrink-0">
        <img src="https://lh3.googleusercontent.com/d/1SjJS7Y3Gq0paTjQMf9qVQoQiJLiLvn3E=s256" 
        alt="校徽" 
        class="w-full h-full object-cover" 
        />
      </div>
      <div class="min-w-0">
        <div class="flex items-center gap-1.5">
          <h1 class="text-[15px] font-bold tracking-tight text-white truncate">明愛樂義學校維修平台</h1>
          <span class="px-1.5 py-0.5 rounded-md text-[10px] font-bold bg-[#5B81B2] text-[#BDF2F6] border border-[#9BD2E4]/40 shrink-0">Mobile</span>
        </div>
        <p id="mobileRoleSubtitle" class="text-[11.5px] text-[#BDF2F6] truncate">執行人專頁（全部功能）</p>
      </div>
    </div>

    <div class="flex items-center gap-1.5 shrink-0">
      <!-- 同步雲端資料按鈕（執行人專屬） -->
      <button
        type="button"
        id="syncBtn"
        data-executor-only="true"
        onclick="syncToCloud(true)"
        title="同步雲端資料"
        class="inline-flex items-center gap-1 px-2.5 py-2 rounded-xl text-[12px] font-bold text-[#415E91] bg-[#BDF2F6] active:bg-[#9BD2E4] border border-[#9BD2E4] shadow-card transition-colors"
      >
        <svg id="syncBtnIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        <span>同步</span>
        <span id="syncBtnBadge" class="hidden px-1.5 py-0.2 rounded-full bg-amber-500 text-white text-[10px]">0</span>
      </button>


    </div>
  </header>

  <!-- 主內容工作區（無桌面左側邊欄，專注手機單手直立瀏覽） -->
  <main class="flex-1 w-full max-w-xl mx-auto px-3.5 pt-3.5 space-y-3.5">

    <!-- =================================================================== -->
    <!-- 視圖：直立式卡片維修清單（Card View + 摺疊執行人管理面板）          -->
    <!-- =================================================================== -->
    <section id="view-sheet" class="space-y-3">

      <!-- 標題與即時統計列 -->
      <div class="bg-white rounded-2xl p-3.5 border border-[#9BD2E4] shadow-card space-y-2.5">
        <div class="flex items-center justify-between gap-2">
          <div class="min-w-0">
            <h2 id="sheetViewTitle" class="text-[18px] font-bold text-[#415E91] truncate">維修總表（全部紀錄）</h2>
            <p id="pendingHintTag" class="hidden text-[12px] text-[#5B81B2] mt-0.5">如沒有顯示相關資料，表示已完成維修</p>
          </div>
          <span id="activeFilterPill" class="px-2.5 py-1 rounded-full text-[11.5px] font-bold bg-[#BDF2F6] text-[#415E91] border border-[#779EC8] shrink-0">
            全部紀錄
          </span>
        </div>

        <div class="flex items-center justify-between pt-2 border-t border-[#BDF2F6]">
          <div class="flex items-center gap-2">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-amber-50 border border-amber-200 text-amber-800 text-[12px] font-bold">
              <span class="w-2 h-2 rounded-full bg-amber-500"></span>
              待處理：<span id="badge-pending">0</span>
            </span>
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800 text-[12px] font-bold">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
              已完成：<span id="badge-completed">0</span>
            </span>
          </div>

          <button
            type="button"
            id="expandAllToggleBtn"
            data-executor-only="true"
            onclick="toggleAllAccordions()"
            class="px-2.5 py-1 rounded-lg text-[11.5px] font-bold text-[#5B81B2] bg-[#f0fbfc] active:bg-[#BDF2F6] border border-[#9BD2E4]"
          >
            展開全部管理
          </button>
        </div>
      </div>

      <!-- 卡片列表容器（無橫向捲動，直立式卡片檢視） -->
      <div id="mobileCardsContainer" class="space-y-3"></div>

      <!-- 空資料提示 -->
      <div id="emptyCardsState" class="hidden bg-white rounded-2xl border border-[#9BD2E4] py-14 px-4 text-center shadow-card">
        <div class="w-12 h-12 rounded-2xl bg-[#BDF2F6]/60 text-[#779EC8] mx-auto flex items-center justify-center mb-3">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        </div>
        <p class="text-[15px] font-bold text-[#415E91]">目前沒有符合的維修紀錄</p>
        <p class="text-[12.5px] text-[#779EC8] mt-1">可點擊下方「更多篩選」切換其他條件</p>
      </div>

      <!-- Mobile 分頁列 -->
      <div id="mobilePaginationBar" class="bg-white rounded-2xl px-4 py-3 border border-[#9BD2E4] shadow-card flex items-center justify-between text-[13px] text-[#5B81B2]">
        <span id="mobileFooterCount" class="font-medium">共 0 筆紀錄</span>
        <div class="flex items-center gap-2">
          <span id="mobilePageIndicator" class="font-bold text-[#415E91]">第 1 / 1 頁</span>
          <button
            type="button"
            id="mobilePrevPageBtn"
            onclick="changePage(-1)"
            disabled
            class="p-2.5 rounded-xl border border-[#779EC8] bg-[#f0fbfc] text-[#415E91] disabled:opacity-40 disabled:pointer-events-none"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button
            type="button"
            id="mobileNextPageBtn"
            onclick="changePage(1)"
            disabled
            class="p-2.5 rounded-xl border border-[#779EC8] bg-[#f0fbfc] text-[#415E91] disabled:opacity-40 disabled:pointer-events-none"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- ===================================================================== -->
  <!-- 底部固定導覽列（Bottom Navigation Bar）：單手大拇指操作                 -->
  <!-- ===================================================================== -->
  <nav id="mobileBottomNav" class="fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur-md border-t border-[#9BD2E4] shadow-[0_-4px_16px_rgba(65,94,145,0.12)]">
    <div class="max-w-xl mx-auto flex items-stretch justify-around h-[68px] px-2">

      <!-- 執行人專屬 Tab 1：維修總表 -->
      <button
        type="button"
        id="bnav-sheet"
        onclick="switchMobileTab('sheet')"
        class="flex-1 flex flex-col items-center justify-center gap-1 text-[#415E91] font-bold transition-colors"
      >
        <div class="bnav-pill px-5 py-1 rounded-full bg-[#BDF2F6] text-[#415E91] transition-colors relative">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>
          <span id="bnavTotalBadge" class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-[#415E91] text-white text-[10px] font-bold flex items-center justify-center">0</span>
        </div>
        <span class="text-[12px]">維修總表</span>
      </button>

      <!-- 執行人專屬 Tab 2：更多篩選（開啟底部篩選抽屜） -->
      <button
        type="button"
        id="bnav-filter"
        onclick="openFilterDrawer()"
        class="flex-1 flex flex-col items-center justify-center gap-1 text-[#5B81B2] font-semibold transition-colors"
      >
        <div class="bnav-pill px-5 py-1 rounded-full transition-colors relative">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          <span id="bnavFilterDot" class="hidden absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-amber-500 ring-2 ring-white"></span>
        </div>
        <span class="text-[12px]">更多篩選</span>
      </button>



    </div>
  </nav>

  <!-- ===================================================================== -->
  <!-- 底部滑出抽屜：更多篩選（單手大拇指快速切換條件）                        -->
  <!-- ===================================================================== -->
  <div id="filterDrawerBackdrop" onclick="if(event.target===this) closeFilterDrawer()" class="hidden fixed inset-0 z-40 bg-[#415E91]/55 backdrop-blur-xs flex items-end justify-center">
    <div class="bg-white w-full max-w-xl rounded-t-3xl border-t border-[#9BD2E4] shadow-modal p-5 pb-8 space-y-4">
      <div class="w-10 h-1.5 rounded-full bg-[#9BD2E4] mx-auto -mt-1 mb-2"></div>

      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-[17px] font-bold text-[#415E91]">更多篩選條件</h3>
          <p class="text-[12px] text-[#5B81B2]">點擊即可篩選維修總表紀錄</p>
        </div>
        <button type="button" onclick="closeFilterDrawer()" class="w-9 h-9 rounded-xl bg-[#f0fbfc] text-[#415E91] flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <div class="grid grid-cols-1 gap-2.5">
        <button type="button" id="fopt-ALL-ALL" onclick="selectDrawerFilter('ALL', 'ALL', '全部紀錄')" class="w-full flex items-center justify-between px-4 py-3.5 rounded-2xl border-2 border-[#415E91] bg-[#BDF2F6]/50 text-[#415E91] font-bold text-[15px]">
          <span>📋 全部紀錄</span>
          <span id="fcount-all" class="px-2.5 py-0.5 rounded-full bg-[#415E91] text-white text-[12px]">0</span>
        </button>

        <button type="button" id="fopt-ALL-pending" onclick="selectDrawerFilter('ALL', 'pending', '待處理維修')" class="w-full flex items-center justify-between px-4 py-3.5 rounded-2xl border border-[#9BD2E4] bg-[#f0fbfc] text-[#415E91] font-bold text-[15px]">
          <span>⏳ 待處理維修</span>
          <span id="fcount-pending" class="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 text-[12px]">0</span>
        </button>

        <button type="button" id="fopt-ALL-completed" onclick="selectDrawerFilter('ALL', 'completed', '已完成維修')" class="w-full flex items-center justify-between px-4 py-3.5 rounded-2xl border border-[#9BD2E4] bg-[#f0fbfc] text-[#415E91] font-bold text-[15px]">
          <span>✅ 已完成維修</span>
          <span id="fcount-completed" class="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[12px]">0</span>
        </button>

        <div class="grid grid-cols-2 gap-2.5 pt-1">
          <button type="button" id="fopt-日校-ALL" onclick="selectDrawerFilter('日校', 'ALL', '日校區域')" class="flex items-center justify-between px-4 py-3.5 rounded-2xl border border-[#9BD2E4] bg-white text-[#415E91] font-bold text-[14.5px]">
            <span>🏫 日校區域</span>
            <span id="fcount-day" class="text-[12.5px] font-bold text-[#5B81B2]">0</span>
          </button>

          <button type="button" id="fopt-宿舍-ALL" onclick="selectDrawerFilter('宿舍', 'ALL', '宿舍區域')" class="flex items-center justify-between px-4 py-3.5 rounded-2xl border border-[#9BD2E4] bg-white text-[#415E91] font-bold text-[14.5px]">
            <span>🛏️ 宿舍區域</span>
            <span id="fcount-dorm" class="text-[12.5px] font-bold text-[#5B81B2]">0</span>
          </button>
        </div>
      </div>


    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- 彈窗：直接開啟相片 / 影片檢視 Modal（無「Google Drive 開啟原始檔案」）   -->
  <!-- ===================================================================== -->
  <div id="mediaModal" onclick="if(event.target===this) closeModal('mediaModal')" class="hidden fixed inset-0 z-50 bg-[#1e293b]/85 backdrop-blur-xs flex items-center justify-center p-3">
    <div class="bg-white rounded-2xl shadow-modal max-w-lg w-full overflow-hidden border border-[#9BD2E4]">
      <div class="px-4 py-3 border-b border-[#9BD2E4] flex items-center justify-between bg-[#f0fbfc]">
        <div class="min-w-0 pr-2">
          <h3 id="modalMediaTitle" class="text-[15px] font-bold text-[#415E91] truncate">現場附件檢視</h3>
          <p id="modalMediaMeta" class="text-[11.5px] text-[#5B81B2] truncate">位置與呈報人資訊</p>
        </div>
        <button type="button" onclick="closeModal('mediaModal')" class="w-9 h-9 rounded-xl bg-white border border-[#9BD2E4] flex items-center justify-center text-[#415E91] shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <div id="modalMediaContent" class="p-3 bg-slate-950 flex items-center justify-center min-h-[260px] max-h-[78vh] overflow-auto"></div>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- 彈窗：刪除確認 Modal                                                   -->
  <!-- ===================================================================== -->
  <div id="deleteConfirmModal" class="hidden fixed inset-0 z-50 bg-[#415E91]/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-modal max-w-sm w-full overflow-hidden border border-[#9BD2E4]">
      <div class="p-5 flex items-start gap-3">
        <div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 border border-rose-200 flex items-center justify-center shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <h3 class="text-[16px] font-bold text-[#415E91]">確認刪除此筆維修紀錄？</h3>
          <p id="deleteConfirmDesc" class="text-[13px] text-[#5B81B2] mt-1 leading-relaxed">
            刪除後將無法復原，確定要移除嗎？
          </p>
        </div>
      </div>
      <div class="px-4 py-3 bg-[#f0fbfc] border-t border-[#9BD2E4] flex items-center gap-2.5">
        <button
          type="button"
          onclick="closeModal('deleteConfirmModal')"
          class="flex-1 py-2.5 rounded-xl bg-white border border-[#779EC8] text-[14px] font-bold text-[#415E91]"
        >
          取消
        </button>
        <button
          type="button"
          onclick="confirmDeleteRecord()"
          class="flex-1 py-2.5 rounded-xl bg-rose-600 text-white text-[14px] font-bold"
        >
          確認刪除
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Toast 提示訊息 -->
  <div id="appToast" class="fixed bottom-20 inset-x-3.5 z-50 translate-y-[160%] opacity-0 transition-all duration-300 max-w-md mx-auto bg-[#415E91] text-white shadow-modal rounded-2xl p-3.5 flex items-center gap-3 border border-[#779EC8]/50">
    <span id="toastDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 shrink-0"></span>
    <p id="toastMessage" class="text-[13.5px] font-medium leading-snug flex-1">操作已完成</p>
  </div>

  <script>
    // =========================================================================
    // 1. 系統設定與狀態變數
    // =========================================================================
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyCHwbGTPm_C4C5ekBjIBmwKx7yXzZQC_rSeFQaGHrjvbrSTUhvQVDFedLPD3AEIfm31g/exec';

    const STORAGE_KEY = 'caritas_lok_yi_repair_records_v12';
    const LOCATIONS_STORAGE_KEY = 'caritas_lok_yi_locations_v12';
    const PENDING_OPS_STORAGE_KEY = 'caritas_lok_yi_pending_ops_v1';
    const WEB_MEDIA_MAP_KEY = 'caritas_lok_yi_web_media_v9';
    const PAGE_SIZE = 12;

    const DEFAULT_LOCATIONS = [
      '地下大堂', '101室', '102室', '201室', '202室',
      '301室', '302室', '禮堂', '教員室', '男生宿舍 A座', '女生宿舍 B座'
    ];

    let records = [];
    let locationOptions = [...DEFAULT_LOCATIONS];
    let pendingSyncOps = [];
    let currentUserRole = 'executor'; // 'teacher' | 'executor'
    let currentPage = 1;
    let filters = { area: 'ALL', status: 'ALL', label: '全部紀錄' };

    // 紀錄每一張卡片的展開收疊狀態（key 為 rec.id，true 為展開，預設全部收疊）
    let expandedCardMap = {};
    let isAllExpanded = false;

    // =========================================================================
    // 2. 初始化載入
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      loadLocalData();
      updateCounters();

      // 只供執行人使用，無需登入直接進入執行人專頁（保留完整所有功能）
      currentUserRole = 'executor';
      filters = { area: 'ALL', status: 'ALL', label: '全部紀錄' };
      switchMobileTab('sheet');

      if (isGasNativeAvailable() || GAS_WEB_APP_URL) {
        fetchRecordsFromGas(false);
        setInterval(() => {
          if (document.visibilityState === 'visible' && !isManualSyncing && !isFetchingFromGas) {
            fetchRecordsFromGas(false, true);
          }
        }, 30000);
      }
    });

    // =========================================================================
    // 3. 底部導覽列切換（執行人專頁完整功能）
    // =========================================================================

    function switchMobileTab(tab) {
      const sheetView = document.getElementById('view-sheet');

      ['sheet', 'filter'].forEach(k => {
        const btn = document.getElementById('bnav-' + k);
        if (!btn) return;
        const pill = btn.querySelector('.bnav-pill');
        if (k === tab) {
          btn.classList.remove('text-[#5B81B2]');
          btn.classList.add('text-[#415E91]');
          if (pill) pill.classList.add('bg-[#BDF2F6]', 'text-[#415E91]');
        } else {
          btn.classList.remove('text-[#415E91]');
          btn.classList.add('text-[#5B81B2]');
          if (pill) pill.classList.remove('bg-[#BDF2F6]', 'text-[#415E91]');
        }
      });

      sheetView.classList.remove('hidden');
      const titlePrefix = (filters.area === 'ALL' && filters.status === 'ALL') ? '維修總表（全部紀錄）' : '維修總表（' + filters.label + '）';
      document.getElementById('sheetViewTitle').textContent = titlePrefix;
      document.getElementById('activeFilterPill').textContent = filters.label;
      if (filters.status === 'pending') {
        document.getElementById('pendingHintTag').classList.remove('hidden');
      } else {
        document.getElementById('pendingHintTag').classList.add('hidden');
      }
      renderCards();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================================
    // 4. 底部篩選抽屜（更多篩選）
    // =========================================================================
    function openFilterDrawer() {
      updateFilterDrawerHighlight();
      document.getElementById('filterDrawerBackdrop').classList.remove('hidden');
    }

    function closeFilterDrawer() {
      document.getElementById('filterDrawerBackdrop').classList.add('hidden');
    }

    function updateFilterDrawerHighlight() {
      const optIds = ['fopt-ALL-ALL', 'fopt-ALL-pending', 'fopt-ALL-completed', 'fopt-日校-ALL', 'fopt-宿舍-ALL'];
      const activeId = 'fopt-' + filters.area + '-' + filters.status;
      optIds.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        const isGridItem = id.includes('日校') || id.includes('宿舍');
        if (id === activeId) {
          el.className = (isGridItem ? 'flex ' : 'w-full flex ') + 'items-center justify-between px-4 py-3.5 rounded-2xl border-2 border-[#415E91] bg-[#BDF2F6]/60 text-[#415E91] font-bold text-[14.5px]';
        } else {
          el.className = (isGridItem ? 'flex ' : 'w-full flex ') + 'items-center justify-between px-4 py-3.5 rounded-2xl border border-[#9BD2E4] bg-[#f0fbfc] text-[#415E91] font-bold text-[14.5px]';
        }
      });
    }

    function selectDrawerFilter(area, status, label) {
      filters = { area, status, label };
      currentPage = 1;
      closeFilterDrawer();

      const dot = document.getElementById('bnavFilterDot');
      if (dot) {
        if (area !== 'ALL' || status !== 'ALL') dot.classList.remove('hidden');
        else dot.classList.add('hidden');
      }

      switchMobileTab('sheet');
    }

    // =========================================================================
    // 5. 展開 / 收疊（Accordion）控制
    // =========================================================================
    function toggleCardAccordion(id) {
      expandedCardMap[id] = !expandedCardMap[id];
      const panel = document.getElementById('acc-panel-' + id);
      const chevron = document.getElementById('acc-chev-' + id);
      const label = document.getElementById('acc-label-' + id);
      if (panel) {
        if (expandedCardMap[id]) panel.classList.remove('hidden');
        else panel.classList.add('hidden');
      }
      if (chevron) {
        if (expandedCardMap[id]) chevron.classList.add('is-open');
        else chevron.classList.remove('is-open');
      }
      if (label) {
        label.textContent = expandedCardMap[id] ? '收疊進度與編輯操作' : '展開進度與編輯操作（狀態 / 日期 / 物料 / 刪除）';
      }
    }

    function toggleAllAccordions() {
      isAllExpanded = !isAllExpanded;
      records.forEach(r => {
        expandedCardMap[r.id] = isAllExpanded;
      });
      const btn = document.getElementById('expandAllToggleBtn');
      if (btn) {
        btn.textContent = isAllExpanded ? '收疊全部管理' : '展開全部管理';
      }
      renderCards();
    }

    // =========================================================================
    // 6. 卡片列表渲染（Card View）
    // =========================================================================
    function getFilteredRecords() {
      return records.filter(rec => {
        const isDone = rec.status === '已完成' || Boolean(rec.completionDate);
        if (filters.area !== 'ALL' && rec.colD !== filters.area) return false;
        if (filters.status === 'pending' && isDone) return false;
        if (filters.status === 'completed' && !isDone) return false;
        return true;
      });
    }

    function changePage(delta) {
      const filtered = getFilteredRecords();
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      const next = currentPage + delta;
      if (next >= 1 && next <= totalPages) {
        currentPage = next;
        renderCards();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function renderCards() {
      const container = document.getElementById('mobileCardsContainer');
      const emptyState = document.getElementById('emptyCardsState');
      const filtered = getFilteredRecords();
      const totalItems = filtered.length;
      const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;

      const startIdx = (currentPage - 1) * PAGE_SIZE;
      const pageItems = filtered.slice(startIdx, startIdx + PAGE_SIZE);

      document.getElementById('mobileFooterCount').textContent =
        '顯示 ' + (totalItems === 0 ? 0 : startIdx + 1) + '-' + Math.min(startIdx + PAGE_SIZE, totalItems) + ' / 共 ' + totalItems + ' 筆';
      document.getElementById('mobilePageIndicator').textContent = '第 ' + currentPage + ' / ' + totalPages + ' 頁';
      document.getElementById('mobilePrevPageBtn').disabled = currentPage <= 1;
      document.getElementById('mobileNextPageBtn').disabled = currentPage >= totalPages;

      if (pageItems.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      const isExecutor = currentUserRole === 'executor';

      container.innerHTML = pageItems.map(rec => {
        const isCompleted = rec.status === '已完成' || Boolean(rec.completionDate);
        const isPlumbing = String(rec.type || '').startsWith('水電');
        const typeIcon = isPlumbing ? '⚡' : '🔨';
        const isExpanded = Boolean(expandedCardMap[rec.id]);

        const areaBadge = rec.colD === '日校'
          ? '<span class="px-2 py-0.5 rounded-md text-[11.5px] font-bold bg-[#BDF2F6]/80 text-[#415E91] border border-[#9BD2E4]">日校</span>'
          : '<span class="px-2 py-0.5 rounded-md text-[11.5px] font-bold bg-[#9BD2E4]/50 text-[#415E91] border border-[#779EC8]">宿舍</span>';

        const statusBadge = isCompleted
          ? '<span class="px-2.5 py-0.5 rounded-full text-[11.5px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 shrink-0">已完成</span>'
          : '<span class="px-2.5 py-0.5 rounded-full text-[11.5px] font-bold bg-amber-50 text-amber-700 border border-amber-200 shrink-0">待處理</span>';

        // 現場相片縮圖與直接預覽按鈕
        const rawMediaText = String(rec.photoUpload || '').trim();
        const isEmptyMediaText = !rawMediaText || ['無', '沒有', '否', '-', '—', 'N/A'].includes(rawMediaText);
        const hasMediaFlag = !isEmptyMediaText || Boolean(rec.photoUrl || rec.mediaDataUrl);
        const thumbSrc = getRecordThumbnailUrl(rec);

        let mediaBlock = '';
        if (hasMediaFlag) {
          mediaBlock =
            '<button type="button" onclick="openMediaPreview(\'' + rec.id + '\')" class="w-full mt-2.5 p-2 rounded-xl bg-[#f0fbfc] active:bg-[#BDF2F6] border border-[#779EC8] text-[#415E91] flex items-center justify-between gap-2.5 transition-colors">' +
              '<div class="flex items-center gap-2.5 min-w-0">' +
                (thumbSrc
                  ? '<img src="' + escapeHtml(thumbSrc) + '" alt="現場縮圖" class="w-11 h-11 rounded-lg object-cover border border-[#779EC8]/70 bg-white shrink-0" onerror="this.style.display=\'none\'" />'
                  : '<div class="w-11 h-11 rounded-lg bg-[#BDF2F6] text-[#415E91] flex items-center justify-center shrink-0"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></div>') +
                '<div class="text-left min-w-0">' +
                  '<p class="text-[13px] font-bold text-[#415E91] truncate">檢視現場相片 / 影片</p>' +
                  '<p class="text-[11px] text-[#5B81B2]">點擊直接開啟放大預覽</p>' +
                '</div>' +
              '</div>' +
              '<span class="px-2.5 py-1 rounded-lg bg-[#415E91] text-white text-[11.5px] font-bold shrink-0">開啟</span>' +
            '</button>';
        }

        // 執行人專屬：展開 / 收疊操作區塊（處理狀態、待處理、完成日期、材料購買、輸入備註、刪除按鈕）
        let executorAccordionHtml = '';
        if (isExecutor) {
          const buyOptions = ['待中央購買', '自行購買物料', '不需要購買'];
          if (rec.buy && !buyOptions.includes(rec.buy)) buyOptions.unshift(rec.buy);
          const supportOptions = ['不需要', '須外界支援', '已聯絡承辦商'];
          if (rec.support && !supportOptions.includes(rec.support)) supportOptions.unshift(rec.support);
          const dateValue = normalizeDateForInput(rec.completionDate);

          executorAccordionHtml =
            '<div class="mt-3 pt-2.5 border-t border-[#BDF2F6]">' +
              '<button type="button" onclick="toggleCardAccordion(\'' + rec.id + '\')" class="w-full py-2 px-3 rounded-xl bg-[#f0fbfc] active:bg-[#BDF2F6]/80 border border-[#9BD2E4] flex items-center justify-between text-left transition-colors">' +
                '<span id="acc-label-' + rec.id + '" class="text-[12.5px] font-bold text-[#415E91]">' +
                  (isExpanded ? '收疊進度與編輯操作' : '展開進度與編輯操作（狀態 / 日期 / 物料 / 刪除）') +
                '</span>' +
                '<svg id="acc-chev-' + rec.id + '" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="accordion-chevron w-4 h-4 text-[#5B81B2] shrink-0 ' + (isExpanded ? 'is-open' : '') + '"><path d="m6 9 6 6 6-6"/></svg>' +
              '</button>' +

              '<div id="acc-panel-' + rec.id + '" class="' + (isExpanded ? '' : 'hidden ') + 'mt-2.5 p-3.5 rounded-2xl bg-[#f0fbfc] border border-[#9BD2E4] space-y-3">' +
                '<div class="grid grid-cols-2 gap-2.5">' +
                  '<div>' +
                    '<label class="block text-[11.5px] font-bold text-[#5B81B2] mb-1">處理狀態</label>' +
                    '<select onchange="updateRecordField(\'' + rec.id + '\', \'status\', this.value)" class="w-full px-2.5 py-2 rounded-xl border ' + (isCompleted ? 'border-emerald-300 bg-emerald-50 text-emerald-800' : 'border-amber-300 bg-amber-50 text-amber-800') + ' font-bold">' +
                      '<option value="待處理" ' + (!isCompleted ? 'selected' : '') + '>待處理</option>' +
                      '<option value="已完成" ' + (isCompleted ? 'selected' : '') + '>已完成</option>' +
                    '</select>' +
                  '</div>' +
                  '<div>' +
                    '<label class="block text-[11.5px] font-bold text-[#5B81B2] mb-1">完成日期</label>' +
                    '<input type="date" id="date-input-' + rec.id + '" value="' + escapeHtml(dateValue) + '" ' +
                    'onfocus="this.dataset.origVal = this.value;" ' +
                    'onchange="handleCompletionDateChange(\'' + rec.id + '\', this)" ' +
                    'onblur="handleCompletionDateBlur(\'' + rec.id + '\', this)" ' +
                    'class="w-full px-2.5 py-2 rounded-xl border border-[#9BD2E4] bg-white text-[#415E91]" />' +
                  '</div>' +
                '</div>' +

                '<div class="grid grid-cols-2 gap-2.5">' +
                  '<div>' +
                    '<label class="block text-[11.5px] font-bold text-[#5B81B2] mb-1">材料購買</label>' +
                    '<select onchange="updateRecordField(\'' + rec.id + '\', \'buy\', this.value)" class="w-full px-2.5 py-2 rounded-xl border border-[#9BD2E4] bg-white text-[#415E91]">' +
                      buyOptions.map(opt => '<option value="' + escapeHtml(opt) + '" ' + (rec.buy === opt ? 'selected' : '') + '>' + escapeHtml(opt) + '</option>').join('') +
                    '</select>' +
                  '</div>' +
                  '<div>' +
                    '<label class="block text-[11.5px] font-bold text-[#5B81B2] mb-1">須外界支援</label>' +
                    '<select onchange="updateRecordField(\'' + rec.id + '\', \'support\', this.value)" class="w-full px-2.5 py-2 rounded-xl border border-[#9BD2E4] bg-white text-[#415E91]">' +
                      supportOptions.map(opt => '<option value="' + escapeHtml(opt) + '" ' + (rec.support === opt ? 'selected' : '') + '>' + escapeHtml(opt) + '</option>').join('') +
                    '</select>' +
                  '</div>' +
                '</div>' +

                '<div>' +
                  '<label class="block text-[11.5px] font-bold text-[#5B81B2] mb-1">備註欄</label>' +
                  '<input type="text" value="' + escapeHtml(rec.remark || '') + '" onchange="updateRecordField(\'' + rec.id + '\', \'remark\', this.value)" placeholder="輸入備註..." class="w-full px-3 py-2 rounded-xl border border-[#9BD2E4] bg-white text-[#415E91]" />' +
                '</div>' +

                '<div class="pt-1 flex items-center gap-2">' +
                  '<button type="button" onclick="clearCompletionDate(\'' + rec.id + '\')" class="flex-1 py-2.5 px-3 rounded-xl text-[13.5px] font-bold text-[#415E91] bg-white active:bg-[#BDF2F6] border border-[#779EC8] flex items-center justify-center gap-1.5 transition-colors">' +
                    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-[#5B81B2]"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="m14.5 14.5-5 5"/><path d="m9.5 14.5 5 5"/></svg>' +
                    '<span>清除日期</span>' +
                  '</button>' +
                  '<button type="button" onclick="openDeleteConfirmModal(\'' + rec.id + '\')" class="flex-1 py-2.5 px-3 rounded-xl text-[13.5px] font-bold text-rose-600 bg-rose-50 active:bg-rose-100 border border-rose-200 flex items-center justify-center gap-1.5 transition-colors">' +
                    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>' +
                    '<span>刪除紀錄</span>' +
                  '</button>' +
                '</div>' +
              '</div>' +
            '</div>';
        }

        return '<article class="bg-white rounded-2xl p-4 border border-[#9BD2E4] shadow-card">' +
          '<div class="flex items-start justify-between gap-2">' +
            '<div class="flex items-center gap-1.5 flex-wrap">' +
              '<span class="inline-flex items-center justify-center w-7 h-7 rounded-lg text-[14px] bg-[#BDF2F6]/70 border border-[#9BD2E4]">' + typeIcon + '</span>' +
              areaBadge +
              '<span class="text-[16px] font-bold text-[#415E91]">' + escapeHtml(rec.location) + '</span>' +
            '</div>' +
            statusBadge +
          '</div>' +

          '<p class="text-[14px] text-[#415E91] mt-2.5 bg-[#f0fbfc] p-3 rounded-xl border border-[#BDF2F6] leading-relaxed break-words">' +
            escapeHtml(rec.description) +
          '</p>' +

          '<div class="flex items-center justify-between text-[12px] text-[#5B81B2] mt-2.5">' +
            '<span>呈報人：<strong class="text-[#415E91]">' + escapeHtml(rec.reporter) + '</strong></span>' +
            '<span class="font-mono text-[11px]">' + escapeHtml(rec.timestamp) + '</span>' +
          '</div>' +

          mediaBlock +
          executorAccordionHtml +
        '</article>';
      }).join('');
    }

    // =========================================================================
    // 7. 直接開啟相片 / 影片預覽（無「Google Drive 開啟原始檔案」文字與連結）
    // =========================================================================
    function extractGoogleDriveFileId(url) {
      if (!url) return '';
      const str = String(url).trim();
      const dMatch = str.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (dMatch) return dMatch[1];
      const idMatch = str.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (idMatch) return idMatch[1];
      return '';
    }

    function getRecordThumbnailUrl(rec) {
      if (rec.mediaDataUrl && rec.mediaType !== 'video') {
        return rec.mediaDataUrl;
      }
      const driveId = extractGoogleDriveFileId(rec.photoUrl || rec.photoUpload);
      if (driveId) {
        return 'https://drive.google.com/thumbnail?id=' + driveId + '&sz=w240';
      }
      return '';
    }

    function openMediaPreview(id) {
      const rec = records.find(r => r.id === id);
      if (!rec) return;

      document.getElementById('modalMediaTitle').textContent = rec.location + ' — 現場附件';
      document.getElementById('modalMediaMeta').textContent = '呈報人：' + rec.reporter + ' ・ ' + rec.colD + ' ・ ' + rec.timestamp;

      const content = document.getElementById('modalMediaContent');
      const rawUrl = (rec.photoUrl && rec.photoUrl.startsWith('http'))
        ? rec.photoUrl
        : (rec.photoUpload && rec.photoUpload.startsWith('http') ? rec.photoUpload : '');
      const driveId = extractGoogleDriveFileId(rawUrl);

      if (rec.mediaType === 'video' && rec.mediaDataUrl) {
        content.innerHTML = '<video src="' + rec.mediaDataUrl + '" controls autoplay playsinline class="w-full max-h-[70vh] rounded-xl shadow-lg"></video>';
      } else if (rec.mediaDataUrl) {
        content.innerHTML = '<img src="' + rec.mediaDataUrl + '" alt="現場相片" class="w-full max-h-[72vh] rounded-xl shadow-lg object-contain bg-white" />';
      } else if (driveId) {
        const previewImgUrl = 'https://drive.google.com/thumbnail?id=' + driveId + '&sz=w1600';
        const fallbackDriveViewUrl = 'https://drive.google.com/uc?export=view&id=' + driveId;
        const drivePreviewIframeUrl = 'https://drive.google.com/file/d/' + driveId + '/preview';
        content.innerHTML =
          '<img src="' + escapeHtml(previewImgUrl) + '" alt="現場相片" class="w-full max-h-[72vh] rounded-xl shadow-lg object-contain bg-white" ' +
            'onerror="if(!this.dataset.triedUc){this.dataset.triedUc=\'1\';this.src=\'' + escapeHtml(fallbackDriveViewUrl) + '\';}else{this.outerHTML=\'<iframe src=\\\'' + escapeHtml(drivePreviewIframeUrl) + '\\\' class=\\\'w-full h-[65vh] rounded-xl border-0 bg-white\\\' allow=\\\'autoplay\\\'></iframe>\';}" />';
      } else if (rawUrl) {
        content.innerHTML =
          '<img src="' + escapeHtml(rawUrl) + '" alt="現場相片" class="w-full max-h-[72vh] rounded-xl shadow-lg object-contain bg-white" ' +
            'onerror="this.outerHTML=\'<iframe src=\\\'' + escapeHtml(rawUrl) + '\\\' class=\\\'w-full h-[65vh] rounded-xl border-0 bg-white\\\'></iframe>\'" />';
      } else {
        content.innerHTML =
          '<div class="bg-white rounded-xl p-6 text-center space-y-1.5 max-w-xs w-full">' +
            '<p class="text-[14.5px] font-bold text-[#415E91]">試算表已標記「有」現場附件</p>' +
            '<p class="text-[12.5px] text-[#5B81B2]">此紀錄為舊版 Google 表單直接上傳，無內嵌預覽圖。</p>' +
          '</div>';
      }

      openModal('mediaModal');
    }

    // =========================================================================
    // 8. 雲端資料同步與本機快取（與 Code.gs / 程式碼_v11.gs 完全相容）
    // =========================================================================
    function isGasNativeAvailable() {
      try {
        return typeof window.google !== 'undefined' &&
               Boolean(window.google.script) &&
               Boolean(window.google.script.run);
      } catch (e) {
        return false;
      }
    }

    function runGasServerFunction(fnName, arg, timeoutMs = 10000) {
      return new Promise((resolve, reject) => {
        let settled = false;
        const timer = setTimeout(() => {
          if (!settled) {
            settled = true;
            reject(new Error('雲端連線逾時'));
          }
        }, timeoutMs);

        try {
          const runner = window.google.script.run
            .withSuccessHandler(res => {
              if (!settled) {
                settled = true;
                clearTimeout(timer);
                resolve(res);
              }
            })
            .withFailureHandler(err => {
              if (!settled) {
                settled = true;
                clearTimeout(timer);
                reject(new Error(err && err.message ? err.message : String(err)));
              }
            });
          if (arg !== undefined) runner[fnName](arg);
          else runner[fnName]();
        } catch (err) {
          if (!settled) {
            settled = true;
            clearTimeout(timer);
            reject(err);
          }
        }
      });
    }

    function loadLocalData() {
      try {
        const rawRecords = localStorage.getItem(STORAGE_KEY);
        if (rawRecords) {
          const parsed = JSON.parse(rawRecords);
          records = Array.isArray(parsed) ? parsed.map((item, idx) => normalizeRecordItem(item, idx)) : [];
        }
        const rawLocations = localStorage.getItem(LOCATIONS_STORAGE_KEY);
        if (rawLocations) {
          const parsedLoc = JSON.parse(rawLocations);
          if (Array.isArray(parsedLoc) && parsedLoc.length > 0) locationOptions = parsedLoc;
        }
        const rawOps = localStorage.getItem(PENDING_OPS_STORAGE_KEY);
        if (rawOps) {
          const parsedOps = JSON.parse(rawOps);
          if (Array.isArray(parsedOps)) pendingSyncOps = parsedOps;
        }
      } catch (e) {
        records = [];
      }
      updateSyncButtonUI();
    }

    function saveLocalData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        localStorage.setItem(LOCATIONS_STORAGE_KEY, JSON.stringify(locationOptions));
        localStorage.setItem(PENDING_OPS_STORAGE_KEY, JSON.stringify(pendingSyncOps));
      } catch (e) {}
      updateCounters();
      updateSyncButtonUI();
    }

    function updateSyncButtonUI() {
      const badge = document.getElementById('syncBtnBadge');
      if (!badge) return;
      if (pendingSyncOps.length > 0) {
        badge.textContent = pendingSyncOps.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function updateCounters() {
      const total = records.length;
      const completed = records.filter(r => r.status === '已完成' || Boolean(r.completionDate)).length;
      const pending = total - completed;
      const dayCount = records.filter(r => r.colD === '日校').length;
      const dormCount = records.filter(r => r.colD === '宿舍').length;

      document.getElementById('badge-pending').textContent = pending;
      document.getElementById('badge-completed').textContent = completed;
      document.getElementById('bnavTotalBadge').textContent = total;

      const setText = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
      setText('fcount-all', total);
      setText('fcount-pending', pending);
      setText('fcount-completed', completed);
      setText('fcount-day', dayCount);
      setText('fcount-dorm', dormCount);
    }

    function sanitizeCellText(val) {
      if (val === null || val === undefined) return '';
      return String(val).replace(/[\r\n\t\u0000-\u001F]+/g, ' ').trim();
    }

    function normalizeDateForInput(rawVal) {
      if (!rawVal) return '';
      const str = String(rawVal).trim();
      if (/^\d{4}-\d{1,2}-\d{1,2}/.test(str)) {
        const parts = str.split(' ')[0].split('-');
        return parts[0] + '-' + parts[1].padStart(2, '0') + '-' + parts[2].padStart(2, '0');
      }
      if (/^\d{4}\/\d{1,2}\/\d{1,2}/.test(str)) {
        const parts = str.split(' ')[0].split('/');
        return parts[0] + '-' + parts[1].padStart(2, '0') + '-' + parts[2].padStart(2, '0');
      }
      if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(str)) {
        const parts = str.split(' ')[0].split('/');
        return parts[2] + '-' + parts[1].padStart(2, '0') + '-' + parts[0].padStart(2, '0');
      }
      return '';
    }

    function findWebMediaForRecord(ts, reporter, location) {
      try {
        const map = JSON.parse(localStorage.getItem(WEB_MEDIA_MAP_KEY) || '{}');
        return map[ts + '||' + reporter + '||' + location] || null;
      } catch (e) {
        return null;
      }
    }

    function saveWebMediaForRecord(ts, reporter, location, dataUrl, mediaType) {
      if (!dataUrl) return;
      try {
        const map = JSON.parse(localStorage.getItem(WEB_MEDIA_MAP_KEY) || '{}');
        map[ts + '||' + reporter + '||' + location] = { dataUrl, mediaType: mediaType || 'image' };
        localStorage.setItem(WEB_MEDIA_MAP_KEY, JSON.stringify(map));
      } catch (e) {}
    }

    function normalizeRecordItem(item, idx) {
      const ts = sanitizeCellText(item.timestamp);
      const rep = sanitizeCellText(item.reporter);
      const typ = sanitizeCellText(item.type);
      const area = sanitizeCellText(item.colD) || '日校';
      const loc = sanitizeCellText(item.location);
      const desc = sanitizeCellText(item.description);
      const photo = sanitizeCellText(item.photoUpload);
      const buy = sanitizeCellText(item.buy) || '不需要購買';
      const cDate = normalizeDateForInput(sanitizeCellText(item.completionDate));
      const sup = sanitizeCellText(item.support) || '不需要';
      const rem = sanitizeCellText(item.remark);
      const stat = sanitizeCellText(item.status) || (cDate ? '已完成' : '待處理');
      const localMedia = findWebMediaForRecord(ts, rep, loc);

      return {
        id: 'gas-' + (item.rowIndex || idx) + '-' + String(ts || idx),
        rowIndex: item.rowIndex || (idx + 2),
        timestamp: ts,
        reporter: rep,
        type: typ,
        colD: area,
        location: loc,
        description: desc,
        photoUpload: photo,
        buy: buy,
        completionDate: cDate,
        support: sup,
        remark: rem,
        status: stat,
        photoUrl: sanitizeCellText(item.photoUrl),
        mediaDataUrl: item.mediaDataUrl || (localMedia ? localMedia.dataUrl : ''),
        mediaType: item.mediaType || (localMedia ? localMedia.mediaType : 'image')
      };
    }

    let isFetchingFromGas = false;
    let isManualSyncing = false;

    async function fetchRecordsFromGas(showFeedback = true, isBackgroundPoll = false) {
      if (isFetchingFromGas) return;
      isFetchingFromGas = true;
      try {
        let payload = null;
        if (isGasNativeAvailable()) {
          const raw = await runGasServerFunction('apiReadAllData', undefined, 10000);
          payload = (typeof raw === 'string') ? JSON.parse(raw) : raw;
        } else {
          const sep = GAS_WEB_APP_URL.includes('?') ? '&' : '?';
          const res = await fetch(GAS_WEB_APP_URL + sep + 'action=read&t=' + Date.now(), { cache: 'no-store' });
          payload = await res.json();
        }

        if (payload && payload.status === 'error') {
          throw new Error(payload.message || '雲端讀取錯誤');
        }
        const rawList = Array.isArray(payload) ? payload : (payload && payload.records ? payload.records : []);
        records = rawList.map((item, idx) => normalizeRecordItem(item, idx));

        if (payload && Array.isArray(payload.locations) && payload.locations.length > 0) {
          locationOptions = payload.locations;
            }

        saveLocalData();
        if (!isBackgroundPoll) renderCards();
        if (showFeedback) showToast('已同步最新 ' + records.length + ' 筆雲端資料', 'success');
      } catch (err) {
        if (showFeedback) showToast('同步失敗：' + err.message, 'error');
      } finally {
        isFetchingFromGas = false;
      }
    }

    async function syncToCloud(showFeedback = true) {
      if (isManualSyncing) return;
      isManualSyncing = true;
      const icon = document.getElementById('syncBtnIcon');
      if (icon) icon.classList.add('animate-spin');

      try {
        if (pendingSyncOps.length > 0) {
          const snapshot = [...pendingSyncOps];
          for (const op of snapshot) {
            const res = await postToGas(op);
            if (res && res.status === 'success') {
              pendingSyncOps = pendingSyncOps.filter(item => item !== op);
            }
          }
          saveLocalData();
        }
        await fetchRecordsFromGas(showFeedback, false);
      } finally {
        isManualSyncing = false;
        if (icon) icon.classList.remove('animate-spin');
      }
    }

    async function postToGas(payload) {
      if (isGasNativeAvailable()) {
        const rawRes = await runGasServerFunction('apiHandleAction', JSON.stringify(payload), payload.photoBase64 ? 30000 : 12000);
        return (typeof rawRes === 'string') ? JSON.parse(rawRes) : rawRes;
      }

      const jsonStr = JSON.stringify(payload);
      if (!payload.photoBase64 && encodeURIComponent(jsonStr).length < 6000) {
        const sep = GAS_WEB_APP_URL.includes('?') ? '&' : '?';
        const res = await fetch(GAS_WEB_APP_URL + sep + 'payload=' + encodeURIComponent(jsonStr) + '&t=' + Date.now(), { cache: 'no-store' });
        return await res.json();
      }

      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: jsonStr
        });
        return await res.json();
      } catch (err) {
        const formBody = new URLSearchParams();
        formBody.append('payload', jsonStr);
        await fetch(GAS_WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: formBody });
        return { status: 'success' };
      }
    }

    function handleCompletionDateChange(id, inputEl) {
      inputEl.dataset.userChanged = '1';
      const newVal = inputEl.value || '';
      inputEl.dataset.origVal = newVal;
      updateRecordField(id, 'completionDate', newVal);
    }

    function handleCompletionDateBlur(id, inputEl) {
      if (inputEl.dataset.userChanged === '1') {
        inputEl.dataset.userChanged = '';
        return;
      }
      const origVal = inputEl.dataset.origVal || '';
      const newVal = inputEl.value || '';
      if (newVal === origVal) return;

      const todayStr = new Date().toISOString().split('T')[0];
      if (!origVal && newVal === todayStr) {
        if (!confirm('是否將完成日期設為今日（' + todayStr + '）並標記為「已完成」？')) {
          inputEl.value = '';
          return;
        }
      }

      inputEl.dataset.origVal = newVal;
      updateRecordField(id, 'completionDate', newVal);
    }

    function clearCompletionDate(id) {
      const inputEl = document.getElementById('date-input-' + id);
      if (inputEl) {
        inputEl.value = '';
        inputEl.dataset.origVal = '';
        inputEl.dataset.userChanged = '';
      }
      updateRecordField(id, 'completionDate', '');
      showToast('已清除完成日期（回復空白）', 'info');
    }

    async function updateRecordField(id, field, value) {
      const idx = records.findIndex(r => r.id === id);
      if (idx === -1) return;

      records[idx][field] = value;
      if (field === 'status') {
        if (value === '已完成' && !records[idx].completionDate) {
          records[idx].completionDate = new Date().toISOString().split('T')[0];
        } else if (value === '待處理') {
          records[idx].completionDate = '';
        }
      } else if (field === 'completionDate') {
        records[idx].status = value ? '已完成' : '待處理';
      }

      saveLocalData();
      renderCards();

      const updatePayload = {
        action: 'update_field',
        changedField: field,
        rowIndex: records[idx].rowIndex || '',
        timestamp: records[idx].timestamp,
        reporter: records[idx].reporter,
        location: records[idx].location,
        buy: records[idx].buy,
        completionDate: records[idx].completionDate,
        support: records[idx].support,
        remark: records[idx].remark,
        status: records[idx].status
      };

      try {
        const res = await postToGas(updatePayload);
        if (res && res.status === 'success') {
          showToast('已同步更新至雲端', 'success');
        } else {
          pendingSyncOps.push(updatePayload);
          saveLocalData();
          showToast('已暫存修改，請點擊頂部同步圖示', 'info');
        }
      } catch (err) {
        pendingSyncOps.push(updatePayload);
        saveLocalData();
        showToast('已暫存修改，稍後自動同步', 'info');
      }
    }

    // =========================================================================
    // 9. 刪除紀錄與彈窗管理
    // =========================================================================
    let pendingDeleteId = null;

    function openDeleteConfirmModal(id) {
      const rec = records.find(r => r.id === id);
      if (!rec) return;
      pendingDeleteId = id;
      document.getElementById('deleteConfirmDesc').textContent =
        '確定要刪除「' + rec.location + '」（呈報人：' + rec.reporter + '）的維修紀錄嗎？';
      openModal('deleteConfirmModal');
    }

    async function confirmDeleteRecord() {
      if (!pendingDeleteId) return;
      const idx = records.findIndex(r => r.id === pendingDeleteId);
      if (idx === -1) {
        closeModal('deleteConfirmModal');
        return;
      }

      const target = records[idx];
      records.splice(idx, 1);
      saveLocalData();
      renderCards();
      closeModal('deleteConfirmModal');

      const delPayload = {
        action: 'delete_record',
        rowIndex: target.rowIndex || '',
        timestamp: target.timestamp,
        reporter: target.reporter,
        location: target.location
      };

      try {
        const res = await postToGas(delPayload);
        if (res && res.status === 'success') showToast('已從雲端刪除該筆紀錄', 'success');
        else {
          pendingSyncOps.push(delPayload);
          saveLocalData();
          showToast('已暫存刪除，請點擊頂部同步圖示', 'info');
        }
      } catch (err) {
        pendingSyncOps.push(delPayload);
        saveLocalData();
        showToast('已暫存刪除，稍後自動同步', 'info');
      }
    }

    function openModal(id) {
      const el = document.getElementById(id);
      if (el) el.classList.remove('hidden');
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      if (el) el.classList.add('hidden');
      if (id === 'deleteConfirmModal') pendingDeleteId = null;
    }



    let toastTimer = null;
    function showToast(message, type = 'success') {
      const toast = document.getElementById('appToast');
      const dot = document.getElementById('toastDot');
      const msgEl = document.getElementById('toastMessage');
      if (!toast || !msgEl) return;

      msgEl.textContent = message;
      if (dot) {
        dot.className = 'w-2.5 h-2.5 rounded-full shrink-0 ' +
          (type === 'error' ? 'bg-rose-400' : (type === 'info' ? 'bg-sky-300' : 'bg-emerald-400'));
      }

      toast.classList.remove('translate-y-[160%]', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-[160%]', 'opacity-0');
      }, 3000);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
  </script>
