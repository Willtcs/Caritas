<script>
  const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyCHwbGTPm_C4C5ekBjIBmwKx7yXzZQC_rSeFQaGHrjvbrSTUhvQVDFedLPD3AEIfm31g/exec';

  const STORAGE_KEY = 'caritas_lok_yi_repair_records_v12';
  const PENDING_OPS_STORAGE_KEY = 'caritas_lok_yi_pending_ops_v1';
  const WEB_MEDIA_MAP_KEY = 'caritas_lok_yi_web_media_v9';
  const PIN_CONFIG_KEY = 'caritas_lok_yi_exec_pin_cfg_v1';
  const PIN_UNLOCKED_KEY = 'caritas_lok_yi_exec_unlocked_v1';
  const PAGE_SIZE = 15;

  let records = [];
  let pendingSyncOps = [];
  let currentPage = 1;
  let filters = { area: 'ALL', status: 'ALL', buy: 'ALL', keyword: '', label: '全部紀錄' };
  let sortMode = 'time';
  let expandedCardMap = {};
  let isAllExpanded = false;

  window.addEventListener('DOMContentLoaded', function() {
    checkExecutorPinGate();
    loadLocalData();
    updateCounters();
    renderAllViews();

    if (isGasNativeAvailable() || GAS_WEB_APP_URL) {
      if (records.length > 0) preloadVisiblePendingMedia();
      syncToCloud(false);

      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible' && !isManualSyncing && !isFetchingFromGas) {
          syncToCloud(false);
        }
      });

      // 每 5 秒觸發一次全樣式即時備份檢查（「水電及其他 2627 - 備份」）
      setInterval(function() {
        if (document.visibilityState === 'visible') {
          if (isGasNativeAvailable()) {
            runGasServerFunction('apiEnsureStyledBackup', false, 8000).catch(function() {});
          } else if (GAS_WEB_APP_URL) {
            const sep = GAS_WEB_APP_URL.includes('?') ? '&' : '?';
            fetch(GAS_WEB_APP_URL + sep + 'action=backup_tick&t=' + Date.now(), { method: 'GET', redirect: 'follow' }).catch(function() {});
          }
        }
      }, 5000);
    }
  });

  function getPinConfig() {
    try {
      const raw = localStorage.getItem(PIN_CONFIG_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        return { enabled: parsed.enabled !== false, code: parsed.code || '577' };
      }
    } catch (e) {}
    return { enabled: false, code: '577' };
  }

  function checkExecutorPinGate() {
    const cfg = getPinConfig();
    const urlParams = new URLSearchParams(window.location.search);
    const urlKey = urlParams.get('key');
    if (urlKey && urlKey === cfg.code) {
      try { localStorage.setItem(PIN_UNLOCKED_KEY, cfg.code); } catch (e) {}
      return;
    }
    if (!cfg.enabled) return;
    try {
      if (localStorage.getItem(PIN_UNLOCKED_KEY) === cfg.code) return;
    } catch (e) {}
    openModal('pinGateModal');
  }

  function verifyExecutorPin(e) {
    e.preventDefault();
    const cfg = getPinConfig();
    const val = (document.getElementById('pinGateInput').value || '').trim();
    if (val === cfg.code) {
      try { localStorage.setItem(PIN_UNLOCKED_KEY, cfg.code); } catch (err) {}
      document.getElementById('pinGateErr').classList.add('hidden');
      closeModal('pinGateModal');
      showToast('已解鎖並記憶本裝置', 'success');
    } else {
      document.getElementById('pinGateErr').classList.remove('hidden');
    }
  }

  function openPinSettingsModal() {
    const cfg = getPinConfig();
    document.getElementById('pinEnabledToggle').checked = cfg.enabled;
    document.getElementById('pinCodeSettingInput').value = cfg.code;
    openModal('pinSettingsModal');
  }

  function savePinSettings(e) {
    e.preventDefault();
    const enabled = document.getElementById('pinEnabledToggle').checked;
    const code = (document.getElementById('pinCodeSettingInput').value || '').trim() || '577';
    try {
      localStorage.setItem(PIN_CONFIG_KEY, JSON.stringify({ enabled: enabled, code: code }));
      localStorage.setItem(PIN_UNLOCKED_KEY, code);
    } catch (err) {}
    closeModal('pinSettingsModal');
    showToast(enabled ? '已啟用執行人 PIN 碼保護（' + code + '）' : '已設為免 PIN 碼直接進入', 'success');
  }

  function lockThisDeviceNow() {
    const cfg = getPinConfig();
    try {
      localStorage.setItem(PIN_CONFIG_KEY, JSON.stringify({ enabled: true, code: cfg.code }));
      localStorage.removeItem(PIN_UNLOCKED_KEY);
    } catch (err) {}
    closeModal('pinSettingsModal');
    openModal('pinGateModal');
  }

  function applyFilter(area, status, buy, label) {
    filters.area = area;
    filters.status = status;
    filters.buy = buy;
    filters.label = label;
    currentPage = 1;

    // 6. 右邊表單頂部標題不要括號及括號內文字
    const titleEl = document.getElementById('sheetViewTitle');
    if (titleEl) titleEl.textContent = '維修總表';
    const pillEl = document.getElementById('activeFilterPill');
    if (pillEl) pillEl.textContent = label;

    const isTopGroup = function(id) {
      return id === 'dnav-ALL-ALL-ALL' || id === 'dnav-ALL-pending-ALL' || id === 'dnav-ALL-completed-ALL';
    };

    document.querySelectorAll('.dnav-btn').forEach(function(btn) {
      const padClass = isTopGroup(btn.id) ? 'py-3 text-[14px]' : 'py-2.5 text-[13.5px]';
      btn.className = 'dnav-btn w-full flex items-center justify-between text-left px-3.5 ' + padClass + ' rounded-xl font-semibold text-[#BDF2F6] hover:bg-[#5B81B2]/60 transition-all cursor-pointer';
    });
    const activeDesktopBtn = document.getElementById('dnav-' + area + '-' + status + '-' + buy);
    if (activeDesktopBtn) {
      const padClass = isTopGroup(activeDesktopBtn.id) ? 'py-3 text-[14px]' : 'py-2.5 text-[13.5px]';
      activeDesktopBtn.className = 'dnav-btn w-full flex items-center justify-between text-left px-3.5 ' + padClass + ' rounded-xl font-bold bg-[#BDF2F6] text-[#415E91] shadow-sm transition-all cursor-pointer';
    }

    const bSheet = document.getElementById('bnav-sheet');
    const bPend = document.getElementById('bnav-pending-quick');
    const bFilt = document.getElementById('bnav-filter');
    const dot = document.getElementById('bnavFilterDot');

    [bSheet, bPend, bFilt].forEach(function(b) {
      if (!b) return;
      b.classList.remove('text-[#415E91]', 'font-bold');
      b.classList.add('text-[#5B81B2]', 'font-semibold');
      const pill = b.querySelector('.bnav-pill');
      if (pill) pill.classList.remove('bg-[#BDF2F6]', 'text-[#415E91]');
    });

    let activeBottom = bSheet;
    if (area === 'ALL' && status === 'pending' && buy === 'ALL') activeBottom = bPend;
    else if (!(area === 'ALL' && status === 'ALL' && buy === 'ALL')) activeBottom = bFilt;

    if (activeBottom) {
      activeBottom.classList.remove('text-[#5B81B2]', 'font-semibold');
      activeBottom.classList.add('text-[#415E91]', 'font-bold');
      const pill = activeBottom.querySelector('.bnav-pill');
      if (pill) pill.classList.add('bg-[#BDF2F6]', 'text-[#415E91]');
    }

    if (dot) {
      if (area !== 'ALL' || buy !== 'ALL' || status === 'completed') dot.classList.remove('hidden');
      else dot.classList.add('hidden');
    }

    renderAllViews();
  }

  function openFilterDrawer() { document.getElementById('filterDrawerBackdrop').classList.remove('hidden'); }
  function closeFilterDrawer() { document.getElementById('filterDrawerBackdrop').classList.add('hidden'); }
  function selectDrawerFilter(area, status, buy, label) { closeFilterDrawer(); applyFilter(area, status, buy, label); }

  function handleSearchInput(val) {
    filters.keyword = String(val || '').trim().toLowerCase();
    const clearBtn = document.getElementById('clearSearchBtn');
    if (clearBtn) clearBtn.classList.toggle('hidden', !filters.keyword);
    currentPage = 1;
    renderAllViews();
  }

  function clearSearchInput() {
    const input = document.getElementById('searchKeywordInput');
    if (input) input.value = '';
    handleSearchInput('');
  }

  function setSortMode(mode) {
    sortMode = mode;
    const btnTime = document.getElementById('sort-time');
    const btnLoc = document.getElementById('sort-location');
    if (mode === 'time') {
      btnTime.className = 'px-3 py-1 rounded-lg text-[12px] font-bold bg-[#415E91] text-white transition-colors cursor-pointer';
      btnLoc.className = 'px-3 py-1 rounded-lg text-[12px] font-bold text-[#5B81B2] hover:text-[#415E91] transition-colors cursor-pointer';
    } else {
      btnLoc.className = 'px-3 py-1 rounded-lg text-[12px] font-bold bg-[#415E91] text-white transition-colors cursor-pointer';
      btnTime.className = 'px-3 py-1 rounded-lg text-[12px] font-bold text-[#5B81B2] hover:text-[#415E91] transition-colors cursor-pointer';
    }
    currentPage = 1;
    renderAllViews();
  }

  function getFilteredAndSortedRecords() {
    const list = records.filter(function(rec) {
      const isDone = rec.status === '已完成' || Boolean(rec.completionDate);
      if (filters.area !== 'ALL' && rec.colD !== filters.area) return false;
      if (filters.status === 'pending' && isDone) return false;
      if (filters.status === 'completed' && !isDone) return false;
      if (filters.buy === 'NEED_BUY' && rec.buy !== '待中央購買' && rec.buy !== '自行購買物料') return false;
      if (filters.keyword) {
        const hay = (rec.location + ' ' + rec.description + ' ' + rec.reporter + ' ' + rec.remark + ' ' + rec.colD).toLowerCase();
        if (!hay.includes(filters.keyword)) return false;
      }
      return true;
    });

    if (sortMode === 'location') {
      return list.slice().sort(function(a, b) {
        const areaCmp = String(a.colD || '').localeCompare(String(b.colD || ''), 'zh-Hant');
        if (areaCmp !== 0) return areaCmp;
        return String(a.location || '').localeCompare(String(b.location || ''), 'zh-Hant', { numeric: true });
      });
    }
    return list;
  }

  function changePage(delta) {
    const filtered = getFilteredAndSortedRecords();
    const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    const next = currentPage + delta;
    if (next >= 1 && next <= totalPages) {
      currentPage = next;
      renderAllViews();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function renderAllViews() {
    const filtered = getFilteredAndSortedRecords();
    const totalItems = filtered.length;
    const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;

    const startIdx = (currentPage - 1) * PAGE_SIZE;
    const pageItems = filtered.slice(startIdx, startIdx + PAGE_SIZE);

    document.getElementById('footerCountText').textContent =
      '顯示 ' + (totalItems === 0 ? 0 : startIdx + 1) + '-' + Math.min(startIdx + PAGE_SIZE, totalItems) + ' / 共 ' + totalItems + ' 筆';
    document.getElementById('pageIndicatorText').textContent = '第 ' + currentPage + ' / ' + totalPages + ' 頁';
    document.getElementById('prevPageBtn').disabled = currentPage <= 1;
    document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;

    const emptyBox = document.getElementById('emptyStateBox');
    const desktopBody = document.getElementById('desktopTableBody');
    const mobileContainer = document.getElementById('mobileCardsContainer');

    if (pageItems.length === 0) {
      desktopBody.innerHTML = '';
      mobileContainer.innerHTML = '';
      emptyBox.classList.remove('hidden');
      return;
    }

    emptyBox.classList.add('hidden');
    renderDesktopTableRows(desktopBody, pageItems);
    renderMobileCards(mobileContainer, pageItems);
    preloadVisiblePendingMedia();
  }

  function renderDesktopTableRows(tbody, pageItems) {
    // 1. 待處理維修、已完成維修、日校區域、宿舍區域全部採用純文字顯示，不用下拉選單或輸入框
    const isReadOnlySubView = !(filters.area === 'ALL' && filters.status === 'ALL' && filters.buy === 'ALL');

    tbody.innerHTML = pageItems.map(function(rec) {
      const isCompleted = rec.status === '已完成' || Boolean(rec.completionDate);
      const typeIcon = String(rec.type || '').startsWith('水電') ? '⚡' : '🔨';
      const areaBadge = rec.colD === '日校'
        ? '<span class="px-2 py-0.5 rounded-full text-[11.5px] font-bold bg-[#BDF2F6]/70 text-[#415E91] border border-[#9BD2E4]">日校</span>'
        : '<span class="px-2 py-0.5 rounded-full text-[11.5px] font-bold bg-[#9BD2E4]/45 text-[#415E91] border border-[#779EC8]">宿舍</span>';

      const rawMediaText = String(rec.photoUpload || '').trim();
      const isEmptyMediaText = !rawMediaText || ['無', '沒有', '否', '-', '—', 'N/A'].includes(rawMediaText);
      const hasMediaFlag = !isEmptyMediaText || Boolean(rec.photoUrl || rec.mediaDataUrl);
      const thumbSrc = getRecordThumbnailUrl(rec);

      const mediaCell = hasMediaFlag
        ? '<button type="button" onclick="openMediaPreview(\'' + rec.id + '\')" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[#BDF2F6]/70 hover:bg-[#9BD2E4] text-[#415E91] border border-[#779EC8] text-[12px] font-bold cursor-pointer">' +
            (thumbSrc ? '<img id="dthumb-' + rec.id + '" src="' + escapeHtml(thumbSrc) + '" class="w-6 h-6 rounded object-cover bg-white shrink-0" onerror="this.style.display=\'none\'" />' : '🖼️') +
            '<span>檢視</span></button>'
        : '<span class="text-[#779EC8] text-[12px]">—</span>';

      const buyOptions = ['待中央購買', '自行購買物料', '不需要購買'];
      if (rec.buy && !buyOptions.includes(rec.buy)) buyOptions.unshift(rec.buy);
      const supportOptions = ['不需要', '須外界支援', '已聯絡承辦商'];
      if (rec.support && !supportOptions.includes(rec.support)) supportOptions.unshift(rec.support);
      const dateValue = normalizeDateForInput(rec.completionDate);

      // 純文字欄位 vs 全部總表可編輯欄位
      const buyCellHtml = isReadOnlySubView
        ? '<span class="text-[12.5px] font-medium text-[#415E91]">' + escapeHtml(rec.buy || '不需要購買') + '</span>'
        : '<select onchange="updateRecordField(\'' + rec.id + '\', \'buy\', this.value)" class="px-2 py-1 rounded-lg border border-[#9BD2E4] bg-white text-[12px]">' +
            buyOptions.map(function(opt) { return '<option value="' + escapeHtml(opt) + '" ' + (rec.buy === opt ? 'selected' : '') + '>' + escapeHtml(opt) + '</option>'; }).join('') +
          '</select>';

      const dateCellHtml = isReadOnlySubView
        ? '<span class="text-[12px] font-mono text-[#5B81B2]">' + (dateValue ? escapeHtml(dateValue) : '—') + '</span>'
        : '<input type="date" value="' + escapeHtml(dateValue) + '" onchange="updateRecordField(\'' + rec.id + '\', \'completionDate\', this.value)" class="px-2 py-1 rounded-lg border border-[#9BD2E4] bg-white text-[12px] font-mono" />';

      const supportCellHtml = isReadOnlySubView
        ? '<span class="text-[12.5px] text-[#415E91]">' + escapeHtml(rec.support || '不需要') + '</span>'
        : '<select onchange="updateRecordField(\'' + rec.id + '\', \'support\', this.value)" class="px-2 py-1 rounded-lg border border-[#9BD2E4] bg-white text-[12px]">' +
            supportOptions.map(function(opt) { return '<option value="' + escapeHtml(opt) + '" ' + (rec.support === opt ? 'selected' : '') + '>' + escapeHtml(opt) + '</option>'; }).join('') +
          '</select>';

      const remarkCellHtml = isReadOnlySubView
        ? '<span class="text-[12.5px] text-[#5B81B2]">' + (rec.remark ? escapeHtml(rec.remark) : '—') + '</span>'
        : '<input type="text" value="' + escapeHtml(rec.remark || '') + '" onchange="updateRecordField(\'' + rec.id + '\', \'remark\', this.value)" placeholder="備註..." class="w-full min-w-[120px] px-2 py-1 rounded-lg border border-[#9BD2E4] bg-white text-[12px]" />';

      const statusCellHtml = isReadOnlySubView
        ? (isCompleted
            ? '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11.5px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">已完成</span>'
            : '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11.5px] font-bold bg-amber-50 text-amber-700 border border-amber-200">待處理</span>')
        : '<select onchange="updateRecordField(\'' + rec.id + '\', \'status\', this.value)" class="px-2 py-1 rounded-lg border ' + (isCompleted ? 'border-emerald-300 bg-emerald-50 text-emerald-800' : 'border-amber-300 bg-amber-50 text-amber-800') + ' text-[12px] font-bold">' +
            '<option value="待處理" ' + (!isCompleted ? 'selected' : '') + '>待處理</option><option value="已完成" ' + (isCompleted ? 'selected' : '') + '>已完成</option>' +
          '</select>';

      // 4. 快捷操作刪除「已結案」「完成」按鈕，只保留「刪除」按鈕
      return '<tr class="bg-white hover:bg-[#BDF2F6]/25 transition-colors">' +
        '<td class="py-2.5 px-3.5 border-r border-[#BDF2F6] text-[11.5px] text-[#5B81B2] font-mono whitespace-nowrap">' + escapeHtml(rec.timestamp) + '</td>' +
        '<td class="py-2.5 px-3 border-r border-[#BDF2F6] font-bold text-[#415E91] whitespace-nowrap">' + escapeHtml(rec.reporter) + '</td>' +
        '<td class="py-2.5 px-2.5 border-r border-[#BDF2F6] text-center whitespace-nowrap"><span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-[#BDF2F6]/60 border border-[#9BD2E4]">' + typeIcon + '</span></td>' +
        '<td class="py-2.5 px-3 border-r border-[#BDF2F6] whitespace-nowrap">' + areaBadge + '</td>' +
        '<td class="py-2.5 px-3 border-r border-[#BDF2F6] font-bold text-[#415E91] whitespace-nowrap">' + escapeHtml(rec.location) + '</td>' +
        '<td class="py-2.5 px-3.5 border-r border-[#BDF2F6] text-[12.5px] text-[#415E91] max-w-[260px] break-words">' + escapeHtml(rec.description) + '</td>' +
        '<td class="py-2.5 px-3 border-r border-[#BDF2F6] text-center whitespace-nowrap">' + mediaCell + '</td>' +
        '<td class="py-2.5 px-3 border-r border-[#BDF2F6] whitespace-nowrap">' + buyCellHtml + '</td>' +
        '<td class="py-2.5 px-3 border-r border-[#BDF2F6] whitespace-nowrap">' + dateCellHtml + '</td>' +
        '<td class="py-2.5 px-3 border-r border-[#BDF2F6] whitespace-nowrap">' + supportCellHtml + '</td>' +
        '<td class="py-2.5 px-3 border-r border-[#BDF2F6]">' + remarkCellHtml + '</td>' +
        '<td class="py-2.5 px-3 border-r border-[#BDF2F6] whitespace-nowrap">' + statusCellHtml + '</td>' +
        '<td class="py-2.5 px-3.5 text-center whitespace-nowrap">' +
          '<button type="button" onclick="openDeleteConfirmModal(\'' + rec.id + '\')" class="px-2.5 py-1 rounded-lg text-[12px] font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 border border-rose-200 cursor-pointer">刪除</button>' +
        '</td></tr>';
    }).join('');
  }

  function renderMobileCards(container, pageItems) {
    const isReadOnlySubView = !(filters.area === 'ALL' && filters.status === 'ALL' && filters.buy === 'ALL');

    container.innerHTML = pageItems.map(function(rec) {
      const isCompleted = rec.status === '已完成' || Boolean(rec.completionDate);
      const typeIcon = String(rec.type || '').startsWith('水電') ? '⚡' : '🔨';
      const isExpanded = Boolean(expandedCardMap[rec.id]);
      const areaBadge = rec.colD === '日校'
        ? '<span class="px-2 py-0.5 rounded-md text-[11.5px] font-bold bg-[#BDF2F6]/80 text-[#415E91] border border-[#9BD2E4]">日校</span>'
        : '<span class="px-2 py-0.5 rounded-md text-[11.5px] font-bold bg-[#9BD2E4]/50 text-[#415E91] border border-[#779EC8]">宿舍</span>';
      const statusBadge = isCompleted
        ? '<span class="px-2.5 py-0.5 rounded-full text-[11.5px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 shrink-0">已完成</span>'
        : '<span class="px-2.5 py-0.5 rounded-full text-[11.5px] font-bold bg-amber-50 text-amber-700 border border-amber-200 shrink-0">待處理</span>';

      const rawMediaText = String(rec.photoUpload || '').trim();
      const isEmptyMediaText = !rawMediaText || ['無', '沒有', '否', '-', '—', 'N/A'].includes(rawMediaText);
      const hasMediaFlag = !isEmptyMediaText || Boolean(rec.photoUrl || rec.mediaDataUrl);
      const thumbSrc = getRecordThumbnailUrl(rec);

      const mediaBlock = hasMediaFlag
        ? '<button type="button" onclick="openMediaPreview(\'' + rec.id + '\')" class="w-full mt-2.5 p-2 rounded-xl bg-[#f0fbfc] active:bg-[#BDF2F6] border border-[#779EC8] text-[#415E91] flex items-center justify-between gap-2.5">' +
            '<div class="flex items-center gap-2.5 min-w-0 pointer-events-none">' +
              (thumbSrc ? '<img id="card-thumb-' + rec.id + '" src="' + escapeHtml(thumbSrc) + '" class="w-11 h-11 rounded-lg object-cover border border-[#779EC8]/70 bg-white shrink-0" onerror="this.style.display=\'none\'" />' : '<div class="w-11 h-11 rounded-lg bg-[#BDF2F6] flex items-center justify-center shrink-0">🖼️</div>') +
              '<div class="text-left min-w-0"><p class="text-[13px] font-bold truncate">檢視現場相片 / 影片</p><p class="text-[11px] text-[#5B81B2]">點擊直接開啟放大預覽</p></div>' +
            '</div><span class="px-2.5 py-1 rounded-lg bg-[#415E91] text-white text-[11.5px] font-bold shrink-0">開啟</span></button>'
        : '';

      const buyOptions = ['待中央購買', '自行購買物料', '不需要購買'];
      if (rec.buy && !buyOptions.includes(rec.buy)) buyOptions.unshift(rec.buy);
      const supportOptions = ['不需要', '須外界支援', '已聯絡承辦商'];
      if (rec.support && !supportOptions.includes(rec.support)) supportOptions.unshift(rec.support);
      const dateValue = normalizeDateForInput(rec.completionDate);

      const footerActions = isReadOnlySubView
        ? '<div class="mt-3 pt-2.5 border-t border-[#BDF2F6] flex items-center justify-between gap-2 text-[12px] text-[#5B81B2]">' +
            '<span>材料：' + escapeHtml(rec.buy || '不需要購買') + (dateValue ? ' ・ 完成：' + escapeHtml(dateValue) : '') + '</span>' +
            '<button type="button" onclick="openDeleteConfirmModal(\'' + rec.id + '\')" class="px-3 py-1.5 rounded-xl text-[12px] font-bold text-rose-600 bg-rose-50 border border-rose-200 shrink-0">刪除</button>' +
          '</div>'
        : '<div class="mt-3 pt-2.5 border-t border-[#BDF2F6] flex items-center gap-2">' +
            '<button type="button" onclick="toggleCardAccordion(\'' + rec.id + '\')" class="flex-1 py-2 px-3 rounded-xl bg-[#f0fbfc] border border-[#9BD2E4] flex items-center justify-between text-left">' +
              '<span id="acc-label-' + rec.id + '" class="text-[12.5px] font-bold text-[#415E91] truncate">' + (isExpanded ? '收疊編輯面板' : '編輯狀態 / 日期 / 物料 / 刪除') + '</span>' +
              '<span id="acc-chev-' + rec.id + '" class="accordion-chevron text-[#5B81B2] ' + (isExpanded ? 'is-open' : '') + '">▼</span></button></div>' +
          '<div id="acc-panel-' + rec.id + '" class="' + (isExpanded ? '' : 'hidden ') + 'mt-2.5 p-3.5 rounded-2xl bg-[#f0fbfc] border border-[#9BD2E4] space-y-3">' +
            '<div class="grid grid-cols-2 gap-2.5"><div><label class="block text-[11.5px] font-bold text-[#5B81B2] mb-1">處理狀態</label><select onchange="updateRecordField(\'' + rec.id + '\', \'status\', this.value)" class="w-full px-2.5 py-2 rounded-xl border bg-white font-bold"><option value="待處理" ' + (!isCompleted ? 'selected' : '') + '>待處理</option><option value="已完成" ' + (isCompleted ? 'selected' : '') + '>已完成</option></select></div>' +
            '<div><label class="block text-[11.5px] font-bold text-[#5B81B2] mb-1">完成日期</label><input type="date" value="' + escapeHtml(dateValue) + '" onchange="updateRecordField(\'' + rec.id + '\', \'completionDate\', this.value)" class="w-full px-2.5 py-2 rounded-xl border border-[#9BD2E4] bg-white" /></div></div>' +
            '<div class="grid grid-cols-2 gap-2.5"><div><label class="block text-[11.5px] font-bold text-[#5B81B2] mb-1">材料購買</label><select onchange="updateRecordField(\'' + rec.id + '\', \'buy\', this.value)" class="w-full px-2.5 py-2 rounded-xl border border-[#9BD2E4] bg-white">' +
              buyOptions.map(function(opt) { return '<option value="' + escapeHtml(opt) + '" ' + (rec.buy === opt ? 'selected' : '') + '>' + escapeHtml(opt) + '</option>'; }).join('') + '</select></div>' +
            '<div><label class="block text-[11.5px] font-bold text-[#5B81B2] mb-1">須外界支援</label><select onchange="updateRecordField(\'' + rec.id + '\', \'support\', this.value)" class="w-full px-2.5 py-2 rounded-xl border border-[#9BD2E4] bg-white">' +
              supportOptions.map(function(opt) { return '<option value="' + escapeHtml(opt) + '" ' + (rec.support === opt ? 'selected' : '') + '>' + escapeHtml(opt) + '</option>'; }).join('') + '</select></div></div>' +
            '<div><label class="block text-[11.5px] font-bold text-[#5B81B2] mb-1">備註欄</label><input type="text" value="' + escapeHtml(rec.remark || '') + '" onchange="updateRecordField(\'' + rec.id + '\', \'remark\', this.value)" placeholder="輸入備註..." class="w-full px-3 py-2 rounded-xl border border-[#9BD2E4] bg-white" /></div>' +
            '<div class="pt-1 flex items-center gap-2"><button type="button" onclick="clearCompletionDate(\'' + rec.id + '\')" class="flex-1 py-2.5 px-3 rounded-xl text-[13px] font-bold text-[#415E91] bg-white border border-[#779EC8]">清除日期</button>' +
            '<button type="button" onclick="openDeleteConfirmModal(\'' + rec.id + '\')" class="flex-1 py-2.5 px-3 rounded-xl text-[13px] font-bold text-rose-600 bg-rose-50 border border-rose-200">刪除紀錄</button></div></div>';

      return '<article class="bg-white rounded-2xl p-4 border border-[#9BD2E4] shadow-card">' +
        '<div class="flex items-start justify-between gap-2"><div class="flex items-center gap-1.5 flex-wrap">' +
          '<span class="inline-flex items-center justify-center w-7 h-7 rounded-lg text-[14px] bg-[#BDF2F6]/70 border border-[#9BD2E4]">' + typeIcon + '</span>' +
          areaBadge + '<span class="text-[16px] font-bold text-[#415E91]">' + escapeHtml(rec.location) + '</span></div>' + statusBadge + '</div>' +
        '<p class="text-[14px] text-[#415E91] mt-2.5 bg-[#f0fbfc] p-3 rounded-xl border border-[#BDF2F6] leading-relaxed break-words">' + escapeHtml(rec.description) + '</p>' +
        '<div class="flex items-center justify-between text-[12px] text-[#5B81B2] mt-2.5"><span>呈報人：<strong class="text-[#415E91]">' + escapeHtml(rec.reporter) + '</strong></span><span class="font-mono text-[11px]">' + escapeHtml(rec.timestamp) + '</span></div>' +
        mediaBlock +
        footerActions +
        '</article>';
    }).join('');
  }

  function toggleCardAccordion(id) {
    expandedCardMap[id] = !expandedCardMap[id];
    const panel = document.getElementById('acc-panel-' + id);
    const chevron = document.getElementById('acc-chev-' + id);
    const label = document.getElementById('acc-label-' + id);
    if (panel) panel.classList.toggle('hidden', !expandedCardMap[id]);
    if (chevron) chevron.classList.toggle('is-open', expandedCardMap[id]);
    if (label) label.textContent = expandedCardMap[id] ? '收疊編輯面板' : '編輯狀態 / 日期 / 物料 / 刪除';
  }

  function toggleAllAccordions() {
    isAllExpanded = !isAllExpanded;
    records.forEach(function(r) { expandedCardMap[r.id] = isAllExpanded; });
    const btn = document.getElementById('expandAllToggleBtn');
    if (btn) btn.textContent = isAllExpanded ? '收疊全部' : '展開全部';
    renderAllViews();
  }

  function quickMarkCompleted(id) { updateRecordField(id, 'completionDate', new Date().toISOString().split('T')[0]); }
  function clearCompletionDate(id) { updateRecordField(id, 'completionDate', ''); showToast('已清除完成日期並回復為待處理', 'info'); }

  function extractGoogleDriveFileId(url) {
    if (!url) return '';
    const str = String(url).trim();
    const dMatch = str.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (dMatch) return dMatch[1];
    const idMatch = str.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (idMatch) return idMatch[1];
    return '';
  }

  function getRecordThumbnailUrl(rec) {
    if (rec.mediaDataUrl && rec.mediaType !== 'video') return rec.mediaDataUrl;
    const driveId = extractGoogleDriveFileId(rec.photoUrl || rec.photoUpload);
    return driveId ? ('https://lh3.googleusercontent.com/d/' + driveId + '=s240') : '';
  }

  const sessionMediaCache = {};
  const inflightMediaPromises = {};

  function renderMediaDataUrlIntoContainer(content, dataUrl, mimeType) {
    const isVideo = (mimeType && mimeType.startsWith('video/')) || String(dataUrl).startsWith('data:video/');
    content.innerHTML = isVideo
      ? '<video src="' + dataUrl + '" controls autoplay playsinline class="w-full max-h-[70vh] rounded-xl bg-black"></video>'
      : '<img src="' + dataUrl + '" alt="現場相片" class="w-full max-h-[72vh] rounded-xl object-contain bg-white" />';
  }

  function fetchDriveMediaViaGasProxy(driveId) {
    if (sessionMediaCache[driveId]) return Promise.resolve(sessionMediaCache[driveId]);
    if (inflightMediaPromises[driveId]) return inflightMediaPromises[driveId];

    const promise = (async function() {
      try {
        let resObj = null;
        if (isGasNativeAvailable()) {
          const raw = await runGasServerFunction('apiGetDriveMediaBase64', driveId, 20000);
          resObj = (typeof raw === 'string') ? JSON.parse(raw) : raw;
        } else {
          const sep = GAS_WEB_APP_URL.includes('?') ? '&' : '?';
          const resp = await fetch(GAS_WEB_APP_URL + sep + 'action=get_image&fileId=' + encodeURIComponent(driveId), { method: 'GET', redirect: 'follow' });
          resObj = await resp.json();
        }
        if (resObj && resObj.status === 'success' && resObj.dataUrl) {
          sessionMediaCache[driveId] = resObj;
          const matchedRec = records.find(function(r) { return extractGoogleDriveFileId(r.photoUrl || r.photoUpload) === driveId; });
          if (matchedRec) {
            matchedRec.mediaDataUrl = resObj.dataUrl;
            matchedRec.mediaType = (resObj.mimeType && resObj.mimeType.startsWith('video/')) ? 'video' : 'image';
          }
        }
        return resObj;
      } finally {
        delete inflightMediaPromises[driveId];
      }
    })();
    inflightMediaPromises[driveId] = promise;
    return promise;
  }

  function preloadVisiblePendingMedia() {
    const filtered = getFilteredAndSortedRecords();
    const startIdx = (currentPage - 1) * PAGE_SIZE;
    const pageItems = filtered.slice(startIdx, startIdx + PAGE_SIZE);
    let preloadCount = 0;
    for (let i = 0; i < pageItems.length; i++) {
      const rec = pageItems[i];
      if (preloadCount >= 5) break;
      if (rec.mediaDataUrl) continue;
      const rawUrl = (rec.photoUrl && rec.photoUrl.startsWith('http')) ? rec.photoUrl : (rec.photoUpload && rec.photoUpload.startsWith('http') ? rec.photoUpload : '');
      const driveId = extractGoogleDriveFileId(rawUrl);
      if (driveId && !sessionMediaCache[driveId] && !inflightMediaPromises[driveId]) {
        preloadCount++;
        (function(rId, dId, delay) {
          setTimeout(function() {
            fetchDriveMediaViaGasProxy(dId).then(function(res) {
              if (res && res.status === 'success' && res.dataUrl) {
                ['card-thumb-' + rId, 'dthumb-' + rId].forEach(function(elId) {
                  const img = document.getElementById(elId);
                  if (img) { img.src = res.dataUrl; img.style.display = 'block'; }
                });
              }
            }).catch(function() {});
          }, delay);
        })(rec.id, driveId, preloadCount * 200);
      }
    }
  }

  async function openMediaPreview(id) {
    const rec = records.find(function(r) { return r.id === id; });
    if (!rec) return;
    document.getElementById('modalMediaTitle').textContent = rec.location + ' — 現場附件';
    document.getElementById('modalMediaMeta').textContent = '呈報人：' + rec.reporter + ' ・ ' + rec.colD + ' ・ ' + rec.timestamp;
    const content = document.getElementById('modalMediaContent');
    const rawUrl = (rec.photoUrl && rec.photoUrl.startsWith('http')) ? rec.photoUrl : (rec.photoUpload && rec.photoUpload.startsWith('http') ? rec.photoUpload : '');
    const driveId = extractGoogleDriveFileId(rawUrl);

    if (rec.mediaDataUrl) {
      renderMediaDataUrlIntoContainer(content, rec.mediaDataUrl, rec.mediaType === 'video' ? 'video/mp4' : 'image/jpeg');
      openModal('mediaModal');
      return;
    }

    if (driveId) {
      if (sessionMediaCache[driveId]) {
        renderMediaDataUrlIntoContainer(content, sessionMediaCache[driveId].dataUrl, sessionMediaCache[driveId].mimeType);
        openModal('mediaModal');
        return;
      }
      content.innerHTML = '<div class="py-10 text-center text-white"><p class="text-[14px] font-bold text-[#BDF2F6]">正在快速載入現場相片...</p></div>';
      openModal('mediaModal');
      try {
        const proxyRes = await fetchDriveMediaViaGasProxy(driveId);
        if (proxyRes && proxyRes.status === 'success' && proxyRes.dataUrl) {
          renderMediaDataUrlIntoContainer(content, proxyRes.dataUrl, proxyRes.mimeType);
          return;
        }
      } catch (err) {}
      content.innerHTML = '<iframe src="https://drive.google.com/file/d/' + escapeHtml(driveId) + '/preview" class="w-full h-[65vh] rounded-xl border-0 bg-white" allow="autoplay"></iframe>';
      return;
    }

    // 5. 「試算表已標記「有」現場附件」更改「此為舊版 Google 表單直接上傳，無內嵌預覽圖。」
    content.innerHTML = rawUrl
      ? '<img src="' + escapeHtml(rawUrl) + '" class="w-full max-h-[72vh] rounded-xl object-contain bg-white" />'
      : '<div class="bg-white rounded-xl p-6 text-center"><p class="text-[14.5px] font-bold text-[#415E91]">此為舊版 Google 表單直接上傳，無內嵌預覽圖。</p></div>';
    openModal('mediaModal');
  }

  function isGasNativeAvailable() {
    try { return typeof window.google !== 'undefined' && Boolean(window.google.script) && Boolean(window.google.script.run); }
    catch (e) { return false; }
  }

  function runGasServerFunction(fnName, arg, timeoutMs) {
    return new Promise(function(resolve, reject) {
      let settled = false;
      const timer = setTimeout(function() { if (!settled) { settled = true; reject(new Error('雲端連線逾時')); } }, timeoutMs || 10000);
      try {
        const runner = window.google.script.run
          .withSuccessHandler(function(res) { if (!settled) { settled = true; clearTimeout(timer); resolve(res); } })
          .withFailureHandler(function(err) { if (!settled) { settled = true; clearTimeout(timer); reject(new Error(err && err.message ? err.message : String(err))); } });
        if (arg !== undefined) runner[fnName](arg);
        else runner[fnName]();
      } catch (err) { if (!settled) { settled = true; clearTimeout(timer); reject(err); } }
    });
  }

  function loadLocalData() {
    try {
      const rawRecords = localStorage.getItem(STORAGE_KEY);
      if (rawRecords) {
        const parsed = JSON.parse(rawRecords);
        records = Array.isArray(parsed) ? parsed.map(function(item, idx) { return normalizeRecordItem(item, idx); }) : [];
      }
      const rawOps = localStorage.getItem(PENDING_OPS_STORAGE_KEY);
      if (rawOps) {
        const parsedOps = JSON.parse(rawOps);
        if (Array.isArray(parsedOps)) pendingSyncOps = parsedOps;
      }
    } catch (e) { records = []; }
    updateSyncButtonUI();
  }

  function saveLocalData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      localStorage.setItem(PENDING_OPS_STORAGE_KEY, JSON.stringify(pendingSyncOps));
    } catch (e) {}
    updateCounters();
    updateSyncButtonUI();
  }

  function updateSyncButtonUI() {
    const badge = document.getElementById('syncBtnBadge');
    if (!badge) return;
    badge.textContent = pendingSyncOps.length;
    badge.classList.toggle('hidden', pendingSyncOps.length === 0);
  }

  function updateCounters() {
    const total = records.length;
    const completed = records.filter(function(r) { return r.status === '已完成' || Boolean(r.completionDate); }).length;
    const pending = total - completed;
    const dayCount = records.filter(function(r) { return r.colD === '日校'; }).length;
    const dormCount = records.filter(function(r) { return r.colD === '宿舍'; }).length;

    const setText = function(id, val) { const el = document.getElementById(id); if (el) el.textContent = val; };
    setText('badge-pending', pending); setText('badge-completed', completed);
    setText('bnavTotalBadge', total); setText('bnavPendingBadge', pending);
    setText('dcount-all', total); setText('dcount-pending', pending); setText('dcount-completed', completed);
    setText('dcount-day', dayCount); setText('dcount-dorm', dormCount);
    setText('mcount-all', total); setText('mcount-pending', pending); setText('mcount-completed', completed);
    setText('mcount-day', dayCount); setText('mcount-dorm', dormCount);
  }

  function sanitizeCellText(val) {
    return (val === null || val === undefined) ? '' : String(val).replace(/[\r\n\t\x00-\x1F]+/g, ' ').trim();
  }

  function normalizeDateForInput(rawVal) {
    if (!rawVal) return '';
    const str = String(rawVal).trim();
    if (/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(str)) {
      const parts = str.split(' ')[0].split(/[-/]/);
      return parts[0] + '-' + parts[1].padStart(2, '0') + '-' + parts[2].padStart(2, '0');
    }
    return '';
  }

  function normalizeRecordItem(item, idx) {
    const ts = sanitizeCellText(item.timestamp);
    const rep = sanitizeCellText(item.reporter);
    const loc = sanitizeCellText(item.location);
    const photo = sanitizeCellText(item.photoUpload);
    const cDate = normalizeDateForInput(sanitizeCellText(item.completionDate));
    const pUrl = sanitizeCellText(item.photoUrl);
    const driveId = extractGoogleDriveFileId(pUrl || photo);
    const cachedProxy = driveId ? sessionMediaCache[driveId] : null;

    return {
      id: 'gas-' + (item.rowIndex || idx) + '-' + String(ts || idx),
      rowIndex: item.rowIndex || (idx + 2),
      timestamp: ts,
      reporter: rep,
      type: sanitizeCellText(item.type),
      colD: sanitizeCellText(item.colD) || '日校',
      location: loc,
      description: sanitizeCellText(item.description),
      photoUpload: photo,
      buy: sanitizeCellText(item.buy) || '不需要購買',
      completionDate: cDate,
      support: sanitizeCellText(item.support) || '不需要',
      remark: sanitizeCellText(item.remark),
      status: sanitizeCellText(item.status) || (cDate ? '已完成' : '待處理'),
      photoUrl: pUrl,
      mediaDataUrl: item.mediaDataUrl || (cachedProxy ? cachedProxy.dataUrl : ''),
      mediaType: item.mediaType || (cachedProxy ? ((cachedProxy.mimeType && cachedProxy.mimeType.startsWith('video/')) ? 'video' : 'image') : 'image')
    };
  }

  let isFetchingFromGas = false;
  let isManualSyncing = false;

  async function fetchRecordsFromGas(showFeedback, isBackgroundPoll) {
    if (isFetchingFromGas) return;
    isFetchingFromGas = true;
    try {
      let payload = null;
      if (isGasNativeAvailable()) {
        const raw = await runGasServerFunction('apiReadAllData', undefined, 10000);
        payload = (typeof raw === 'string') ? JSON.parse(raw) : raw;
      } else {
        const sep = GAS_WEB_APP_URL.includes('?') ? '&' : '?';
        const res = await fetch(GAS_WEB_APP_URL + sep + 'action=read&t=' + Date.now(), { method: 'GET', redirect: 'follow' });
        payload = await res.json();
      }
      if (payload && payload.status === 'error') throw new Error(payload.message || '雲端讀取錯誤');
      const rawList = Array.isArray(payload) ? payload : (payload && payload.records ? payload.records : []);
      records = rawList.map(function(item, idx) { return normalizeRecordItem(item, idx); });
      saveLocalData();
      const activeTag = document.activeElement ? document.activeElement.tagName : '';
      const isEditingInput = (activeTag === 'INPUT' || activeTag === 'SELECT' || activeTag === 'TEXTAREA') && document.activeElement.id !== 'searchKeywordInput';
      if (!isBackgroundPoll || !isEditingInput) renderAllViews();
      if (showFeedback) showToast('已同步最新 ' + records.length + ' 筆雲端資料', 'success');
    } catch (err) {
      if (showFeedback) showToast('同步失敗：' + err.message, 'error');
    } finally {
      isFetchingFromGas = false;
    }
  }

  async function syncToCloud(showFeedback) {
    if (isManualSyncing) return;
    isManualSyncing = true;
    const icon = document.getElementById('syncBtnIcon');
    if (icon) icon.classList.add('animate-spin');
    try {
      if (pendingSyncOps.length > 0) {
        const snapshot = pendingSyncOps.slice();
        for (let i = 0; i < snapshot.length; i++) {
          const op = snapshot[i];
          const res = await postToGas(op);
          if (res && res.status === 'success') pendingSyncOps = pendingSyncOps.filter(function(item) { return item !== op; });
        }
        saveLocalData();
      }
      await fetchRecordsFromGas(showFeedback, false);
    } finally {
      isManualSyncing = false;
      if (icon) icon.classList.remove('animate-spin');
    }
  }

  async function postToGas(payload) {
    if (isGasNativeAvailable()) {
      const rawRes = await runGasServerFunction('apiHandleAction', JSON.stringify(payload), 12000);
      return (typeof rawRes === 'string') ? JSON.parse(rawRes) : rawRes;
    }
    const jsonStr = JSON.stringify(payload);
    if (encodeURIComponent(jsonStr).length < 6000) {
      const sep = GAS_WEB_APP_URL.includes('?') ? '&' : '?';
      const res = await fetch(GAS_WEB_APP_URL + sep + 'payload=' + encodeURIComponent(jsonStr) + '&t=' + Date.now(), { method: 'GET', redirect: 'follow' });
      return await res.json();
    }
    const res = await fetch(GAS_WEB_APP_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: jsonStr });
    return await res.json();
  }

  async function updateRecordField(id, field, value) {
    const idx = records.findIndex(function(r) { return r.id === id; });
    if (idx === -1) return;
    records[idx][field] = value;
    if (field === 'status') {
      if (value === '已完成' && !records[idx].completionDate) records[idx].completionDate = new Date().toISOString().split('T')[0];
      else if (value === '待處理') records[idx].completionDate = '';
    } else if (field === 'completionDate') {
      records[idx].status = value ? '已完成' : '待處理';
    }
    saveLocalData();
    renderAllViews();

    const updatePayload = {
      action: 'update_field', changedField: field, rowIndex: records[idx].rowIndex || '',
      timestamp: records[idx].timestamp, reporter: records[idx].reporter, location: records[idx].location,
      buy: records[idx].buy, completionDate: records[idx].completionDate, support: records[idx].support,
      remark: records[idx].remark, status: records[idx].status
    };

    try {
      const res = await postToGas(updatePayload);
      if (res && res.status === 'success') showToast('已同步更新至雲端', 'success');
      else { pendingSyncOps.push(updatePayload); saveLocalData(); showToast('已暫存修改，請點擊同步圖示', 'info'); }
    } catch (err) {
      pendingSyncOps.push(updatePayload); saveLocalData(); showToast('已暫存修改，稍後自動同步', 'info');
    }
  }

  let pendingDeleteId = null;
  function openDeleteConfirmModal(id) {
    const rec = records.find(function(r) { return r.id === id; });
    if (!rec) return;
    pendingDeleteId = id;
    document.getElementById('deleteConfirmDesc').textContent = '確定要刪除「' + rec.location + '」（呈報人：' + rec.reporter + '）的維修紀錄嗎？';
    openModal('deleteConfirmModal');
  }

  async function confirmDeleteRecord() {
    if (!pendingDeleteId) return;
    const idx = records.findIndex(function(r) { return r.id === pendingDeleteId; });
    if (idx === -1) { closeModal('deleteConfirmModal'); return; }
    const target = records[idx];
    records.splice(idx, 1);
    saveLocalData();
    renderAllViews();
    closeModal('deleteConfirmModal');

    const delPayload = { action: 'delete_record', rowIndex: target.rowIndex || '', timestamp: target.timestamp, reporter: target.reporter, location: target.location };
    try {
      const res = await postToGas(delPayload);
      if (res && res.status === 'success') showToast('已從雲端刪除該筆紀錄', 'success');
      else { pendingSyncOps.push(delPayload); saveLocalData(); showToast('已暫存刪除，請點擊同步圖示', 'info'); }
    } catch (err) {
      pendingSyncOps.push(delPayload); saveLocalData(); showToast('已暫存刪除，稍後自動同步', 'info');
    }
  }

  function openModal(id) { const el = document.getElementById(id); if (el) el.classList.remove('hidden'); }
  function closeModal(id) { const el = document.getElementById(id); if (el) el.classList.add('hidden'); if (id === 'deleteConfirmModal') pendingDeleteId = null; }

  let toastTimer = null;
  function showToast(message, type) {
    const toast = document.getElementById('appToast');
    const dot = document.getElementById('toastDot');
    const msgEl = document.getElementById('toastMessage');
    if (!toast || !msgEl) return;
    msgEl.textContent = message;
    if (dot) dot.className = 'w-2.5 h-2.5 rounded-full shrink-0 ' + (type === 'error' ? 'bg-rose-400' : (type === 'info' ? 'bg-sky-300' : 'bg-emerald-400'));
    toast.classList.remove('translate-y-[160%]', 'opacity-0');
    toast.classList.add('translate-y-0', 'opacity-100');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      toast.classList.remove('translate-y-0', 'opacity-100');
      toast.classList.add('translate-y-[160%]', 'opacity-0');
    }, 3000);
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; });
  }
</script>
